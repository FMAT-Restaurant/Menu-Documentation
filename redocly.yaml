extends:
  - recommended

rules:
  # OPEN-010 cerrada (contrato 8.0.0): el contrato define servidores y seguridad global.
  no-empty-servers: error
  security-defined: error
  no-unresolved-refs: error
  operation-operationId: error
  operation-operationId-unique: error
  operation-2xx-response: error
  operation-4xx-response: error
  no-invalid-media-type-examples: error
  rule/media-type-schema-and-examples:
    subject:
      type: MediaType
    assertions:
      required:
        - schema
        - examples
  rule/write-operation-request-body:
    subject:
      type: Operation
      filterInParentKeys:
        - post
        - put
        - patch
    assertions:
      required:
        - requestBody
