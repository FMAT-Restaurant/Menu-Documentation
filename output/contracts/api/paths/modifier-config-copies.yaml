parameters:
- name: menuId
  in: path
  required: true
  description: Identificador lógico opaco de menuId.
  schema:
    type: string
    minLength: 1
- name: itemId
  in: path
  required: true
  description: Identificador lógico opaco de itemId.
  schema:
    type: string
    minLength: 1
post:
  tags:
  - Modificadores
  operationId: copyModifierConfigs
  summary: Copiar excepciones comerciales entre variantes
  description: Copia VariantModifierConfig desde una variante hoja a una o más variantes del mismo ítem; aplica
    de modo atómico la política explícita FAIL o REPLACE ante conflictos. No copia efectos culinarios ni disponibilidad
    operacional.
  x-consumer: Administración de Menú (UI)
  x-access-class: ADMIN
  x-ers-refs:
  - REQ-MENU-MOD-004
  - REQ-MENU-MOD-003
  - BR-MENU-014
  - BR-MENU-015
  responses:
    '200':
      description: Copiar excepciones comerciales entre variantes. Resultado de copia de excepciones comerciales.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ModifierConfigCopyResult.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ModifierConfigCopyRequest.yaml
        example:
          sourceVariantId: variant-small
          targetVariantIds:
          - variant-large
          conflictPolicy: FAIL
