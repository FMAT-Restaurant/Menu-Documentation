parameters:
- name: menuId
  in: path
  required: true
  description: Identificador lógico opaco de menuId.
  schema:
    type: string
    minLength: 1
get:
  tags:
  - Revisiones
  operationId: listPendingReviews
  summary: Consultar revisiones administrativas
  description: Lista variantes con causas culinarias CULINARY y configuraciones de combo con causas PRICE, COMPOSITION,
    MODIFIERS o STATUS propagadas, junto con observado, confirmado y estado agregado de MenuItem COMBO. Disponibilidad
    y cambios cosméticos no generan REVIEW_REQUIRED; la revisión pendiente no bloquea por sí sola la venta.
  x-consumer: Administración de Menú (UI)
  x-access-class: ADMIN
  x-ers-refs:
  - REQ-MENU-REV-001
  - REQ-MENU-REV-002
  - REQ-MENU-REV-003
  - REQ-MENU-REV-006
  - BR-MENU-031
  responses:
    '200':
      description: Consultar revisiones administrativas. Revisiones y causas pendientes para administración.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReviewList.yaml
          example:
            variants:
            - itemId: item-cafe
              variantId: variant-default
              review:
                observedRevision: 0
                acknowledgedRevision: 0
                reviewStatus: UP_TO_DATE
                pendingReviewCauses: []
            comboConfigurations: []
            comboItems: []
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
