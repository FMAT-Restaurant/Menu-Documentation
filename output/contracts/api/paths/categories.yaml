collection:
  parameters:
    - $ref: '../components/parameters.yaml#/MenuId'
  get:
    tags: [Categorías]
    operationId: listMenuCategories
    summary: Consultar categorías del menú
    description: |
      REQ-MENU-CAT-001; cada categoría pertenece a un solo menú.
      page inicia en 1 y pageSize usa 20 por omisión, con máximo de 100.
      La respuesta informa page, pageSize, totalItems y totalPages.
    parameters:
      - $ref: '../components/parameters.yaml#/Page'
      - $ref: '../components/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Categorías del menú.
        content:
          application/json:
            schema: { $ref: '../components/schemas/pagination.yaml#/CategoryPage' }
            examples:
              primeraPagina: { $ref: '../components/examples.yaml#/CategoryPageFirst' }
              paginaSiguiente: { $ref: '../components/examples.yaml#/CategoryPageNext' }
              sinCategorias: { $ref: '../components/examples.yaml#/CategoryPageEmpty' }
      '400': { $ref: '../components/responses/errors.yaml#/OffsetPaginationBadRequest' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
  post:
    tags: [Categorías]
    operationId: createMenuCategory
    summary: Crear categoría
    description: REQ-MENU-CAT-001; BR-MENU-001; INV-MENU-001.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/catalog.yaml#/CategoryInput' }
          examples:
            nuevaCategoria: { $ref: '../components/examples.yaml#/CategoryInput' }
    responses:
      '201':
        description: Categoría creada.
        headers:
          Location:
            required: true
            description: URI del recurso creado, con categoryId igual al id de la categoría en el cuerpo.
            schema: { type: string, format: uri-reference }
            example: /api/v1/menus/menu-1/categories/cat-1
        content:
          application/json:
            schema: { $ref: '../components/schemas/catalog.yaml#/Category' }
            examples:
              creada: { $ref: '../components/examples.yaml#/Category' }
      '400': { $ref: '../components/responses/errors.yaml#/BadRequest' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
      '415': { $ref: '../components/responses/errors.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses/errors.yaml#/Unprocessable' }
item:
  parameters:
    - $ref: '../components/parameters.yaml#/MenuId'
    - $ref: '../components/parameters.yaml#/CategoryId'
  patch:
    tags: [Categorías]
    operationId: patchMenuCategory
    summary: Editar categoría
    description: |
      Actualiza solo los campos presentes; el omitido conserva su valor. No
      acepta null ni un cuerpo vacío. La categoría permanece en el menú de la
      URI y no se pueden cambiar id ni menuId. REQ-MENU-CAT-001.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/catalog.yaml#/CategoryPatch' }
          examples:
            cambiarNombre:
              summary: La descripción se conserva
              value: { name: Especialidades }
    responses:
      '200':
        description: Categoría actualizada.
        content:
          application/json:
            schema: { $ref: '../components/schemas/catalog.yaml#/Category' }
            examples:
              actualizada: { $ref: '../components/examples.yaml#/CategoryEdited' }
      '400': { $ref: '../components/responses/errors.yaml#/BadRequest' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
      '415': { $ref: '../components/responses/errors.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses/errors.yaml#/Unprocessable' }
