parameters:
- name: menuId
  in: path
  required: true
  description: Identificador lógico opaco de menuId.
  schema:
    type: string
    minLength: 1
- name: itemId
  in: path
  required: true
  description: Identificador lógico opaco de itemId.
  schema:
    type: string
    minLength: 1
get:
  tags:
  - Catálogo
  operationId: getCatalogItem
  summary: Consultar ítem del catálogo
  description: Expone opciones vendibles y modificadores comerciales efectivos de un ítem publicado. Elegibilidad
    estructural y disponibilidad operacional se presentan por separado; un ítem sin unidades elegibles no forma
    parte de la oferta. El precio del combo parte de ComboConfiguration.unitPrice, agrega deltas de opciones y modificadores
    y no suma los precios regulares de sus variantes componentes. La selección de órdenes queda a cargo de Orders
    + Kitchen.
  x-consumer: POS (UI) y otros canales de venta autorizados
  x-access-class: CHANNEL
  x-ers-refs:
  - REQ-MENU-PRC-002
  - REQ-MENU-PRC-003
  - REQ-MENU-MOD-005
  - REQ-MENU-COM-006
  - REQ-MENU-AVL-002
  - REQ-MENU-AVL-003
  - REQ-MENU-AVL-004
  - REQ-MENU-AVL-005
  - REQ-MENU-AVL-006
  - BR-MENU-008
  - BR-MENU-014
  - BR-MENU-021
  - BR-MENU-022
  - BR-MENU-023
  - BR-MENU-024
  responses:
    '200':
      description: Consultar ítem del catálogo. Proyección vendible del ítem y sus componentes.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CatalogItem.yaml
          example:
            item:
              id: item-cafe
              menuId: menu-1
              code: CAFE-001
              name: Café de la casa
              description: Café preparado al momento
              image: https://example.org/images/cafe.jpg
              itemType: PREPARED
            isStructurallyEligible: true
            isAvailable: true
            price:
              presentation: FIXED
              amount: 35
            variants:
            - id: variant-default
              unitPrice: 35
              dimensionSelections: []
              modifierGroups: []
              resolvedModifiers: []
              isAvailable: true
              availability:
                variantId: variant-default
                available: true
                lastUpdatedAt: '2026-09-24T12:00:00Z'
              preparationStatus:
                variantId: variant-default
                status: READY
                lastUpdatedAt: '2026-09-24T12:00:00Z'
            comboConfigurations: []
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
  x-open-issues:
  - OPEN-009
  - OPEN-010
