parameters:
- name: menuId
  in: path
  required: true
  description: Identificador lógico opaco de menuId.
  schema:
    type: string
    minLength: 1
- name: configurationId
  in: path
  required: true
  description: Identificador lógico opaco de configurationId.
  schema:
    type: string
    minLength: 1
post:
  tags:
  - Copias de combos
  operationId: copyComboConfiguration
  summary: Copiar a configuración de combo existente
  description: COPY_TO_EXISTING exige por cada slot de origen targetSlotId explícito o directiva explícita de crear
    slot nuevo; nombres y posiciones no se usan para matching. Cada destino se aplica completamente o se rechaza
    sin escrituras parciales.
  x-consumer: Administración de Menú (UI)
  x-access-class: ADMIN
  x-ers-refs:
  - REQ-MENU-COM-004
  - BR-MENU-026
  - BR-MENU-027
  - BR-MENU-028
  responses:
    '200':
      description: Copiar a configuración de combo existente. Resultado de copia a la configuración destino.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ComboCopyResult.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
  x-open-issues:
  - OPEN-002
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ComboCopyRequest.yaml
        example:
          targetConfigurationId: configuration-destination
          slotMappings:
          - sourceSlotId: slot-source
            targetSlotId: slot-destination
