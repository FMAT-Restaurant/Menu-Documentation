collection:
  parameters:
    - $ref: '../components/parameters.yaml#/MenuId'
  get:
    tags: [Catálogo]
    operationId: listPublishedCatalog
    summary: Consultar catálogo publicable
    description: |
      Presenta solo entradas ACTIVE con ofertas ACTIVE que satisfacen las reglas
      de publicación. Cada entrada mantiene su brandName y cada oferta su
      presentationTag, basePrice y composición. Las opciones INACTIVE no se
      ofrecen como elecciones nuevas. No decide OPEN-002 sobre defaultOfferId.
      Usa limit y un cursor opaco: omite cursor al iniciar y envía
      pagination.nextCursor para continuar con los mismos filtros y limit. Un
      nextCursor nulo indica que no hay otra página; no se calcula un total.
      REQ-MENU-CAT-002; BR-MENU-004/006/016; INV-MENU-002.
    parameters:
      - name: q
        in: query
        description: Búsqueda textual sobre identidad comercial.
        schema: { type: string }
        example: pollo
      - name: categoryId
        in: query
        description: Filtra por categoría del mismo menú.
        schema: { $ref: '../components/schemas/common.yaml#/Identifier' }
        example: cat-1
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Entradas publicables con sus ofertas vendibles.
        content:
          application/json:
            schema: { $ref: '../components/schemas/pagination.yaml#/PublishedCatalogPage' }
            examples:
              primeraPagina: { $ref: '../components/examples.yaml#/PublishedCatalogPageFirst' }
              paginaSiguiente: { $ref: '../components/examples.yaml#/PublishedCatalogPageNext' }
              sinCoincidencias: { $ref: '../components/examples.yaml#/PublishedCatalogPageEmpty' }
      '400': { $ref: '../components/responses/errors.yaml#/CursorPaginationBadRequest' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
entry:
  parameters:
    - $ref: '../components/parameters.yaml#/MenuId'
    - $ref: '../components/parameters.yaml#/EntryId'
  get:
    tags: [Catálogo]
    operationId: getPublishedCatalogEntry
    summary: Consultar detalle publicable de entrada
    description: |
      Devuelve una entrada publicable y sus ofertas vigentes; si la entrada
      o sus ofertas no son publicables, no expone un detalle comercial vigente.
      REQ-MENU-CAT-002 y REQ-MENU-OFFER-002.
    responses:
      '200':
        description: Entrada publicable.
        content:
          application/json:
            schema: { $ref: '../components/schemas/catalog.yaml#/PublishedEntry' }
            examples:
              entradaPublicable: { $ref: '../components/examples.yaml#/PublishedEntry' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
