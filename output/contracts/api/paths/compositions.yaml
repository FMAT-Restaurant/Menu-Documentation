item:
  parameters:
    - $ref: '../components/parameters.yaml#/MenuId'
    - $ref: '../components/parameters.yaml#/EntryId'
    - $ref: '../components/parameters.yaml#/OfferId'
  get:
    tags: [Composiciones]
    operationId: getOfferComposition
    summary: Consultar composición vigente
    description: |
      Incluye slots, regiones, alternativas de contenido, fuentes, ajustes
      locales y personalizaciones de la revisión vigente. REQ-MENU-COMP-001..006,
      REQ-MENU-CONT-001..004 y REQ-MENU-PERS-001..006.
    responses:
      '200':
        description: Composición vigente de la oferta.
        content:
          application/json:
            schema: { $ref: '../components/schemas/composition.yaml#/Composition' }
            examples:
              composicionVigente: { $ref: '../components/examples.yaml#/Composition' }
              conFuentesYPersonalizaciones: { $ref: '../components/examples.yaml#/CompositionWithSources' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
  put:
    tags: [Composiciones]
    operationId: replaceOfferComposition
    summary: Reemplazar composición completa
    description: |
      Sustituye la composición completa. El cuerpo incluye todos los campos
      requeridos de la rama automática o elegible; omitir una propiedad opcional
      la retira. No se admiten valores null. composition.id debe coincidir con
      el ID vigente. El cliente conserva los IDs anidados cuando representa la
      misma entidad, asigna IDs nuevos a las nuevas y omite las retiradas; cada
      referencia interna debe resolver en el cuerpo. Un contenido distinto crea
      una nueva revisión identificable de CatalogOffer; repetir el mismo cuerpo
      sobre la definición vigente devuelve la misma revisión, sin crear otra.
      Las referencias a revisiones previas no cambian. Rechaza slots sin
      alternativas, orígenes múltiples, límites inconsistentes, referencias
      inválidas, ciclos y personalizaciones fuera de la receta efectiva.
      Estas condiciones de contenido inválido devuelven 422.
      REQ-MENU-COMP-001..006,
      REQ-MENU-CONT-001..004, REQ-MENU-REC-002, REQ-MENU-PERS-001..006;
      INV-MENU-003..008.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/composition.yaml#/Composition' }
          examples:
            completa: { $ref: '../components/examples.yaml#/CompositionSelectable' }
            origenesYPersonalizaciones: { $ref: '../components/examples.yaml#/CompositionWithSources' }
    responses:
      '200':
        description: Composición vigente y revisión resultante; un envío idéntico conserva la revisión.
        content:
          application/json:
            schema: { $ref: '../components/schemas/catalog.yaml#/Offer' }
            examples:
              nuevaRevision: { $ref: '../components/examples.yaml#/OfferAfterCompositionPut' }
              envioIdentico: { $ref: '../components/examples.yaml#/OfferAfterCompositionPut' }
              origenesYPersonalizaciones: { $ref: '../components/examples.yaml#/OfferAfterSourceCompositionPut' }
      '400': { $ref: '../components/responses/errors.yaml#/BadRequest' }
      '404': { $ref: '../components/responses/errors.yaml#/NotFound' }
      '415': { $ref: '../components/responses/errors.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses/errors.yaml#/Unprocessable' }
