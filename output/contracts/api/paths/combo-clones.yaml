parameters:
- name: menuId
  in: path
  required: true
  description: Identificador lógico opaco de menuId.
  schema:
    type: string
    minLength: 1
- name: configurationId
  in: path
  required: true
  description: Identificador lógico opaco de configurationId.
  schema:
    type: string
    minLength: 1
post:
  tags:
  - Copias de combos
  operationId: cloneComboConfiguration
  summary: Clonar íntegramente configuración de combo
  description: FULL_CLONE crea una configuración completa con slots y opciones de identidades nuevas, sin inferir
    equivalencias por nombre u orden. La unidad de clonación es atómica y la nueva definición conserva reglas comerciales
    de elegibilidad.
  x-consumer: Administración de Menú (UI)
  x-access-class: ADMIN
  x-ers-refs:
  - REQ-MENU-COM-004
  - BR-MENU-026
  - BR-MENU-027
  - BR-MENU-028
  responses:
    '201':
      description: Clonar íntegramente configuración de combo. Configuración propietaria con slots, opciones y estados
        derivados.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ComboConfigurationDetail.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
  x-open-issues:
  - OPEN-002
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ComboCloneRequest.yaml
        example:
          targetItemId: item-combo-destination
