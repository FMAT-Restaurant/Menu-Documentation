parameters:
- name: menuId
  in: path
  required: true
  description: Identificador lógico opaco de menuId.
  schema:
    type: string
    minLength: 1
- name: configurationId
  in: path
  required: true
  description: Identificador lógico opaco de configurationId.
  schema:
    type: string
    minLength: 1
post:
  tags:
  - Revisiones
  operationId: acknowledgeComboReview
  summary: Confirmar revisión observada de configuración de combo
  description: Confirma sólo la observedRevision seleccionada; actualiza acknowledgedRevision y liquida causas atendidas
    sin perder cambios concurrentes posteriores. Conserva unitPrice, slots y opciones intactos y no genera nueva
    revisión comercial. La referencia visual saved/current/difference sigue siendo informativa.
  x-consumer: Administración de Menú (UI)
  x-access-class: ADMIN
  x-ers-refs:
  - REQ-MENU-REV-001
  - REQ-MENU-REV-003
  - REQ-MENU-REV-004
  - REQ-MENU-REV-005
  - BR-MENU-031
  responses:
    '200':
      description: Confirmar revisión observada de configuración de combo. Estado de revisión tras confirmar la
        revisión observada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReviewAcknowledgementResult.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
  x-open-issues:
  - OPEN-007
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReviewAcknowledgementRequest.yaml
        example:
          observedRevision: 8
