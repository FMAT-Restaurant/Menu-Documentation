openapi: 3.1.0
info:
  title: API síncrona de Menu/Catálogo
  version: 2.1.0
  description: |
    Contrato HTTP aceptado derivado de la ERS 2.1.0 y documentado en
    ../api-contract.md. Define las rutas, métodos, cuerpos, códigos y formatos
    de intercambio. Las reglas comerciales citadas proceden de la ERS. Solo
    cubre capacidades propias de Menu; las identidades de InventoryItem son
    referencias externas. Autenticación y autorización aún no tienen mecanismo
    ni política definidos y permanecen abiertas; su ausencia no determina que
    la API sea anónima o pública. Las reglas de concurrencia también permanecen
    abiertas. Se reservan respuestas reutilizables para integrar autenticación
    y autorización cuando se definan.
servers:
  - url: /api/v1
    description: Raíz aceptada de la API de Menu.
tags:
  - name: Catálogo
    description: Consulta de entradas y ofertas publicables de un menú.
  - name: Categorías
    description: Administración de la clasificación comercial de un menú.
  - name: Entradas
    description: Identidad comercial, estados y archivado de entradas.
  - name: Ofertas
    description: Presentaciones vendibles y sus revisiones comerciales.
  - name: Composiciones
    description: Slots, fuentes de contenido, recetas locales y personalizaciones por oferta.
  - name: Recetas
    description: Bibliotecas, recetas reutilizables y revisiones identificables.
paths:
  /menus/{menuId}/catalog:
    $ref: './paths/catalog.yaml#/collection'
  /menus/{menuId}/catalog/entries/{entryId}:
    $ref: './paths/catalog.yaml#/entry'
  /menus/{menuId}/categories:
    $ref: './paths/categories.yaml#/collection'
  /menus/{menuId}/categories/{categoryId}:
    $ref: './paths/categories.yaml#/item'
  /menus/{menuId}/entries:
    $ref: './paths/entries.yaml#/collection'
  /menus/{menuId}/entries/{entryId}:
    $ref: './paths/entries.yaml#/item'
  /menus/{menuId}/entries/{entryId}/offers:
    $ref: './paths/offers.yaml#/collection'
  /menus/{menuId}/entries/{entryId}/offers/{offerId}:
    $ref: './paths/offers.yaml#/item'
  /menus/{menuId}/entries/{entryId}/offers/{offerId}/revisions:
    $ref: './paths/offers.yaml#/revisions'
  /catalog-offers/{offerId}/revisions/{offerRevision}:
    $ref: './paths/offers.yaml#/revision'
  /menus/{menuId}/entries/{entryId}/offers/{offerId}/composition:
    $ref: './paths/compositions.yaml#/item'
  /recipe-libraries:
    $ref: './paths/recipes.yaml#/libraries'
  /recipe-libraries/{libraryId}:
    $ref: './paths/recipes.yaml#/library'
  /recipe-libraries/{libraryId}/recipes:
    $ref: './paths/recipes.yaml#/recipes'
  /recipe-libraries/{libraryId}/recipes/{recipeId}:
    $ref: './paths/recipes.yaml#/recipe'
  /recipe-libraries/{libraryId}/recipes/{recipeId}/revisions:
    $ref: './paths/recipes.yaml#/revisions'
components:
  responses:
    Unauthorized: { $ref: './components/responses/errors.yaml#/Unauthorized' }
    Forbidden: { $ref: './components/responses/errors.yaml#/Forbidden' }
