openapi: 3.1.1
info:
  title: API síncrona de Menu — propuesta
  version: 0.1.1
  description: >-
    Contratos HTTP propuestos para el bounded context Menu, basados en la ERS 1.3.12
    y las 50 operaciones de ../proposal.md. Menu custodia catálogo y reglas comerciales;
    POS consulta la oferta y Orders + Kitchen consulta definiciones. La creación de órdenes,
    la preparación culinaria y los movimientos físicos de Inventory no pertenecen a esta API.
x-ers-version: 1.3.12
x-contract-status: PROPOSAL
x-open-issues: [OPEN-002, OPEN-007, OPEN-009, OPEN-010, OPEN-011]
tags:
  - name: Catálogo
    description: Oferta vendible para POS y otros canales autorizados.
  - name: Definiciones de servicio
    description: Definiciones comerciales para la proyección de Orders + Kitchen.
  - name: Ítems
    description: Gestión administrativa de MenuItem.
  - name: Variantes
    description: Variantes hoja y migración de DEFAULT.
  - name: Modificadores
    description: Configuración comercial de modificadores de items hoja.
  - name: Combos
    description: Configuraciones, slots y opciones de combo.
  - name: Copias de combos
    description: Clonación, copia explícita y lotes atómicos por destino.
  - name: Categorías
    description: Categorías de hoja y combos separadas.
  - name: Revisiones
    description: Supervisión y confirmación de revisiones administrativas.
security:
  - BearerToken: []
