type: object
description: 'Exige exactamente una decisión: targetSlotId o createNewSlot=true; nunca matching por nombre u orden.'
properties:
  sourceSlotId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  targetSlotId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  createNewSlot:
    type: boolean
required:
- sourceSlotId
oneOf:
- required:
  - targetSlotId
  not:
    required:
    - createNewSlot
- required:
  - createNewSlot
  properties:
    createNewSlot:
      const: true
  not:
    required:
    - targetSlotId
