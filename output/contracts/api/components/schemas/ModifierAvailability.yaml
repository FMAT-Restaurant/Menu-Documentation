type: object
description: Identidad compuesta variantId + modifierOptionId; no forma parte de ResolvedVariantModifier.
properties:
  variantId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  modifierOptionId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  available:
    type: boolean
  availableMaxQuantity:
    type: integer
    minimum: 0
  lastUpdatedAt:
    type: string
    format: date-time
required:
- variantId
- modifierOptionId
- available
- availableMaxQuantity
- lastUpdatedAt
