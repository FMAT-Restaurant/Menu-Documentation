type: object
description: Proyección originada en Orders + Kitchen, separada de elegibilidad y revisión.
properties:
  variantId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  available:
    type: boolean
  lastUpdatedAt:
    type: string
    format: date-time
required:
- variantId
- available
- lastUpdatedAt
