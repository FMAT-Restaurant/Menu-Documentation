type: object
description: Un slot deshabilitado se excluye de elegibilidad y disponibilidad; minSelections <= maxSelections.
  priceReference es informativo administrativo para cada slot.
properties:
  id:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  comboConfigurationId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  name:
    type: string
  enabled:
    type: boolean
  minSelections:
    type: integer
    minimum: 0
  maxSelections:
    type: integer
    minimum: 0
  options:
    type: array
    items:
      $ref: ./ComboOption.yaml
  availableCapacity:
    type: integer
    minimum: 0
  priceReference:
    $ref: ./SlotPriceReference.yaml
required:
- id
- comboConfigurationId
- name
- enabled
- minSelections
- maxSelections
- options
- priceReference
