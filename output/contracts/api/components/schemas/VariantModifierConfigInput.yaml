type: object
description: PUT sustituye la excepción comercial de la tupla variantId + modifierOptionId.
properties:
  enabled:
    type: boolean
  priceDelta:
    type: number
    description: Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.
    x-open-issues:
    - OPEN-010
  maxQuantity:
    type: integer
    minimum: 0
required:
- enabled
- priceDelta
- maxQuantity
