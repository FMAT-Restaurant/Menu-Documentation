type: object
description: En MenuItem COMBO ACTIVE una configuración habilitada exige al menos un slot; bajo INACTIVE puede guardarse
  incompleta con advertencia.
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
  unitPrice:
    type: number
    description: Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.
    x-open-issues:
    - OPEN-010
  enabled:
    type: boolean
  slots:
    type: array
    items:
      $ref: ./ComboSlotCreate.yaml
required:
- name
- unitPrice
- enabled
