type: object
description: Permite crear ACTIVE con definición anidada completa en una operación; ACTIVE exige capacidad estructural
  suficiente. INACTIVE admite definición incompleta con advertencias.
properties:
  code:
    type: string
  name:
    type: string
    minLength: 1
  description:
    type: string
  image:
    type: string
  itemType:
    type: string
    enum:
    - PREPARED
    - STOCKED
    - COMBO
  status:
    type: string
    enum:
    - ACTIVE
    - INACTIVE
  itemCategoryId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  comboCategoryId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  classification:
    type: string
    enum:
    - PLATILLO
    - BEBIDA
    - POSTRE
    - COMPLEMENTO
  variantDimensions:
    type: array
    items:
      $ref: ./DimensionCreate.yaml
  variants:
    type: array
    items:
      $ref: ./VariantCreate.yaml
  modifierGroups:
    type: array
    items:
      $ref: ./ModifierGroupCreate.yaml
  comboConfigurations:
    type: array
    items:
      $ref: ./ComboConfigurationCreate.yaml
required:
- code
- name
- description
- image
- itemType
- status
allOf:
- if:
    properties:
      itemType:
        const: COMBO
  then:
    properties:
      itemCategoryId: false
      classification: false
      variants: false
      variantDimensions: false
      modifierGroups: false
- if:
    properties:
      itemType:
        enum:
        - PREPARED
        - STOCKED
  then:
    properties:
      comboCategoryId: false
      comboConfigurations: false
- if:
    properties:
      status:
        const: ACTIVE
      itemType:
        enum:
        - PREPARED
        - STOCKED
  then:
    required:
    - variants
    properties:
      variants:
        type: array
        contains:
          type: object
          properties:
            enabled:
              const: true
          required:
          - enabled
- if:
    properties:
      status:
        const: ACTIVE
      itemType:
        const: COMBO
  then:
    required:
    - comboConfigurations
    properties:
      comboConfigurations:
        type: array
        contains:
          type: object
          properties:
            enabled:
              const: true
            slots:
              type: array
              minItems: 1
          required:
          - enabled
          - slots
