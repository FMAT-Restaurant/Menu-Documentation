type: object
properties:
  reviewKind:
    type: string
    enum:
    - CULINARY
    - COMMERCIAL
  changeId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  motive:
    type: string
    enum:
    - PRICE
    - COMPOSITION
    - MODIFIERS
    - STATUS
  sourceVariantId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  observedRevision:
    type: integer
    minimum: 0
required:
- reviewKind
- changeId
- motive
- observedRevision
