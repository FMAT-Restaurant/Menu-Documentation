type: object
description: Copia atómica a una configuración existente; cada slot origen debe mapearse explícitamente.
properties:
  targetConfigurationId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  slotMappings:
    type: array
    minItems: 1
    items:
      $ref: ./SlotCopyMapping.yaml
required:
- targetConfigurationId
- slotMappings
