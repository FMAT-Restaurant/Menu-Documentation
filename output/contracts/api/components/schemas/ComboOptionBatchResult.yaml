type: object
description: Resultado por destino; no existe aplicación parcial por slot. Códigos de error de lote pendientes en
  OPEN-002.
properties:
  results:
    type: array
    items:
      type: object
      properties:
        targetConfigurationId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        status:
          type: string
          enum:
          - APPLIED
          - REJECTED
        configuration:
          ./ComboConfiguration.yaml
        error:
          $ref: ./ApiError.yaml
      required:
      - targetConfigurationId
      - status
      allOf:
      - if:
          properties:
            status:
              const: APPLIED
        then:
          required: [configuration]
          properties:
            error: false
      - if:
          properties:
            status:
              const: REJECTED
        then:
          required: [error]
          properties:
            configuration: false
required:
- results
