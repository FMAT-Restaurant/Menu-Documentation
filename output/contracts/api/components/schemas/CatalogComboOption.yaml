type: object
description: Opción publicada y seleccionable en un slot habilitado; enabled e isStructurallyEligible son verdaderos. available representa únicamente disponibilidad operacional.
properties:
  id:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  itemVariantId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  quantity:
    type: integer
    minimum: 1
  priceDelta:
    type: number
    description: Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.
    x-open-issues:
    - OPEN-010
  isAvailable:
    type: boolean
  enabled:
    type: boolean
    const: true
  isStructurallyEligible:
    type: boolean
    const: true
required:
- id
- itemVariantId
- quantity
- priceDelta
- isAvailable
- enabled
- isStructurallyEligible
