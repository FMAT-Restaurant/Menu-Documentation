type: object
description: Cambio parcial. ARCHIVED solo desde ACTIVE/INACTIVE; desarchivar únicamente hacia INACTIVE; posterior
  ACTIVE explícito con revalidación. Mientras el estado actual es ARCHIVED se rechaza toda edición comercial, salvo
  el desarchivado explícito a INACTIVE. itemType no es mutable. itemCategoryId y classification solo aplican
  a ítems hoja; comboCategoryId solo a COMBO.
properties:
  code:
    type: string
  name:
    type: string
    minLength: 1
  description:
    type: string
  image:
    type: string
  status:
    type: string
    enum:
    - ACTIVE
    - INACTIVE
    - ARCHIVED
  itemCategoryId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  comboCategoryId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  classification:
    type: string
    enum:
    - PLATILLO
    - BEBIDA
    - POSTRE
    - COMPLEMENTO
