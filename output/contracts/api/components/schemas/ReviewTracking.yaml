type: object
description: reviewStatus = REVIEW_REQUIRED cuando observedRevision > acknowledgedRevision. Independiente de commercialRevision
  y disponibilidad.
properties:
  observedRevision:
    type: integer
    minimum: 0
  acknowledgedRevision:
    type: integer
    minimum: 0
  reviewStatus:
    type: string
    enum:
    - UP_TO_DATE
    - REVIEW_REQUIRED
  pendingReviewCauses:
    type: array
    items:
      $ref: ./PendingReviewCause.yaml
required:
- observedRevision
- acknowledgedRevision
- reviewStatus
- pendingReviewCauses
