CategoryInput:
  type: object
  additionalProperties: false
  required: [name, description]
  properties:
    name: { type: string, minLength: 1 }
    description: { type: string }
CategoryPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name: { type: string, minLength: 1 }
    description: { type: string }
Category:
  type: object
  additionalProperties: false
  required: [id, menuId, name, description]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    menuId: { $ref: './common.yaml#/Identifier' }
    name: { type: string }
    description: { type: string }
CategoryList:
  type: array
  items: { $ref: '#/Category' }

EntryInput:
  type: object
  additionalProperties: false
  required: [brandName, description, categoryIds]
  description: Metadatos comerciales de una entrada. La imagen se envía en la parte binaria image del cuerpo multipart.
  properties:
    brandName: { type: string, minLength: 1, description: Nombre comercial autoritativo. }
    description: { type: string }
    categoryIds:
      type: array
      uniqueItems: true
      description: Todas las categorías deben pertenecer al menuId de la URI.
      items: { $ref: './common.yaml#/Identifier' }
EntryCreateMultipart:
  type: object
  additionalProperties: false
  required: [entry, image]
  properties:
    entry: { $ref: '#/EntryInput' }
    image: { $ref: './common.yaml#/ImageUpload' }
EntryPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  description: |
    Solo se modifican las propiedades presentes. categoryIds sustituye el conjunto
    completo de categorías; [] lo vacía. defaultOfferId admite null para retirar
    la referencia. La imagen se reemplaza mediante la parte binaria image de una
    solicitud multipart; si no se incluye, la referencia vigente se conserva.
    Las demás propiedades no admiten null.
  properties:
    brandName: { type: string, minLength: 1 }
    description: { type: string }
    categoryIds:
      type: array
      uniqueItems: true
      items: { $ref: './common.yaml#/Identifier' }
    defaultOfferId:
      oneOf:
        - $ref: './common.yaml#/Identifier'
        - type: 'null'
      description: ID de una oferta propia existente o null para retirar la referencia; su uso sigue en OPEN-002.
    status:
      $ref: './common.yaml#/EntryStatus'
      description: Desde ARCHIVED solo se permite solicitar INACTIVE; una activación posterior y explícita exige al menos una oferta válida.
EntryPatchMultipart:
  type: object
  additionalProperties: false
  description: |
    Incluye entry para modificar metadatos y/o image para reemplazar la imagen.
    Se debe enviar al menos una de las dos partes. Omitir image conserva la
    referencia vigente; una imagen inválida no modifica la entrada.
  properties:
    entry: { $ref: '#/EntryPatch' }
    image: { $ref: './common.yaml#/ImageUpload' }
  anyOf:
    - required: [entry]
    - required: [image]
Entry:
  type: object
  additionalProperties: false
  required: [id, menuId, brandName, description, imageRef, status, categoryIds, offers]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    menuId: { $ref: './common.yaml#/Identifier' }
    brandName: { type: string }
    description: { type: string }
    imageRef: { $ref: './common.yaml#/ImageRef' }
    status: { $ref: './common.yaml#/EntryStatus' }
    categoryIds:
      type: array
      uniqueItems: true
      items: { $ref: './common.yaml#/Identifier' }
    defaultOfferId: { $ref: './common.yaml#/Identifier' }
    offers:
      type: array
      description: Definiciones vigentes; una consulta publicable incluye solo ofertas activas válidas.
      items: { $ref: '#/Offer' }
CreatedEntry:
  allOf:
    - $ref: '#/Entry'
    - type: object
      description: La entrada recién creada está inactiva y todavía no tiene ofertas.
      properties:
        status: { const: INACTIVE }
        offers: { type: array, maxItems: 0 }
        defaultOfferId: false
PublishedEntry:
  allOf:
    - $ref: '#/Entry'
    - type: object
      description: Proyección publicable de una entrada activa con ofertas activas válidas.
      properties:
        status: { const: ACTIVE }
        offers:
          type: array
          minItems: 1
          items: { $ref: '#/PublishedOffer' }
PublishedEntryList:
  type: array
  items: { $ref: '#/PublishedEntry' }
EntryList:
  type: array
  items: { $ref: '#/Entry' }
EntryDeletionResult:
  type: object
  additionalProperties: false
  required: [entryId, deleted, deletedOfferIds, affectedOffers]
  description: Resultado íntegro de la eliminación definitiva; las revisiones históricas permanecen consultables.
  properties:
    entryId: { $ref: './common.yaml#/Identifier' }
    deleted: { const: true }
    deletedOfferIds:
      type: array
      uniqueItems: true
      items: { $ref: './common.yaml#/Identifier' }
    affectedOffers:
      type: array
      description: Ofertas ajenas con una nueva revisión vigente tras materializar referencias.
      items:
        type: object
        additionalProperties: false
        required: [offerId, newRevision, deactivatedOptionIds, convertedReferences]
        properties:
          offerId: { $ref: './common.yaml#/Identifier' }
          newRevision: { $ref: './common.yaml#/Revision' }
          deactivatedOptionIds:
            type: array
            uniqueItems: true
            items: { $ref: './common.yaml#/Identifier' }
          convertedReferences: { type: integer, minimum: 1 }

OfferInput:
  type: object
  additionalProperties: false
  required: [basePrice, composition]
  description: Metadatos comerciales de una oferta. La imagen se envía en la parte binaria image del cuerpo multipart.
  properties:
    presentationTag:
      type: string
      description: Etiqueta opcional de presentación; no sustituye brandName.
    basePrice: { $ref: './common.yaml#/Amount' }
    composition: { $ref: './composition.yaml#/Composition' }
OfferCreateMultipart:
  type: object
  additionalProperties: false
  required: [offer, image]
  properties:
    offer: { $ref: '#/OfferInput' }
    image: { $ref: './common.yaml#/ImageUpload' }
OfferRevisionMultipart:
  type: object
  additionalProperties: false
  required: [offer]
  description: Si se omite image, la nueva revisión conserva offerImageRef de la oferta vigente.
  properties:
    offer: { $ref: '#/OfferInput' }
    image: { $ref: './common.yaml#/ImageUpload' }
OfferStatusPatch:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status: { $ref: './common.yaml#/OfferStatus' }
Offer:
  type: object
  additionalProperties: false
  required: [id, entryId, basePrice, offerImageRef, status, revision, composition]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    entryId: { $ref: './common.yaml#/Identifier' }
    presentationTag: { type: string }
    basePrice:
      $ref: './common.yaml#/Amount'
      description: Precio fijo de esta oferta completa; no suma componentes u ofertas hijas.
    offerImageRef: { $ref: './common.yaml#/ImageRef' }
    status: { $ref: './common.yaml#/OfferStatus' }
    revision: { $ref: './common.yaml#/Revision' }
    composition: { $ref: './composition.yaml#/Composition' }
OfferList:
  type: array
  items: { $ref: '#/Offer' }
PublishedOffer:
  allOf:
    - $ref: '#/Offer'
    - type: object
      description: Oferta activa válida incluida en el catálogo publicable.
      properties:
        status: { const: ACTIVE }
OfferRevision:
  type: object
  additionalProperties: false
  description: Fotografía identificable de la definición comercial publicada de una oferta.
  required: [offerId, entryId, revision, brandNameSnapshot, basePrice, offerImageRef, composition]
  properties:
    offerId: { $ref: './common.yaml#/Identifier' }
    entryId: { $ref: './common.yaml#/Identifier' }
    revision: { $ref: './common.yaml#/Revision' }
    brandNameSnapshot:
      type: string
      minLength: 1
      description: Nombre comercial conservado al publicar la revisión, consultable aunque se elimine la entrada vigente.
    presentationTag: { type: string }
    basePrice: { $ref: './common.yaml#/Amount' }
    offerImageRef: { $ref: './common.yaml#/ImageRef' }
    composition: { $ref: './composition.yaml#/Composition' }
