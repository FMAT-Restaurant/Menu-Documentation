type: object
description: Origen y destinos pertenecen al mismo MenuItem; aplicación atómica.
properties:
  sourceVariantId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  targetVariantIds:
    type: array
    minItems: 1
    items:
      type: string
      description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
      minLength: 1
  conflictPolicy:
    type: string
    enum:
    - FAIL
    - REPLACE
required:
- sourceVariantId
- targetVariantIds
- conflictPolicy
