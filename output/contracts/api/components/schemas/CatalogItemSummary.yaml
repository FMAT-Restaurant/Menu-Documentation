type: object
description: Solo identidad y presentación comercial; no incluye revisión ni estado administrativo.
properties:
  id:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  menuId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  name:
    type: string
  description:
    type: string
  image:
    type: string
  itemType:
    type: string
    enum:
    - PREPARED
    - STOCKED
    - COMBO
  itemCategory:
    type: string
    description: Nombre de categoría (hamburguesas, pizzas, etc.) para filtrar y ordenar.
    minLength: 1
  comboCategory:
    type: string
    description: Nombre de categoría (mariscos, promo martes, etc.) para filtrar y ordenar.
  classification:
    type: string
    enum:
    - PLATILLO
    - BEBIDA
    - POSTRE
    - COMPLEMENTO
required:
- id
- menuId
- name
- description
- image
- itemType
allOf:
- if:
    properties:
      itemType:
        const: COMBO
  then:
    properties:
      itemCategoryId: false
      classification: false
- if:
    properties:
      itemType:
        enum: [PREPARED, STOCKED]
  then:
    properties:
      comboCategoryId: false
