type: object
properties:
  slotId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  baseOptionIds:
    type: array
    items:
      type: string
      description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
      minLength: 1
  saved:
    type: number
    description: Suma de savedUnitPrice × quantity de cada ComboOption base.
    x-open-issues:
    - OPEN-010
  current:
    type: number
    description: Suma de currentUnitPrice × quantity de esas mismas ComboOption base.
    x-open-issues:
    - OPEN-010
  difference:
    type: number
    description: current - saved; informativo, no altera ComboConfiguration.unitPrice.
    x-open-issues:
    - OPEN-010
required:
- slotId
- baseOptionIds
- saved
- current
- difference
