type: object
description: Sobreescribe la configuración de una opción de grupo de variantes para una variante específica.
properties:
  id:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  generalConfig:
    $ref: ./GeneralModifierConfig.yaml
  isAvailable:
    type: boolean
required:
- id
- groupId
- name
- generalConfig
- isAvailable