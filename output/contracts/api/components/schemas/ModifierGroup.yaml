type: object
description: minSelections <= maxSelections; el grupo solo pertenece a un item hoja.
properties:
  id:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  menuItemId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  name:
    type: string
  minSelections:
    type: integer
    minimum: 0
  maxSelections:
    type: integer
    minimum: 0
  options:
    type: array
    items:
      $ref: ./ModifierOption.yaml
required:
- id
- menuItemId
- name
- minSelections
- maxSelections
- options
