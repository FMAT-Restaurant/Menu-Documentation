type: object
description: Advertencia identificable de definición incompleta en INACTIVE. Para grupos y slots informa identidad,
  mínimo y capacidad; MenuItem identifica ausencia de unidad vendible.
properties:
  entityType:
    type: string
    enum:
    - MenuItem
    - ModifierGroup
    - ComboSlot
  entityId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  minSelections:
    type: integer
    minimum: 0
  calculatedCapacity:
    type: integer
    minimum: 0
  message:
    type: string
required:
- entityType
- entityId
- message
allOf:
- if:
    properties:
      entityType:
        const: MenuItem
  then:
    properties:
      minSelections: false
      calculatedCapacity: false
- if:
    properties:
      entityType:
        enum:
        - ModifierGroup
        - ComboSlot
  then:
    required:
    - minSelections
    - calculatedCapacity
