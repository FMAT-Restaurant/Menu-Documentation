Identifier:
  type: string
  minLength: 1
  description: Identificador opaco; no implica formato compartido entre contextos.
Revision:
  type: string
  minLength: 1
  description: Identificador opaco de una revisión publicada e inmutable.
Amount:
  type: number
  description: Importe declarado. Moneda, precisión, redondeo y rangos siguen en OPEN-001.
EntryStatus:
  type: string
  enum: [ACTIVE, INACTIVE, ARCHIVED]
OfferStatus:
  type: string
  enum: [ACTIVE, INACTIVE]
OptionStatus:
  type: string
  enum: [ACTIVE, INACTIVE]
RecipeStatus:
  type: string
  enum: [ACTIVE, INACTIVE]
ImageRef:
  type: string
  minLength: 1
  description: Referencia descriptiva a imagen; formato y carga siguen en OPEN-005.
Error:
  type: object
  additionalProperties: false
  required: [code, message]
  properties:
    code:
      type: string
      description: Código técnico que identifica la clase de error comunicada.
    message:
      type: string
    details:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [path, message]
        properties:
          path: { type: string }
          message: { type: string }
