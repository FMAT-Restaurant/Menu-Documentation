type: object
properties:
  variants:
    type: array
    items:
      type: object
      properties:
        itemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        variantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        review:
          $ref: ./ReviewTracking.yaml
      required:
      - itemId
      - variantId
      - review
  comboConfigurations:
    type: array
    items:
      type: object
      properties:
        itemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        configurationId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        review:
          $ref: ./ReviewTracking.yaml
      required:
      - itemId
      - configurationId
      - review
  comboItems:
    type: array
    items:
      type: object
      properties:
        itemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        aggregateReviewStatus:
          type: string
          enum:
          - UP_TO_DATE
          - REVIEW_REQUIRED
      required:
      - itemId
      - aggregateReviewStatus
required:
- variants
- comboConfigurations
- comboItems
