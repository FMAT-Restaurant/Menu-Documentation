Composition:
  description: |
    Una oferta posee una composición completa. Cada slot tiene al menos una opción.
    La inclusión de slots y la elección de una opción dentro de cada slot incluido
    son decisiones distintas. Las restricciones entre identificadores y límites
    se verifican en el servidor (BR-MENU-006, 008-011; INV-MENU-003/004).
  oneOf:
    - $ref: '#/AutomaticComposition'
    - $ref: '#/SelectableComposition'
AutomaticComposition:
  type: object
  additionalProperties: false
  required: [id, selectable, requiredSlots, slots]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    selectable: { const: false }
    requiredSlots:
      type: array
      maxItems: 0
      description: Vacío; todos los slots se incluyen automáticamente.
    slots: { $ref: '#/Slots' }
    placementRegions: { $ref: '#/PlacementRegions' }
SelectableComposition:
  type: object
  additionalProperties: false
  required: [id, selectable, requiredSlots, minSelections, maxSelections, slots]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    selectable: { const: true }
    requiredSlots:
      type: array
      uniqueItems: true
      description: IDs propios de slots obligatorios; no consumen minSelections/maxSelections.
      items: { $ref: './common.yaml#/Identifier' }
    minSelections:
      type: integer
      minimum: 0
      description: Mínimo de slots elegibles. Si se exige elegir alguno, debe ser al menos 1.
    maxSelections:
      type: integer
      minimum: 0
      description: Máximo de slots elegibles. Debe ser >= mínimo y <= cantidad elegible.
    slots: { $ref: '#/Slots' }
    placementRegions: { $ref: '#/PlacementRegions' }
CompositionSnapshot:
  description: |
    Copia local de la composición completa de una revisión de oferta. La
    procedencia identifica la revisión fijada; slots, opciones y
    personalizaciones quedan embebidos y no dependen de la oferta vigente.
  oneOf:
    - $ref: '#/AutomaticCompositionSnapshot'
    - $ref: '#/SelectableCompositionSnapshot'
AutomaticCompositionSnapshot:
  type: object
  additionalProperties: false
  required: [id, sourceOfferId, sourceOfferRevision, selectable, requiredSlots, slots]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    sourceOfferId: { $ref: './common.yaml#/Identifier' }
    sourceOfferRevision: { $ref: './common.yaml#/Revision' }
    selectable: { const: false }
    requiredSlots: { type: array, maxItems: 0 }
    slots: { $ref: '#/Slots' }
    placementRegions: { $ref: '#/PlacementRegions' }
SelectableCompositionSnapshot:
  type: object
  additionalProperties: false
  required: [id, sourceOfferId, sourceOfferRevision, selectable, requiredSlots, minSelections, maxSelections, slots]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    sourceOfferId: { $ref: './common.yaml#/Identifier' }
    sourceOfferRevision: { $ref: './common.yaml#/Revision' }
    selectable: { const: true }
    requiredSlots:
      type: array
      uniqueItems: true
      items: { $ref: './common.yaml#/Identifier' }
    minSelections: { type: integer, minimum: 0 }
    maxSelections: { type: integer, minimum: 0 }
    slots: { $ref: '#/Slots' }
    placementRegions: { $ref: '#/PlacementRegions' }
Slots:
  type: array
  minItems: 1
  items: { $ref: '#/CompositionSlot' }
PlacementRegions:
  type: array
  items: { $ref: '#/PlacementRegion' }
CompositionSlot:
  type: object
  additionalProperties: false
  required: [id, name, quantity, options]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    name: { type: string, minLength: 1 }
    quantity:
      type: number
      description: Unidades incluidas en este slot; rango y fracciones siguen en OPEN-006. Unidades personalizables separadamente requieren slots distintos.
    course:
      type: string
      description: Tiempo sugerido de servicio. El conjunto cerrado o configurable sigue en OPEN-007.
    positionRef:
      $ref: './common.yaml#/Identifier'
      description: ID de PlacementRegion; ubicación descriptiva, sin efecto de obligatoriedad.
    options:
      type: array
      minItems: 1
      description: Una opción concreta el contenido; varias permiten elegir una dentro del slot incluido.
      items: { $ref: '#/ComponentOption' }
PlacementRegion:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    name: { type: string, minLength: 1 }
    parentRegionId: { $ref: './common.yaml#/Identifier' }
    surface: { type: string, description: Dato descriptivo sin cálculo de cobertura. }
    coverage: { type: string, description: Dato descriptivo sin cálculo de cobertura. }
ComponentOption:
  type: object
  additionalProperties: false
  required: [id, displayName, status, source]
  properties:
    id: { $ref: './common.yaml#/Identifier' }
    displayName: { type: string, minLength: 1, description: Nombre contextual; no redefine el origen. }
    status: { $ref: './common.yaml#/OptionStatus' }
    source: { $ref: '#/ComponentSource' }
    personalizations: { $ref: './personalizations.yaml#/Personalizations' }
ComponentSource:
  description: Exactamente uno de cuatro orígenes; las referencias no pueden crear ciclos.
  oneOf:
    - $ref: '#/InlineContent'
    - $ref: '#/InventoryItemSource'
    - $ref: '#/PreparationSource'
    - $ref: '#/CatalogOfferSource'
InlineContent:
  description: Contenido local excluyente; receta propia o composición completa copiada de una oferta.
  oneOf:
    - $ref: '#/InlineRecipeContent'
    - $ref: '#/InlineCompositionContent'
InlineRecipeContent:
  type: object
  additionalProperties: false
  required: [type, id, recipe]
  properties:
    type: { const: INLINE }
    id: { $ref: './common.yaml#/Identifier' }
    name: { type: string }
    description: { type: string }
    recipe: { $ref: './recipes.yaml#/InlineRecipe' }
InlineCompositionContent:
  type: object
  additionalProperties: false
  required: [type, id, compositionSnapshot]
  description: |
    Copia local íntegra de la Composition de la revisión fijada de una oferta.
    Conserva slots, alternativas y personalizaciones; no contiene una referencia
    vigente a la oferta eliminada y no convierte la oferta en receta.
  properties:
    type: { const: INLINE }
    id: { $ref: './common.yaml#/Identifier' }
    name: { type: string }
    description: { type: string }
    compositionSnapshot: { $ref: '#/CompositionSnapshot' }
InventoryItemSource:
  type: object
  additionalProperties: false
  required: [type, inventoryItemId, quantity, unit]
  properties:
    type: { const: INVENTORY_ITEM }
    inventoryItemId: { $ref: './common.yaml#/Identifier' }
    quantity:
      type: number
      exclusiveMinimum: 0
    unit:
      type: string
      minLength: 1
      description: Compatible con el InventoryItem externo; Menu no posee su stock.
    displayNameSnapshot: { type: string, description: Etiqueta descriptiva sin identidad propia. }
PreparationSource:
  type: object
  additionalProperties: false
  required: [type, recipeId, recipeRevision]
  properties:
    type: { const: PREPARATION }
    recipeId: { $ref: './common.yaml#/Identifier' }
    recipeRevision: { $ref: './common.yaml#/Revision' }
    name: { type: string }
    adjustments:
      type: array
      description: Diferencias locales a esta aparición; no modifican la receta compartida.
      items: { $ref: './recipes.yaml#/RecipeAdjustment' }
CatalogOfferSource:
  type: object
  additionalProperties: false
  required: [type, catalogOfferId, offerRevision]
  properties:
    type: { const: CATALOG_OFFER }
    catalogOfferId: { $ref: './common.yaml#/Identifier' }
    offerRevision:
      $ref: './common.yaml#/Revision'
      description: Revisión histórica fijada para esta composición publicada.
    displayNameSnapshot: { type: string }
