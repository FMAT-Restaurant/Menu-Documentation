type: object
description: itemType es inmutable. Solo MenuItem tiene status; hojas y COMBO usan categorías distintas. commercialVersion
  corresponde a commercialRevision y es independiente de observedRevision.
properties:
  id:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  menuId:
    type: string
    description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
    minLength: 1
  code:
    type: string
  name:
    type: string
  description:
    type: string
  image:
    type: string
    description: Referencia comercial de imagen; no presupone servicio de imágenes.
  itemType:
    type: string
    enum:
    - PREPARED
    - STOCKED
    - COMBO
  status:
    type: string
    enum:
    - ACTIVE
    - INACTIVE
    - ARCHIVED
  itemCategoryId:
    type: string
    description: Solo hojas.
    minLength: 1
  comboCategoryId:
    type: string
    description: Solo COMBO.
    minLength: 1
  classification:
    type: string
    description: Solo hojas.
    enum:
    - PLATILLO
    - BEBIDA
    - POSTRE
    - COMPLEMENTO
  commercialRevision:
    type: integer
    minimum: 1
  commercialVersion:
    type: string
    description: Formato lógico <number>_<ISO8601> de una revisión comercial inmutable.
    pattern: ^[1-9][0-9]*_[0-9]{4}-[0-9]{2}-[0-9]{2}T.+$
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
- id
- menuId
- code
- name
- description
- image
- itemType
- status
- commercialRevision
- commercialVersion
allOf:
- if:
    properties:
      itemType:
        const: COMBO
  then:
    properties:
      itemCategoryId: false
      classification: false
- if:
    properties:
      itemType:
        enum: [PREPARED, STOCKED]
  then:
    properties:
      comboCategoryId: false
