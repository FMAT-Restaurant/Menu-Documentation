BadRequest:
  description: El cuerpo JSON o multipart/form-data está mal formado, o un parámetro tiene formato o sintaxis inválidos.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/Error'
      examples:
        malformedJson:
          summary: Cuerpo JSON mal formado
          value: { code: BAD_REQUEST, message: El cuerpo JSON no puede procesarse. }
        invalidParameterFormat:
          summary: Parámetro con formato inválido
          value:
            code: INVALID_PARAMETER_FORMAT
            message: El parámetro page debe ser un entero.
            details:
              - { path: page, message: 'Valor recibido: primero.' }
OffsetPaginationBadRequest:
  description: El número de página o su tamaño no cumple los rangos de paginación administrativa.
  content:
    application/json:
      schema: { $ref: '../schemas/common.yaml#/Error' }
      examples:
        paginaInvalida:
          summary: La página debe iniciar en 1
          value:
            code: INVALID_PAGINATION
            message: El parámetro page debe ser un entero mayor o igual a 1.
            details:
              - { path: page, message: 'Valor recibido: 0.' }
        tamanoInvalido:
          summary: El tamaño debe estar entre 1 y 100
          value:
            code: INVALID_PAGINATION
            message: El parámetro pageSize debe ser un entero entre 1 y 100.
            details:
              - { path: pageSize, message: 'Valor recibido: 101.' }
CursorPaginationBadRequest:
  description: El límite o el cursor de continuación no corresponde a esta consulta.
  content:
    application/json:
      schema: { $ref: '../schemas/common.yaml#/Error' }
      examples:
        limiteInvalido:
          summary: El límite debe estar entre 1 y 100
          value:
            code: INVALID_PAGINATION
            message: El parámetro limit debe ser un entero entre 1 y 100.
            details:
              - { path: limit, message: 'Valor recibido: 0.' }
        cursorIncompatible:
          summary: El cursor no pertenece a los filtros enviados
          value:
            code: INVALID_CURSOR
            message: Reinicie la consulta si cambia q o categoryId.
            details:
              - { path: cursor, message: El cursor no corresponde a los filtros actuales. }
Unprocessable:
  description: La solicitud JSON o multipart/form-data está bien formada, pero sus campos incumplen el schema o la definición infringe reglas del dominio, incluidas las restricciones de imagen.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/Error'
      examples:
        schemaViolation:
          summary: Campo que incumple el schema
          value:
            code: SCHEMA_VALIDATION_FAILED
            message: El campo name es obligatorio.
            details:
              - { path: name, message: El valor es obligatorio. }
        invalidComposition:
          summary: Definición que incumple una regla del dominio
          value:
            code: DOMAIN_VALIDATION_FAILED
            message: La composición debe contener al menos un slot con una alternativa.
            details:
              - { path: composition.slots, message: Se requiere al menos un slot. }
        invalidImageData:
          summary: El contenido no se puede decodificar como imagen admitida
          value:
            code: INVALID_IMAGE
            message: El archivo no contiene una imagen JPEG, PNG o WebP válida.
            details:
              - { path: image, message: Verifique el contenido del archivo e inténtelo de nuevo. }
        imageTooLarge:
          summary: El archivo supera el tamaño máximo
          value:
            code: IMAGE_SIZE_EXCEEDED
            message: El tamaño máximo de una imagen es 10 MiB.
            details:
              - { path: image, message: El archivo excede 10 MiB. }
        imageDimensionsExceeded:
          summary: Una dimensión supera el máximo permitido
          value:
            code: IMAGE_DIMENSIONS_EXCEEDED
            message: El ancho y el alto máximos de una imagen son 4096 px cada uno.
            details:
              - { path: image, message: El ancho o el alto excede 4096 px. }
NotFound:
  description: Recurso o revisión inexistente en el ámbito solicitado.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/Error'
      examples:
        resourceNotFound:
          summary: Recurso inexistente en el ámbito indicado
          value: { code: NOT_FOUND, message: No se encontró el recurso solicitado. }
Conflict:
  description: Una transición no permitida por el estado actual o un conflicto concurrente impide completar la operación.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/Error'
      examples:
        invalidState:
          summary: Conflicto con el estado actual
          value: { code: STATE_CONFLICT, message: El estado actual impide esta operación. }
UnsupportedMediaType:
  description: El tipo de contenido de la solicitud o de una parte de archivo no está admitido para esta operación.
  content:
    application/json:
      schema: { $ref: '../schemas/common.yaml#/Error' }
      examples:
        unsupportedContentType:
          summary: Content-Type no soportado
          value:
            code: UNSUPPORTED_MEDIA_TYPE
            message: El tipo de contenido text/plain no está declarado en el contrato de esta operación.
        unsupportedImageFormat:
          summary: Formato de imagen no admitido
          value:
            code: UNSUPPORTED_IMAGE_FORMAT
            message: El formato de imagen no está admitido; use JPEG, PNG o WebP.
            details:
              - { path: image, message: El formato recibido no está permitido. }
Unauthorized:
  description: Reserva de respuesta para credenciales ausentes o inválidas cuando se acuerde la autenticación. No se aplica todavía a ninguna operación.
  content:
    application/json:
      schema: { $ref: '../schemas/common.yaml#/Error' }
      examples:
        unauthenticated:
          value: { code: UNAUTHENTICATED, message: Se requieren credenciales válidas. }
Forbidden:
  description: Reserva de respuesta para acceso no autorizado cuando se acuerde la política de permisos. No se aplica todavía a ninguna operación.
  content:
    application/json:
      schema: { $ref: '../schemas/common.yaml#/Error' }
      examples:
        denied:
          value: { code: FORBIDDEN, message: La operación no está permitida para esta identidad. }
