        brandName:
          type: string
          minLength: 1
          description: Nombre comercial autoritativo.
        description:
          type: string
        imageRef:
          $ref: '#/components/schemas/ImageRef'
        categoryIds:
          type: array
          uniqueItems: true
          description: Todas las categorías deben pertenecer al menuId de la URI.
          items:
            $ref: '#/components/schemas/Identifier'
    CreatedEntry:
      allOf:
        - $ref: '#/components/schemas/Entry'
        - type: object
          description: La entrada recién creada está inactiva y todavía no tiene ofertas.
          properties:
            status:
              const: INACTIVE
            offers:
              type: array
              maxItems: 0
            defaultOfferId: false
    EntryDeletionResult:
      type: object
      additionalProperties: false
      required:
        - entryId
        - deleted
        - deletedOfferIds
        - affectedOffers
      description: Resultado íntegro de la eliminación definitiva; las revisiones históricas permanecen consultables.
      properties:
        entryId:
          $ref: '#/components/schemas/Identifier'
        deleted:
          const: true
        deletedOfferIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        affectedOffers:
          type: array
          description: Ofertas ajenas con una nueva revisión vigente tras materializar referencias.
          items:
            type: object
            additionalProperties: false
            required:
              - offerId
              - newRevision
              - deactivatedOptionIds
              - convertedReferences
            properties:
              offerId:
                $ref: '#/components/schemas/Identifier'
              newRevision:
                $ref: '#/components/schemas/Revision'
              deactivatedOptionIds:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/Identifier'
              convertedReferences:
                type: integer
                minimum: 1
    EntryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Solo se modifican las propiedades presentes. categoryIds sustituye el conjunto
        completo de categorías; [] lo vacía. defaultOfferId admite null para retirar
        la referencia. Las demás propiedades no admiten null.
      properties:
        brandName:
          type: string
          minLength: 1
        description:
          type: string
        imageRef:
          $ref: '#/components/schemas/ImageRef'
        categoryIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        defaultOfferId:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: ID de una oferta propia existente o null para retirar la referencia; su uso sigue en OPEN-002.
        status:
          $ref: '#/components/schemas/EntryStatus'
          description: Desde ARCHIVED solo se permite solicitar INACTIVE; una activación posterior y explícita exige al menos una oferta válida.
    OfferList:
      type: array
      items:
        $ref: '#/components/schemas/Offer'
    OfferPage:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
