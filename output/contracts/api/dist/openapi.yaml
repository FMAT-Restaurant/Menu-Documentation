openapi: 3.1.1
info:
  title: API síncrona de Menu — propuesta
  version: 0.1.1
  description: 'Contratos HTTP propuestos para el bounded context Menu, basados en la ERS 1.3.12 y las 50 operaciones de ../proposal.md. Menu custodia catálogo y reglas comerciales; POS consulta la oferta y Orders + Kitchen consulta definiciones. La creación de órdenes, la preparación culinaria y los movimientos físicos de Inventory no pertenecen a esta API.'
x-ers-version: 1.3.12
x-contract-status: PROPOSAL
x-open-issues:
  - OPEN-002
  - OPEN-007
  - OPEN-009
  - OPEN-010
  - OPEN-011
tags:
  - name: Catálogo
    description: Oferta vendible para POS y otros canales autorizados.
  - name: Definiciones de servicio
    description: Definiciones comerciales para la proyección de Orders + Kitchen.
  - name: Ítems
    description: Gestión administrativa de MenuItem.
  - name: Variantes
    description: Variantes hoja y migración de DEFAULT.
  - name: Modificadores
    description: Configuración comercial de modificadores de items hoja.
  - name: Combos
    description: 'Configuraciones, slots y opciones de combo.'
  - name: Copias de combos
    description: 'Clonación, copia explícita y lotes atómicos por destino.'
  - name: Categorías
    description: Categorías de hoja y combos separadas.
  - name: Revisiones
    description: Supervisión y confirmación de revisiones administrativas.
security:
  - BearerToken: []
components:
  schemas:
    ApiError:
      type: object
      description: 'Formato de error HTTP propuesto; la semántica de negocio está definida en la ERS, los códigos técnicos no.'
      properties:
        code:
          type: string
          description: Código provisional; catálogo definitivo pendiente en OPEN-002.
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
            required:
              - reason
      required:
        - code
        - message
    CatalogComboConfiguration:
      type: object
      description: Solo configuraciones estructuralmente elegibles. Revisión administrativa y referencia informativa de precio se excluyen del catálogo POS.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        available:
          type: boolean
        slots:
          type: array
          items:
            $ref: '#/components/schemas/CatalogComboSlot'
        enabled:
          type: boolean
          const: true
        isStructurallyEligible:
          type: boolean
          const: true
      required:
        - id
        - name
        - unitPrice
        - available
        - slots
        - enabled
        - isStructurallyEligible
    CatalogComboOption:
      type: object
      description: Opción publicada y seleccionable en un slot habilitado; enabled e isStructurallyEligible son verdaderos. available representa únicamente disponibilidad operacional.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        itemVariantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        available:
          type: boolean
        enabled:
          type: boolean
          const: true
        isStructurallyEligible:
          type: boolean
          const: true
      required:
        - id
        - itemVariantId
        - quantity
        - priceDelta
        - available
        - enabled
        - isStructurallyEligible
    CatalogComboSlot:
      type: object
      description: 'Solo slots habilitados de la definición vendible; cada opción disponible aporta una selección a la capacidad, no quantity.'
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 0
        availableCapacity:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/CatalogComboOption'
        enabled:
          type: boolean
          const: true
      required:
        - id
        - name
        - minSelections
        - maxSelections
        - availableCapacity
        - options
        - enabled
    CatalogItem:
      type: object
      description: Solo items con al menos una unidad estructuralmente elegible aparecen en el catálogo vendible. isAvailable es verdadero si existe al menos una variante o configuración elegible con disponibilidad operacional afirmativa; REVIEW_REQUIRED no modifica esa derivación.
      properties:
        item:
          $ref: '#/components/schemas/CatalogItemSummary'
        isStructurallyEligible:
          type: boolean
          const: true
        isAvailable:
          type: boolean
        price:
          $ref: '#/components/schemas/CatalogPrice'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CatalogVariant'
        comboConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/CatalogComboConfiguration'
      required:
        - item
        - isStructurallyEligible
        - isAvailable
        - price
        - variants
        - comboConfigurations
      allOf:
        - if:
            properties:
              item:
                properties:
                  itemType:
                    const: COMBO
          then:
            properties:
              variants:
                maxItems: 0
              comboConfigurations:
                minItems: 1
        - if:
            properties:
              item:
                properties:
                  itemType:
                    enum:
                      - PREPARED
                      - STOCKED
          then:
            properties:
              comboConfigurations:
                maxItems: 0
              variants:
                minItems: 1
    CatalogItemSummary:
      type: object
      description: Solo identidad y presentación comercial; no incluye revisión ni estado administrativo.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        menuId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        code:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          type: string
        itemType:
          type: string
          enum:
            - PREPARED
            - STOCKED
            - COMBO
        itemCategoryId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        comboCategoryId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        classification:
          type: string
          enum:
            - PLATILLO
            - BEBIDA
            - POSTRE
            - COMPLEMENTO
      required:
        - id
        - menuId
        - code
        - name
        - description
        - image
        - itemType
      allOf:
        - if:
            properties:
              itemType:
                const: COMBO
          then:
            properties:
              itemCategoryId: false
              classification: false
        - if:
            properties:
              itemType:
                enum:
                  - PREPARED
                  - STOCKED
          then:
            properties:
              comboCategoryId: false
    CatalogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        nextCursor:
          type: string
      required:
        - items
    CatalogPrice:
      type: object
      description: FIXED si una unidad elegible o todas comparten precio; FROM si difieren. Un item sin unidad elegible se excluye del catálogo y no expone precio numérico. La disponibilidad no modifica este precio.
      properties:
        presentation:
          type: string
          enum:
            - FIXED
            - FROM
        amount:
          type: number
          description: Precio absoluto de la única unidad elegible o mínimo de las unidades elegibles.
          x-open-issues:
            - OPEN-010
      required:
        - presentation
        - amount
    CatalogVariant:
      type: object
      description: 'Solo variantes estructuralmente elegibles. La disponibilidad, readiness y capacidad operacional son proyecciones separadas de la configuración comercial.'
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        dimensionSelections:
          type: array
          items:
            $ref: '#/components/schemas/DimensionSelection'
        modifierGroups:
          type: array
          items:
            $ref: '#/components/schemas/ModifierGroup'
        resolvedModifiers:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedVariantModifier'
        availability:
          $ref: '#/components/schemas/VariantAvailability'
        preparationStatus:
          $ref: '#/components/schemas/PreparationStatus'
        modifierAvailabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModifierAvailability'
        isAvailable:
          type: boolean
      required:
        - id
        - unitPrice
        - dimensionSelections
        - modifierGroups
        - resolvedModifiers
        - isAvailable
    ComboCategory:
      type: object
      description: Categoría exclusiva de combos; no hereda categoría ni clasificación de componentes.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        menuId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
      required:
        - id
        - menuId
        - name
    ComboCategoryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
        - name
    ComboCategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComboCategory'
      required:
        - items
    ComboCategoryPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
    ComboCloneRequest:
      type: object
      description: 'Clonación completa, con nuevos IDs para configuración, slots y opciones.'
      properties:
        targetItemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
      required:
        - targetItemId
    ComboConfiguration:
      type: object
      description: No tiene ciclo de vida status ni variantes propias. Precio final de selección de combo = unitPrice absoluto + priceDelta de opciones seleccionadas + deltas efectivos de modificadores seleccionados en componentes; nunca suma unitPrice regular de las variantes componentes.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        menuItemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        code:
          type: string
        name:
          type: string
        description:
          type: string
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        commercialRevision:
          type: integer
          minimum: 1
        isStructurallyEligible:
          type: boolean
        availability:
          type: object
          properties:
            comboConfigurationId:
              type: string
              description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
              minLength: 1
            available:
              type: boolean
          required:
            - comboConfigurationId
            - available
        review:
          $ref: '#/components/schemas/ReviewTracking'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ComboSlot'
        warnings:
          type: array
          description: Advertencias estructuradas de slots incompletos en MenuItem INACTIVE; vacío cuando no aplican.
          items:
            $ref: '#/components/schemas/Warning'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - menuItemId
        - code
        - name
        - unitPrice
        - enabled
        - commercialRevision
        - review
        - slots
        - warnings
    ComboConfigurationCreate:
      type: object
      description: En MenuItem COMBO ACTIVE una configuración habilitada exige al menos un slot; bajo INACTIVE puede guardarse incompleta con advertencia.
      properties:
        code:
          type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ComboSlotCreate'
      required:
        - code
        - name
        - unitPrice
        - enabled
    ComboConfigurationDetail:
      $ref: '#/components/schemas/ComboConfiguration'
    ComboConfigurationPatch:
      type: object
      description: Retirar con enabled=false si fue publicada o referenciada; no cambia MenuItem.status.
      properties:
        code:
          type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
    ComboCopyRequest:
      type: object
      description: Copia atómica a una configuración existente; cada slot origen debe mapearse explícitamente.
      properties:
        targetConfigurationId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        slotMappings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SlotCopyMapping'
      required:
        - targetConfigurationId
        - slotMappings
    ComboCopyResult:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/ComboConfiguration'
        createdSlotIds:
          type: array
          items:
            type: string
            description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
            minLength: 1
        createdOptionIds:
          type: array
          items:
            type: string
            description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
            minLength: 1
      required:
        - configuration
        - createdSlotIds
        - createdOptionIds
    ComboOption:
      type: object
      description: Opciones distintas del mismo slot pueden apuntar a la misma variante. Cada opción seleccionable aporta una unidad de capacidad independientemente de quantity.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        slotId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        itemVariantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        displayOrder:
          type: integer
          minimum: 0
        available:
          type: boolean
        isStructurallyEligible:
          type: boolean
      required:
        - id
        - slotId
        - itemVariantId
        - quantity
        - priceDelta
        - enabled
        - displayOrder
    ComboOptionBatchRequest:
      type: object
      description: 'Cada destino se aplica o rechaza por completo, con posible éxito parcial entre destinos.'
      properties:
        sourceConfigurationId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        sourceOptionIds:
          type: array
          minItems: 1
          items:
            type: string
            description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
            minLength: 1
        destinations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComboCopyRequest'
      required:
        - sourceConfigurationId
        - sourceOptionIds
        - destinations
    ComboOptionBatchResult:
      type: object
      description: Resultado por destino; no existe aplicación parcial por slot. Códigos de error de lote pendientes en OPEN-002.
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              targetConfigurationId:
                type: string
                description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
                minLength: 1
              status:
                type: string
                enum:
                  - APPLIED
                  - REJECTED
              configuration:
                $ref: '#/components/schemas/ComboConfiguration'
              error:
                $ref: '#/components/schemas/ApiError'
            required:
              - targetConfigurationId
              - status
            allOf:
              - if:
                  properties:
                    status:
                      const: APPLIED
                then:
                  required:
                    - configuration
                  properties:
                    error: false
              - if:
                  properties:
                    status:
                      const: REJECTED
                then:
                  required:
                    - error
                  properties:
                    configuration: false
      required:
        - results
    ComboOptionCreate:
      type: object
      properties:
        itemVariantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        displayOrder:
          type: integer
          minimum: 0
      required:
        - itemVariantId
        - quantity
        - priceDelta
        - enabled
    ComboOptionPatch:
      type: object
      properties:
        itemVariantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        displayOrder:
          type: integer
          minimum: 0
    ComboSlot:
      type: object
      description: Un slot deshabilitado se excluye de elegibilidad y disponibilidad; minSelections <= maxSelections. priceReference es informativo administrativo para cada slot.
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        comboConfigurationId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
        enabled:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 0
        orderIndex:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/ComboOption'
        availableCapacity:
          type: integer
          minimum: 0
        priceReference:
          $ref: '#/components/schemas/SlotPriceReference'
      required:
        - id
        - comboConfigurationId
        - name
        - enabled
        - minSelections
        - maxSelections
        - orderIndex
        - options
        - priceReference
    ComboSlotCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 0
        orderIndex:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/ComboOptionCreate'
      required:
        - name
        - enabled
        - minSelections
        - maxSelections
    ComboSlotPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 0
        orderIndex:
          type: integer
          minimum: 0
    DefinitionComboConfiguration:
      type: object
      description: 'Precio absoluto y composición comercial, sin estado de revisión ni disponibilidad operacional.'
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        menuItemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        code:
          type: string
        name:
          type: string
        description:
          type: string
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        slots:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionComboSlot'
      required:
        - id
        - menuItemId
        - code
        - name
        - unitPrice
        - enabled
        - slots
    DefinitionComboOption:
      type: object
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        itemVariantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
      required:
        - id
        - itemVariantId
        - quantity
        - priceDelta
        - enabled
    DefinitionComboSlot:
      type: object
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
        enabled:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionComboOption'
      required:
        - id
        - name
        - enabled
        - minSelections
        - maxSelections
        - options
    DefinitionItem:
      type: object
      description: Definición comercial para la proyección independiente de Orders + Kitchen. Incluye PREPARED inactivas; excluye review y señales operacionales.
      properties:
        item:
          $ref: '#/components/schemas/MenuItem'
        variantDimensions:
          type: array
          items:
            $ref: '#/components/schemas/VariantDimension'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionVariant'
        modifierGroups:
          type: array
          items:
            $ref: '#/components/schemas/ModifierGroup'
        variantModifierConfigs:
          type: array
          items:
            $ref: '#/components/schemas/VariantModifierConfig'
        comboConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionComboConfiguration'
      required:
        - item
        - variantDimensions
        - variants
        - modifierGroups
        - variantModifierConfigs
        - comboConfigurations
    DefinitionList:
      type: object
      description: Incluye variantes PREPARED preparadas aún inactivas para asociación culinaria en Orders + Kitchen.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionItem'
        nextCursor:
          type: string
      required:
        - items
