    Conflict:
      description: 'Conflicto de estado, revisión observada obsoleta, duplicidad o intento de eliminación restringida.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: 'Conflicto de estado, revisión observada obsoleta, duplicidad o intento de eliminación restringida.'
      x-open-issues:
        - OPEN-002
    Forbidden:
