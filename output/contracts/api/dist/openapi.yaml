      description: No se permiten combinaciones habilitadas duplicadas ni representar simultáneamente la misma oferta como item DEFAULT y variante de otro item. Para item sin dimensiones se crea una única variante técnica DEFAULT.
      properties:
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        dimensionSelections:
          type: array
          items:
            $ref: '#/components/schemas/DimensionSelection'
      required:
        - unitPrice
        - enabled
        - dimensionSelections
    VariantDimension:
      type: object
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        menuItemId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
        orderIndex:
          type: integer
          minimum: 0
        values:
          type: array
          items:
            $ref: '#/components/schemas/VariantValue'
      required:
        - id
        - menuItemId
        - name
        - orderIndex
        - values
    VariantMigrationRequest:
      type: object
      description: Sustituye DEFAULT por variantes explícitas como una sola operación y una revisión comercial; no expone estado parcial.
      properties:
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantCreate'
      required:
        - variants
    VariantMigrationResult:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/MenuItemDetail'
        createdVariantIds:
          type: array
          items:
            type: string
            description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
            minLength: 1
      required:
        - item
        - createdVariantIds
    VariantModifierConfig:
      type: object
      properties:
        variantId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        modifierOptionId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        enabled:
          type: boolean
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        maxQuantity:
          type: integer
          minimum: 0
      required:
        - variantId
        - modifierOptionId
        - enabled
        - priceDelta
        - maxQuantity
    VariantModifierConfigInput:
      type: object
      description: PUT sustituye la excepción comercial de la tupla variantId + modifierOptionId.
      properties:
        enabled:
          type: boolean
        priceDelta:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        maxQuantity:
          type: integer
          minimum: 0
      required:
        - enabled
        - priceDelta
        - maxQuantity
    VariantPatch:
      type: object
      description: 'Retiro no destructivo: enabled=false si la variante fue publicada o referenciada.'
      properties:
        unitPrice:
          type: number
          description: 'Magnitud monetaria lógica. Moneda, precisión, signo y redondeo pendientes en OPEN-010.'
          x-open-issues:
            - OPEN-010
        enabled:
          type: boolean
        dimensionSelections:
          type: array
          items:
            $ref: '#/components/schemas/DimensionSelection'
    VariantValue:
      type: object
      properties:
        id:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        dimensionId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        name:
          type: string
        orderIndex:
          type: integer
          minimum: 0
      required:
        - id
        - dimensionId
        - name
        - orderIndex
    Warning:
      type: object
      description: 'Advertencia identificable de definición incompleta en INACTIVE. Para grupos y slots informa identidad, mínimo y capacidad; MenuItem identifica ausencia de unidad vendible.'
      properties:
        entityType:
          type: string
          enum:
            - MenuItem
            - ModifierGroup
            - ComboSlot
        entityId:
          type: string
          description: Identificador lógico opaco; la ERS no fija UUID ni formato físico.
          minLength: 1
        minSelections:
          type: integer
          minimum: 0
        calculatedCapacity:
          type: integer
          minimum: 0
        message:
          type: string
      required:
        - entityType
        - entityId
        - message
      allOf:
        - if:
            properties:
              entityType:
                const: MenuItem
          then:
            properties:
              minSelections: false
              calculatedCapacity: false
        - if:
            properties:
              entityType:
                enum:
                  - ModifierGroup
                  - ComboSlot
          then:
            required:
              - minSelections
              - calculatedCapacity
  responses:
    BadRequest:
      description: 'Solicitud mal formada, campo obligatorio omitido o mapeo ambiguo.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: BAD_REQUEST
            message: 'Solicitud mal formada, campo obligatorio omitido o mapeo ambiguo.'
