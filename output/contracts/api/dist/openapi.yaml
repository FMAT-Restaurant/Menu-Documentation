openapi: 3.1.0
info:
  title: API síncrona de Menu/Catálogo
  version: 2.1.0
  description: |
    Contrato HTTP aceptado derivado de la ERS 2.1.0 y documentado en
    ../api-contract.md. Define las rutas, métodos, cuerpos, códigos y formatos
    de intercambio. Las reglas comerciales citadas proceden de la ERS. Solo
    cubre capacidades propias de Menu; las identidades de InventoryItem son
    referencias externas. Autenticación y autorización aún no tienen mecanismo
    ni política definidos y permanecen abiertas; su ausencia no determina que
    la API sea anónima o pública. Las reglas de concurrencia también permanecen
    abiertas. Se reservan respuestas reutilizables para integrar autenticación
    y autorización cuando se definan.
servers:
  - url: /api/v1
    description: Raíz aceptada de la API de Menu.
tags:
  - name: Catálogo
    description: Consulta de entradas y ofertas publicables de un menú.
  - name: Categorías
    description: Administración de la clasificación comercial de un menú.
  - name: Entradas
    description: Identidad comercial, estados y archivado de entradas.
  - name: Ofertas
    description: Presentaciones vendibles y sus revisiones comerciales.
  - name: Composiciones
    description: Slots, fuentes de contenido, recetas locales y personalizaciones por oferta.
  - name: Recetas
    description: Bibliotecas, recetas reutilizables y revisiones identificables.
paths:
  /menus/{menuId}/catalog:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    get:
      tags:
        - Catálogo
      operationId: listPublishedCatalog
      summary: Consultar catálogo publicable
      description: |
        Presenta solo entradas ACTIVE con ofertas ACTIVE que satisfacen las reglas
        de publicación. Cada entrada mantiene su brandName y cada oferta su
        presentationTag, basePrice y composición. Las opciones INACTIVE no se
        ofrecen como elecciones nuevas. No decide OPEN-002 sobre defaultOfferId.
        Usa limit y un cursor opaco: omite cursor al iniciar y envía
        pagination.nextCursor para continuar con los mismos filtros y limit. Un
        nextCursor nulo indica que no hay otra página; no se calcula un total.
        REQ-MENU-CAT-002; BR-MENU-004/006/016; INV-MENU-002.
      parameters:
        - name: q
          in: query
          description: Búsqueda textual sobre identidad comercial.
          schema:
            type: string
          example: pollo
        - name: categoryId
          in: query
          description: Filtra por categoría del mismo menú.
          schema:
            $ref: '#/components/schemas/Identifier'
          example: cat-1
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entradas publicables con sus ofertas vendibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCatalogPage'
              examples:
                primeraPagina:
                  $ref: '#/components/examples/PublishedCatalogPageFirst'
                paginaSiguiente:
                  $ref: '#/components/examples/PublishedCatalogPageNext'
                sinCoincidencias:
                  $ref: '#/components/examples/PublishedCatalogPageEmpty'
        '400':
          $ref: '#/components/responses/CursorPaginationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /menus/{menuId}/catalog/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/EntryId'
    get:
      tags:
        - Catálogo
      operationId: getPublishedCatalogEntry
      summary: Consultar detalle publicable de entrada
      description: |
        Devuelve una entrada publicable y sus ofertas vigentes; si la entrada
        o sus ofertas no son publicables, no expone un detalle comercial vigente.
        REQ-MENU-CAT-002 y REQ-MENU-OFFER-002.
      responses:
        '200':
          description: Entrada publicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedEntry'
              examples:
                entradaPublicable:
                  $ref: '#/components/examples/PublishedEntry'
        '404':
          $ref: '#/components/responses/NotFound'
  /menus/{menuId}/categories:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    get:
      tags:
        - Categorías
      operationId: listMenuCategories
      summary: Consultar categorías del menú
      description: |
        REQ-MENU-CAT-001; cada categoría pertenece a un solo menú.
        page inicia en 1 y pageSize usa 20 por omisión, con máximo de 100.
        La respuesta informa page, pageSize, totalItems y totalPages.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Categorías del menú.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
              examples:
                primeraPagina:
                  $ref: '#/components/examples/CategoryPageFirst'
                paginaSiguiente:
                  $ref: '#/components/examples/CategoryPageNext'
                sinCategorias:
                  $ref: '#/components/examples/CategoryPageEmpty'
        '400':
          $ref: '#/components/responses/OffsetPaginationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Categorías
      operationId: createMenuCategory
      summary: Crear categoría
      description: REQ-MENU-CAT-001; BR-MENU-001; INV-MENU-001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
            examples:
              nuevaCategoria:
                $ref: '#/components/examples/CategoryInput'
      responses:
        '201':
          description: Categoría creada.
          headers:
            Location:
              required: true
              description: URI del recurso creado, con categoryId igual al id de la categoría en el cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/menus/menu-1/categories/cat-1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                creada:
                  $ref: '#/components/examples/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /menus/{menuId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags:
        - Categorías
      operationId: patchMenuCategory
      summary: Editar categoría
      description: |
        Actualiza solo los campos presentes; el omitido conserva su valor. No
        acepta null ni un cuerpo vacío. La categoría permanece en el menú de la
        URI y no se pueden cambiar id ni menuId. REQ-MENU-CAT-001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatch'
            examples:
              cambiarNombre:
                summary: La descripción se conserva
                value:
                  name: Especialidades
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                actualizada:
                  $ref: '#/components/examples/CategoryEdited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /menus/{menuId}/entries:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    get:
      tags:
        - Entradas
      operationId: listMenuEntries
      summary: Listar entradas para administración
      description: |
        Incluye entradas activas, inactivas y archivadas con sus ofertas.
        REQ-MENU-ENTRY-001/002/003.
        page inicia en 1 y pageSize usa 20 por omisión, con máximo de 100.
        La respuesta informa page, pageSize, totalItems y totalPages.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entradas del menú.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
              examples:
                primeraPagina:
                  $ref: '#/components/examples/EntryPageFirst'
                paginaSiguiente:
                  $ref: '#/components/examples/EntryPageNext'
                sinEntradas:
                  $ref: '#/components/examples/EntryPageEmpty'
        '400':
          $ref: '#/components/responses/OffsetPaginationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Entradas
      operationId: createMenuEntry
      summary: Crear entrada inactiva
      description: |
        Crea identidad comercial propia del menú con estado INACTIVE. Las
        categorías deben pertenecer al mismo menú. La entrada recién creada aún
        no tiene ofertas: offers es [] y defaultOfferId se omite porque todavía
        no existe una oferta propia a la que pueda apuntar. La creación no publica
        la entrada. REQ-MENU-ENTRY-001;
        BR-MENU-001/002/003; INV-MENU-001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryInput'
            examples:
              entradaInicial:
                summary: Identidad comercial y categorías del mismo menú
                value:
                  brandName: Hamburguesa de la casa
                  description: Hamburguesa preparada al momento.
                  imageRef: img-hamburguesa
                  categoryIds:
                    - cat-principales
      responses:
        '201':
          description: Entrada creada en estado INACTIVE.
          headers:
            Location:
              required: true
              description: URI del recurso creado; entryId corresponde al campo id del cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/menus/menu-1/entries/entry-hamburguesa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEntry'
              examples:
                entradaSinOfertas:
                  summary: Entrada creada antes de agregar ofertas
                  value:
                    id: entry-hamburguesa
                    menuId: menu-1
                    brandName: Hamburguesa de la casa
                    description: Hamburguesa preparada al momento.
                    imageRef: img-hamburguesa
                    status: INACTIVE
                    categoryIds:
                      - cat-principales
                    offers: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /menus/{menuId}/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/EntryId'
    get:
      tags:
        - Entradas
      operationId: getMenuEntry
      summary: Consultar entrada para administración
      description: Incluye estado, categorías y ofertas, aunque no sean publicables.
      responses:
        '200':
          description: Definición administrativa de entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
              examples:
                entradaAdministrativa:
                  $ref: '#/components/examples/EntryCreated'
                entradaConOfertas:
                  $ref: '#/components/examples/AdminEntryDetailWithOffers'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Entradas
      operationId: patchMenuEntry
      summary: Editar entrada o cambiar su estado
      description: |
        Actualización parcial: cada campo omitido conserva su valor; categoryIds,
        si se envía, reemplaza la lista completa y todas sus categorías deben
        pertenecer al menú de la entrada; [] elimina todas las categorías.
        defaultOfferId solo puede apuntar a una oferta propia existente y admite
        null para retirar la referencia; los demás campos no admiten null.
        La petición debe contener al menos un campo. Activar exige al menos una oferta válida
        ya existente; no crea ofertas. Desde ACTIVE se permite INACTIVE o
        ARCHIVED; desde INACTIVE se permite ACTIVE o ARCHIVED; desde ARCHIVED
        solo se permite INACTIVE, y la activación requiere una petición posterior
        y explícita. Enviar el estado actual conserva ese estado. Los datos
        comerciales pueden editarse en cualquier estado; el cuerpo no acepta
        modificaciones de las ofertas. Una transición prohibida devuelve 409;
        categorías, oferta predeterminada o publicación inválidas devuelven 422.
        REQ-MENU-ENTRY-002/003; BR-MENU-002/003/004; INV-MENU-001/002.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryPatch'
            examples:
              edicion:
                summary: Cambiar nombre y reemplazar categorías
                value:
                  brandName: Hamburguesa especial
                  categoryIds:
                    - cat-principales
                    - cat-especiales
              activacion:
                summary: Activar tras crear una oferta válida
                value:
                  status: ACTIVE
              archivado:
                summary: Archivar la entrada
                value:
                  status: ARCHIVED
              desarchivado:
                summary: Recuperar la entrada como inactiva
                value:
                  status: INACTIVE
              retirarOfertaPredeterminada:
                summary: Quitar la referencia opcional a una oferta predeterminada
                value:
                  defaultOfferId: null
      responses:
        '200':
          description: Entrada actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
              examples:
                edicion:
                  summary: Cambian los campos enviados; el resto se conserva
                  value:
                    id: entry-hamburguesa
                    menuId: menu-principal
                    brandName: Hamburguesa especial
                    description: Hamburguesa preparada al momento.
                    imageRef: img-hamburguesa
                    status: INACTIVE
                    categoryIds:
                      - cat-principales
                      - cat-especiales
                    offers: []
                activacion:
                  summary: Entrada activa después de existir una oferta válida
                  value:
                    id: entry-hamburguesa
                    menuId: menu-principal
                    brandName: Hamburguesa de la casa
                    description: Hamburguesa preparada al momento.
                    imageRef: img-hamburguesa
                    status: ACTIVE
                    categoryIds:
                      - cat-principales
                    offers:
                      - id: offer-individual
                        entryId: entry-hamburguesa
                        presentationTag: Individual
                        basePrice: 120
                        offerImageRef: img-hamburguesa-individual
                        status: ACTIVE
                        revision: rev-1
                        composition:
                          id: comp-individual
                          selectable: false
                          requiredSlots: []
                          slots:
                            - id: slot-principal
                              name: Hamburguesa
                              quantity: 1
                              options:
                                - id: option-hamburguesa
                                  displayName: Hamburguesa de la casa
                                  status: ACTIVE
                                  source:
                                    type: INVENTORY_ITEM
                                    inventoryItemId: inv-hamburguesa
                                    quantity: 1
                                    unit: pieza
                archivado:
                  summary: Entrada archivada sin ofertas
                  value:
                    id: entry-hamburguesa
                    menuId: menu-principal
                    brandName: Hamburguesa de la casa
                    description: Hamburguesa preparada al momento.
                    imageRef: img-hamburguesa
                    status: ARCHIVED
                    categoryIds:
                      - cat-principales
                    offers: []
                desarchivado:
                  summary: La entrada queda inactiva y requiere activación posterior
                  value:
                    id: entry-hamburguesa
                    menuId: menu-principal
                    brandName: Hamburguesa de la casa
                    description: Hamburguesa preparada al momento.
                    imageRef: img-hamburguesa
                    status: INACTIVE
                    categoryIds:
                      - cat-principales
                    offers: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
        - Entradas
      operationId: deleteArchivedMenuEntry
      summary: Eliminar definitivamente una entrada archivada
      description: |
        Operación síncrona sin cuerpo. Solo admite una entrada ARCHIVED. Antes de
        eliminarla, identifica todas las referencias vigentes a cualquiera de sus
        ofertas, tanto CatalogOfferSource como AddOption de tipo CATALOG_OFFER.
        Desactiva en lote las ComponentOption contenedoras y convierte cada
        referencia en contenido INLINE con compositionSnapshot de la revisión de
        oferta fijada, incluidos slots, alternativas y personalizaciones. Resuelve
        recursivamente las referencias a otras ofertas de la misma entrada dentro
        de las copias; rechaza ciclos o datos que impidan una copia válida. Cada
        oferta contenedora recibe una nueva revisión vigente. Después elimina la
        entrada y sus ofertas vigentes. El resultado es íntegro: ante cualquier
        fallo no aplica ninguna desactivación, conversión ni eliminación.
        Las revisiones históricas no se reescriben y las fotografías de ofertas
        eliminadas que necesitan permanecen consultables. Un segundo DELETE,
        cuando la entrada ya no existe, devuelve 404. REQ-MENU-ENTRY-004;
        BR-MENU-003/029/030; INV-MENU-008/009.
      responses:
        '200':
          description: Entrada eliminada y referencias vigentes convertidas íntegramente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDeletionResult'
              examples:
                sinReferencias:
                  summary: Eliminación directa de una entrada archivada sin referencias vigentes
                  value:
                    entryId: entry-hamburguesa
                    deleted: true
                    deletedOfferIds:
                      - offer-individual
                    affectedOffers: []
                conReferencias:
                  summary: Dos opciones contenedoras desactivadas y referencias materializadas
                  value:
                    entryId: entry-hamburguesa
                    deleted: true
                    deletedOfferIds:
                      - offer-individual
                    affectedOffers:
                      - offerId: offer-combo
                        newRevision: rev-8
                        deactivatedOptionIds:
                          - option-main
                          - option-extra
                        convertedReferences: 2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Entrada no archivada, conflicto de modificación concurrente o estado vigente de una referencia que impide su conversión INLINE; ningún cambio aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                entradaNoArchivada:
                  summary: Entrada activa o inactiva
                  value:
                    code: ENTRY_NOT_ARCHIVED
                    message: La entrada debe estar archivada para eliminarla.
                referenciaNoMaterializable:
                  summary: El estado de una referencia impide convertirla a INLINE
                  value:
                    code: REFERENCE_MATERIALIZATION_CONFLICT
                    message: El estado vigente de una referencia impide completar su conversión a INLINE.
  /menus/{menuId}/entries/{entryId}/offers:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/EntryId'
    get:
      tags:
        - Ofertas
      operationId: listEntryOffers
      summary: Listar ofertas de una entrada
      description: |
        Devuelve presentaciones propias de la entrada, incluidas las activas e
        inactivas. page inicia en 1 y pageSize usa 20 por omisión,
        con máximo de 100; la respuesta informa page, pageSize, totalItems y
        totalPages.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Ofertas de la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
              examples:
                primeraPagina:
                  $ref: '#/components/examples/OfferPageFirst'
                paginaSiguiente:
                  $ref: '#/components/examples/OfferPageNext'
                sinOfertas:
                  $ref: '#/components/examples/OfferPageEmpty'
        '400':
          $ref: '#/components/responses/OffsetPaginationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Ofertas
      operationId: createEntryOffer
      summary: Crear oferta inactiva
      description: |
        Crea una oferta perteneciente a la entrada, con etiqueta opcional,
        basePrice fijo, imagen y Composition inicial completa. Inicia INACTIVE.
        El cliente proporciona los identificadores de Composition y de sus
        elementos anidados; el servidor asigna id y revision de la oferta. Los
        identificadores anidados deben ser únicos en su ámbito y las referencias
        internas deben resolver dentro de la composición recibida; un identificador
        repetido o una referencia interna inválida en el contenido devuelve 422.
        REQ-MENU-OFFER-001/002/003; BR-MENU-005/006/007; INV-MENU-007.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferInput'
            examples:
              ofertaInicial:
                $ref: '#/components/examples/OfferInput'
      responses:
        '201':
          description: Oferta inactiva creada con revisión identificable.
          headers:
            Location:
              required: true
              description: URI consultable de la oferta creada; offerId y entryId corresponden a id y entryId del cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/menus/menu-1/entries/entry-1/offers/offer-1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                ofertaCreada:
                  $ref: '#/components/examples/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /menus/{menuId}/entries/{entryId}/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - Ofertas
      operationId: getEntryOffer
      summary: Consultar definición vigente de oferta
      description: Devuelve identidad, estado actual, revisión y composición vigentes.
      responses:
        '200':
          description: Oferta vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                ofertaVigente:
                  $ref: '#/components/examples/Offer'
                ofertaActiva:
                  $ref: '#/components/examples/OfferActive'
                trasEliminacion:
                  $ref: '#/components/examples/OfferAfterDeletion'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Ofertas
      operationId: setEntryOfferStatus
      summary: Activar o inactivar una oferta
      description: |
        La activación exige Composition válida. OPEN-008 aún no decide si cada
        slot requiere alternativa ACTIVE o solo una alternativa estructural.
        El cuerpo contiene únicamente status. Enviar INACTIVE inactiva la oferta;
        ambas transiciones entre ACTIVE e INACTIVE están permitidas, y enviar el
        estado actual no cambia su revisión comercial. El cambio de
        estado no modifica Composition ni crea una revisión comercial.
        Una activación que incumple la validación vigente devuelve 422.
        REQ-MENU-OFFER-004; BR-MENU-006; INV-MENU-002.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferStatusPatch'
            examples:
              activar:
                $ref: '#/components/examples/OfferStatusPatch'
              inactivar:
                summary: Inactivar la oferta
                value:
                  status: INACTIVE
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                activada:
                  $ref: '#/components/examples/OfferActive'
                inactivada:
                  $ref: '#/components/examples/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /menus/{menuId}/entries/{entryId}/offers/{offerId}/revisions:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/OfferId'
    post:
      tags:
        - Ofertas
      operationId: createEntryOfferRevision
      summary: Crear revisión completa de una oferta
      description: |
        Reemplaza la definición comercial vigente de la oferta y crea una revisión
        identificable, incluida Composition. Referencias publicadas a revisiones
        anteriores permanecen intactas. Las referencias entre ofertas y recetas
        deben ser acíclicas. El cliente suministra los identificadores anidados
        y el servidor asigna la nueva revision. Una Composition inválida o una
        referencia que cree un ciclo se considera validación del contenido y
        devuelve 422. REQ-MENU-OFFER-005;
        BR-MENU-028/029; INV-MENU-008.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferInput'
            examples:
              nuevaDefinicion:
                $ref: '#/components/examples/OfferRevisionInput'
      responses:
        '201':
          description: Nueva revisión vigente de la oferta.
          headers:
            Location:
              required: true
              description: URI consultable de la revisión creada; offerId y revision corresponden al cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/catalog-offers/offer-1/revisions/rev-2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                nuevaRevision:
                  $ref: '#/components/examples/OfferRevised'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /catalog-offers/{offerId}/revisions/{offerRevision}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
      - $ref: '#/components/parameters/OfferRevision'
    get:
      tags:
        - Ofertas
      operationId: getCatalogOfferRevision
      summary: Consultar revisión histórica de una oferta
      description: |
        Recupera la definición comercial identificada que puede estar fijada
        por CatalogOfferSource. El estado administrativo actual se consulta en
        la oferta vigente y no se reinterpreta como contenido de esta revisión.
        La fotografía histórica sigue consultable aunque la entrada y la oferta
        vigentes hayan sido eliminadas; conserva brandNameSnapshot para mostrar
        el nombre comercial original. REQ-MENU-OFFER-005; BR-MENU-029/030.
      responses:
        '200':
          description: Definición comercial histórica de la oferta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferRevision'
              examples:
                revisionHistorica:
                  $ref: '#/components/examples/OfferHistorical'
                referenciasHistoricas:
                  $ref: '#/components/examples/OfferHistoricalWithDeletedReferences'
                ofertaEliminada:
                  $ref: '#/components/examples/DeletedOfferHistorical'
        '404':
          $ref: '#/components/responses/NotFound'
  /menus/{menuId}/entries/{entryId}/offers/{offerId}/composition:
    parameters:
      - $ref: '#/components/parameters/MenuId'
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - Composiciones
      operationId: getOfferComposition
      summary: Consultar composición vigente
      description: |
        Incluye slots, regiones, alternativas de contenido, fuentes, ajustes
        locales y personalizaciones de la revisión vigente. REQ-MENU-COMP-001..006,
        REQ-MENU-CONT-001..004 y REQ-MENU-PERS-001..006.
      responses:
        '200':
          description: Composición vigente de la oferta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
              examples:
                composicionVigente:
                  $ref: '#/components/examples/Composition'
                conFuentesYPersonalizaciones:
                  $ref: '#/components/examples/CompositionWithSources'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Composiciones
      operationId: replaceOfferComposition
      summary: Reemplazar composición completa
      description: |
        Sustituye la composición completa. El cuerpo incluye todos los campos
        requeridos de la rama automática o elegible; omitir una propiedad opcional
        la retira. No se admiten valores null. composition.id debe coincidir con
        el ID vigente. El cliente conserva los IDs anidados cuando representa la
        misma entidad, asigna IDs nuevos a las nuevas y omite las retiradas; cada
        referencia interna debe resolver en el cuerpo. Un contenido distinto crea
        una nueva revisión identificable de CatalogOffer; repetir el mismo cuerpo
        sobre la definición vigente devuelve la misma revisión, sin crear otra.
        Las referencias a revisiones previas no cambian. Rechaza slots sin
        alternativas, orígenes múltiples, límites inconsistentes, referencias
        inválidas, ciclos y personalizaciones fuera de la receta efectiva.
        Estas condiciones de contenido inválido devuelven 422.
        REQ-MENU-COMP-001..006,
        REQ-MENU-CONT-001..004, REQ-MENU-REC-002, REQ-MENU-PERS-001..006;
        INV-MENU-003..008.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Composition'
            examples:
              completa:
                $ref: '#/components/examples/CompositionSelectable'
              origenesYPersonalizaciones:
                $ref: '#/components/examples/CompositionWithSources'
      responses:
        '200':
          description: Composición vigente y revisión resultante; un envío idéntico conserva la revisión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                nuevaRevision:
                  $ref: '#/components/examples/OfferAfterCompositionPut'
                envioIdentico:
                  $ref: '#/components/examples/OfferAfterCompositionPut'
                origenesYPersonalizaciones:
                  $ref: '#/components/examples/OfferAfterSourceCompositionPut'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /recipe-libraries:
    get:
      tags:
        - Recetas
      operationId: listRecipeLibraries
      summary: Listar bibliotecas de recetas
      description: |
        Consulta bibliotecas administradas por Menu. La ruta global
        /recipe-libraries está aceptada; OPEN-003 mantiene sin resolver si el
        alcance de RecipeLibrary es global/compartido o por menú.
        page inicia en 1 y pageSize usa 20 por omisión, con máximo de 100;
        la respuesta informa page, pageSize, totalItems y totalPages.
        REQ-MENU-REC-001.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bibliotecas disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeLibraryPage'
              examples:
                primeraPagina:
                  $ref: '#/components/examples/RecipeLibraryPageFirst'
                paginaSiguiente:
                  $ref: '#/components/examples/RecipeLibraryPageNext'
                sinBibliotecas:
                  $ref: '#/components/examples/RecipeLibraryPageEmpty'
        '400':
          $ref: '#/components/responses/OffsetPaginationBadRequest'
    post:
      tags:
        - Recetas
      operationId: createRecipeLibrary
      summary: Crear biblioteca de recetas
      description: La pertenencia entre menús sigue pendiente en OPEN-003. REQ-MENU-REC-001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeLibraryInput'
            examples:
              nuevaBiblioteca:
                $ref: '#/components/examples/RecipeLibraryInput'
      responses:
        '201':
          description: Biblioteca creada.
          headers:
            Location:
              required: true
              description: URI de la biblioteca creada; libraryId corresponde al id del cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/recipe-libraries/library-1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeLibrary'
              examples:
                creada:
                  $ref: '#/components/examples/RecipeLibrary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /recipe-libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    patch:
      tags:
        - Recetas
      operationId: patchRecipeLibrary
      summary: Editar nombre de biblioteca
      description: |
        Sustituye únicamente name; id y el alcance de la biblioteca no se
        modifican. El cuerpo requiere name, no admite null ni otros campos.
        Repetir el mismo nombre deja la representación igual. El alcance entre
        menús sigue pendiente. REQ-MENU-REC-001; OPEN-003.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeLibraryPatch'
            examples:
              renombrar:
                $ref: '#/components/examples/RecipeLibraryPatch'
      responses:
        '200':
          description: Biblioteca actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeLibrary'
              examples:
                renombrada:
                  $ref: '#/components/examples/RecipeLibraryEdited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /recipe-libraries/{libraryId}/recipes:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags:
        - Recetas
      operationId: listLibraryRecipes
      summary: Listar recetas reutilizables
      description: |
        Incluye definiciones de biblioteca, estado y revisión vigente.
        page inicia en 1 y pageSize usa 20 por omisión, con máximo de 100;
        la respuesta informa page, pageSize, totalItems y totalPages.
        REQ-MENU-REC-001/003.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Recetas de la biblioteca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePage'
              examples:
                primeraPagina:
                  $ref: '#/components/examples/RecipePageFirst'
                paginaSiguiente:
                  $ref: '#/components/examples/RecipePageNext'
                sinRecetas:
                  $ref: '#/components/examples/RecipePageEmpty'
        '400':
          $ref: '#/components/responses/OffsetPaginationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Recetas
      operationId: createLibraryRecipe
      summary: Crear receta reutilizable
      description: |
        Define rendimiento, estado explícito y una o más líneas identificables.
        Cada línea apunta a InventoryItem o a otra receta reutilizable. Se
        rechazan ciclos. El cliente proporciona id y partKey de cada línea; el
        servidor asigna id y revision de la receta. Una definición inválida o
        una referencia que cree un ciclo devuelve 422. REQ-MENU-REC-001;
        BR-MENU-018/019/020/028;
        INV-MENU-005/008.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
            examples:
              recetaInicial:
                $ref: '#/components/examples/RecipeInput'
              conSubreceta:
                $ref: '#/components/examples/RecipeWithSubrecipeInput'
      responses:
        '201':
          description: Receta creada con revisión identificable.
          headers:
            Location:
              required: true
              description: URI consultable de la receta creada; libraryId y recipeId corresponden al cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/recipe-libraries/library-1/recipes/recipe-1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
              examples:
                creada:
                  $ref: '#/components/examples/Recipe'
                conSubreceta:
                  $ref: '#/components/examples/RecipeWithSubrecipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /recipe-libraries/{libraryId}/recipes/{recipeId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags:
        - Recetas
      operationId: getLibraryRecipe
      summary: Consultar receta y sus revisiones identificables
      description: |
        Sin parámetro revision devuelve la vigente. Con revision devuelve esa
        fotografía conservada; availableRevisions enumera los identificadores
        existentes y consultables al momento de la consulta, sin ser parte
        inmutable de la fotografía. Una revisión inexistente devuelve 404.
        REQ-MENU-REC-003; BR-MENU-020; INV-MENU-008.
      parameters:
        - name: revision
          in: query
          description: Revisión histórica opcional de la misma receta.
          schema:
            $ref: '#/components/schemas/Revision'
      responses:
        '200':
          description: Receta en la revisión solicitada o vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
              examples:
                vigente:
                  $ref: '#/components/examples/RecipeRevised'
                historica:
                  $ref: '#/components/examples/RecipeHistorical'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /recipe-libraries/{libraryId}/recipes/{recipeId}/revisions:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/RecipeId'
    post:
      tags:
        - Recetas
      operationId: createLibraryRecipeRevision
      summary: Crear revisión de receta reutilizable
      description: |
        Publica una nueva definición identificable sin alterar revisiones
        previas ni referencias que las fijaron. Las ofertas se actualizan mediante
        una nueva revisión de su composición. El cliente conserva los id y
        partKey de líneas que representan la misma aparición y asigna nuevos a
        líneas añadidas; el servidor asigna la nueva revision de la receta. Una
        definición inválida o una referencia que cree un ciclo devuelve 422.
        REQ-MENU-REC-003;
        BR-MENU-020/028; INV-MENU-008.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
            examples:
              nuevaDefinicion:
                $ref: '#/components/examples/RecipeRevisionInput'
      responses:
        '201':
          description: Nueva revisión vigente de receta.
          headers:
            Location:
              required: true
              description: URI consultable de la revisión creada; libraryId, recipeId y revision corresponden al cuerpo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/recipe-libraries/library-1/recipes/recipe-1?revision=rev-2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
              examples:
                nuevaRevision:
                  $ref: '#/components/examples/RecipeRevised'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  responses:
    Unauthorized:
      description: Reserva de respuesta para credenciales ausentes o inválidas cuando se acuerde la autenticación. No se aplica todavía a ninguna operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Se requieren credenciales válidas.
    Forbidden:
      description: Reserva de respuesta para acceso no autorizado cuando se acuerde la política de permisos. No se aplica todavía a ninguna operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            denied:
              value:
                code: FORBIDDEN
                message: La operación no está permitida para esta identidad.
    CursorPaginationBadRequest:
      description: El límite o el cursor de continuación no corresponde a esta consulta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            limiteInvalido:
              summary: El límite debe estar entre 1 y 100
              value:
                code: INVALID_PAGINATION
                message: El parámetro limit debe ser un entero entre 1 y 100.
                details:
                  - path: limit
                    message: 'Valor recibido: 0.'
            cursorIncompatible:
              summary: El cursor no pertenece a los filtros enviados
              value:
                code: INVALID_CURSOR
                message: Reinicie la consulta si cambia q o categoryId.
                details:
                  - path: cursor
                    message: El cursor no corresponde a los filtros actuales.
    NotFound:
      description: Recurso o revisión inexistente en el ámbito solicitado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            resourceNotFound:
              summary: Recurso inexistente en el ámbito indicado
              value:
                code: NOT_FOUND
                message: No se encontró el recurso solicitado.
    OffsetPaginationBadRequest:
      description: El número de página o su tamaño no cumple los rangos de paginación administrativa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            paginaInvalida:
              summary: La página debe iniciar en 1
              value:
                code: INVALID_PAGINATION
                message: El parámetro page debe ser un entero mayor o igual a 1.
                details:
                  - path: page
                    message: 'Valor recibido: 0.'
            tamanoInvalido:
              summary: El tamaño debe estar entre 1 y 100
              value:
                code: INVALID_PAGINATION
                message: El parámetro pageSize debe ser un entero entre 1 y 100.
                details:
                  - path: pageSize
                    message: 'Valor recibido: 101.'
    BadRequest:
      description: El cuerpo JSON está mal formado o un parámetro tiene formato o sintaxis inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformedJson:
              summary: Cuerpo JSON mal formado
              value:
                code: BAD_REQUEST
                message: El cuerpo JSON no puede procesarse.
            invalidParameterFormat:
              summary: Parámetro con formato inválido
              value:
                code: INVALID_PARAMETER_FORMAT
                message: El parámetro page debe ser un entero.
                details:
                  - path: page
                    message: 'Valor recibido: primero.'
    UnsupportedMediaType:
      description: El tipo de contenido de la solicitud no está soportado.
      headers:
        Accept:
          description: Tipo de contenido aceptado para el cuerpo de la solicitud.
          schema:
            type: string
          example: application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupportedContentType:
              summary: Content-Type no soportado
              value:
                code: UNSUPPORTED_MEDIA_TYPE
                message: El tipo de contenido text/plain no está soportado; use application/json.
    Unprocessable:
      description: La solicitud usa Content-Type application/json y el cuerpo tiene sintaxis JSON válida, pero los campos incumplen el schema o la definición infringe reglas del dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            schemaViolation:
              summary: Campo que incumple el schema
              value:
                code: SCHEMA_VALIDATION_FAILED
                message: El campo name es obligatorio.
                details:
                  - path: name
                    message: El valor es obligatorio.
            invalidComposition:
              summary: Definición que incumple una regla del dominio
              value:
                code: DOMAIN_VALIDATION_FAILED
                message: La composición debe contener al menos un slot con una alternativa.
                details:
                  - path: composition.slots
                    message: Se requiere al menos un slot.
    Conflict:
      description: Una transición no permitida por el estado actual o un conflicto concurrente impide completar la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidState:
              summary: Conflicto con el estado actual
              value:
                code: STATE_CONFLICT
                message: El estado actual impide esta operación.
  schemas:
    Identifier:
      type: string
      minLength: 1
      description: Identificador opaco; no implica formato compartido entre contextos.
    ImageRef:
      type: string
      minLength: 1
      description: Referencia descriptiva a imagen; formato y carga siguen en OPEN-005.
    EntryStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED
    Amount:
      type: number
      description: Importe declarado. Moneda, precisión, redondeo y rangos siguen en OPEN-001.
    OfferStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    Revision:
      type: string
      minLength: 1
      description: Identificador opaco de una revisión publicada e inmutable.
    OptionStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    RecipeStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    InventoryIngredient:
      type: object
      additionalProperties: false
      required:
        - id
        - partKey
        - targetType
        - inventoryItemId
        - quantity
        - unit
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        partKey:
          type: string
          minLength: 1
          description: Clave inequívoca dentro de la receta.
        displayName:
          type: string
        targetType:
          const: INVENTORY_ITEM
        inventoryItemId:
          $ref: '#/components/schemas/Identifier'
        quantity:
          type: number
          description: Rango y precisión siguen en OPEN-006.
        unit:
          type: string
          minLength: 1
    RecipeIngredient:
      type: object
      additionalProperties: false
      required:
        - id
        - partKey
        - targetType
        - recipeId
        - recipeRevision
        - quantity
        - unit
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        partKey:
          type: string
          minLength: 1
        displayName:
          type: string
        targetType:
          const: RECIPE
        recipeId:
          $ref: '#/components/schemas/Identifier'
        recipeRevision:
          $ref: '#/components/schemas/Revision'
        quantity:
          type: number
        unit:
          type: string
          minLength: 1
    ComponentIngredient:
      description: Línea identificable que apunta exclusivamente a un artículo externo o una receta reutilizable. Las referencias de recetas no forman ciclos.
      oneOf:
        - $ref: '#/components/schemas/InventoryIngredient'
        - $ref: '#/components/schemas/RecipeIngredient'
    InlineRecipe:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - scope
        - name
        - yieldQuantity
        - yieldUnit
        - status
        - ingredients
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        scope:
          const: INLINE
        name:
          type: string
          minLength: 1
        description:
          type: string
        revision:
          $ref: '#/components/schemas/Revision'
          description: Identificador local conservado dentro de la revisión de oferta que publica esta receta.
        yieldQuantity:
          type: number
        yieldUnit:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/RecipeStatus'
