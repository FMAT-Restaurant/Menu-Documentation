OffsetPageMetadata:
  type: object
  additionalProperties: false
  required: [page, pageSize, totalItems, totalPages]
  description: Metadatos de paginación numerada; page inicia en 1 y totalPages es 0 cuando totalItems es 0.
  properties:
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 100 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }

CursorPageMetadata:
  type: object
  additionalProperties: false
  required: [limit, nextCursor]
  description: Metadatos para continuar una consulta sin exponer el desplazamiento interno.
  properties:
    limit: { type: integer, minimum: 1, maximum: 100 }
    nextCursor:
      anyOf:
        - { type: string, minLength: 1 }
        - { type: 'null' }

PublishedCatalogPage:
  type: object
  additionalProperties: false
  required: [items, pagination]
  properties:
    items: { $ref: './catalog.yaml#/PublishedEntryList' }
    pagination: { $ref: '#/CursorPageMetadata' }

