PageMeta:
  type: object
  description: Metadatos que indican qué página se devolvió y el tamaño y total de la colección paginada.
  required: [page, pageSize, total, totalPages]
  properties:
    page:
      type: integer
      minimum: 1
      description: Número de la página devuelta, empezando en 1.
      example: 1
    pageSize:
      type: integer
      minimum: 1
      description: Cantidad solicitada de elementos por página; admite cualquier entero positivo.
      example: 12
    total:
      type: integer
      minimum: 0
      description: Cantidad total de elementos que coinciden con la consulta.
      example: 0
    totalPages:
      type: integer
      minimum: 0
      description: Cantidad total de páginas para el tamaño solicitado.
      example: 0
  example:
    page: 2
    pageSize: 20
    total: 51
    totalPages: 3

Image:
  type: object
  description: Imagen de una entrada u oferta; su id queda fijo desde la creación del recurso y el archivo se cambia reemplazándolo.
  required: [id, url, thumbnailUrl]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la imagen.
      example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
    url:
      type: string
      format: uri
      description: URL de la imagen original.
      example: https://cdn.example.com/menu/burger.jpg
    thumbnailUrl:
      type: string
      format: uri
      description: URL de la miniatura de la imagen.
      example: https://cdn.example.com/menu/burger-thumbnail.jpg
  example:
    id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
    url: https://cdn.example.com/menu/burger.jpg
    thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg

InventoryItem:
  type: object
  description: Artículo de Inventario según el contrato de Inventario, referenciado por líneas de ingrediente y opciones.
  required: [id, name, unit]
  properties:
    id:
      type: string
      description: Identificador opaco del artículo según el contrato de Inventario, sin formato UUID requerido.
      example: CARNE-150G
    name:
      type: string
      description: Nombre del artículo según el contrato de Inventario.
      example: Carne Molida Res 80/20
    unit:
      type: string
      description: Unidad de medida que Inventario establece para el artículo; es la única unidad de las cantidades que Menu referencia.
      example: g
  example:
    id: CARNE-150G
    name: Carne Molida Res 80/20
    unit: g

DomainErrorCode:
  type: string
  description: Código estable de la regla de dominio incumplida. Los códigos de 409 se devuelven en error.code y los de 422 en error.details.violations[].code.
  enum:
    - CATEGORY_NAME_TAKEN
    - ENTRY_ARCHIVED
    - ENTRY_NOT_ARCHIVED
    - OFFER_NOT_INACTIVE
    - IMAGE_ALREADY_ASSOCIATED
    - IMAGE_OWNER_ARCHIVED
    - RECIPE_IN_USE
    - SOURCE_TYPE_IMMUTABLE
    - DUPLICATE_OPTION_CONTENT
    - DUPLICATE_INVENTORY_ITEM

Error:
  type: object
  description: Datos del error devuelto por la API.
  required: [message]
  properties:
    message:
      type: string
      description: Explicación del error para quien consume la API.
    code:
      $ref: '#/DomainErrorCode'
      description: Código de la regla de dominio incumplida, cuando aplica.
    details:
      type: object
      description: Datos adicionales opcionales y específicos de la respuesta de error.
      additionalProperties: true

ValidationViolation:
  type: object
  description: Incumplimiento de validación asociado a un campo del cuerpo de la solicitud.
  required: [path, message]
  properties:
    path:
      type: string
      description: Ruta que identifica el campo del cuerpo de la solicitud que no supera la validación.
      example: /name
    message:
      type: string
      description: Explicación de la regla de validación incumplida por el campo.
      example: El nombre es obligatorio.
    code:
      $ref: '#/DomainErrorCode'
  example:
    path: /name
    message: El nombre es obligatorio.

ValidationError:
  description: Error estándar con al menos una infracción de validación en sus detalles.
  allOf:
    - $ref: '#/Error'
    - type: object
      required: [details]
      properties:
        details:
          type: object
          required: [violations]
          properties:
            violations:
              type: array
              minItems: 1
              description: Infracciones de validación encontradas en el cuerpo de la solicitud.
              items:
                $ref: '#/ValidationViolation'
          additionalProperties: true
  example:
    message: El cuerpo de la solicitud contiene campos no válidos.
    details:
      violations:
        - path: /name
          message: El nombre es obligatorio.

ValidationErrorEnvelope:
  type: object
  description: Envoltura estándar que contiene un error de validación.
  required: [error]
  properties:
    error:
      $ref: '#/ValidationError'
  example:
    error:
      message: El cuerpo de la solicitud contiene campos no válidos.
      details:
        violations:
          - path: /name
            message: El nombre es obligatorio.

ErrorEnvelope:
  type: object
  description: Envoltura estándar de una respuesta de error.
  required: [error]
  properties:
    error:
      $ref: '#/Error'

DomainConflictEnvelope:
  type: object
  description: Rechazo 409 por una regla de dominio; error.code identifica la regla y no se aplican cambios.
  required: [error]
  properties:
    error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Explicación del error para quien consume la API.
        code:
          type: string
          enum: [CATEGORY_NAME_TAKEN, ENTRY_ARCHIVED, ENTRY_NOT_ARCHIVED, OFFER_NOT_INACTIVE, IMAGE_ALREADY_ASSOCIATED, IMAGE_OWNER_ARCHIVED, RECIPE_IN_USE]
        details:
          type: object
          additionalProperties: true
  example:
    error:
      message: La entrada está archivada y no admite esta operación.
      code: ENTRY_ARCHIVED

IdempotencyConflictEnvelope:
  type: object
  description: Rechazo 409 de idempotencia; error.details.code identifica el caso.
  required: [error]
  properties:
    error:
      type: object
      required: [message, details]
      properties:
        message:
          type: string
        details:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS]
  example:
    error:
      message: La clave de idempotencia ya está vinculada a una solicitud diferente.
      details:
        code: IDEMPOTENCY_KEY_REUSED

ImageUploadResponse:
  type: object
  description: Respuesta de una carga de imagen exitosa.
  required: [data]
  properties:
    data:
      $ref: '#/Image'

InventoryItemResponse:
  type: object
  description: Respuesta con el artículo de inventario consultado.
  required: [data]
  properties:
    data:
      $ref: '#/InventoryItem'
  example:
    data:
      id: CARNE-150G
      name: Carne Molida Res 80/20
      unit: g

InventoryItemListResponse:
  type: array
  description: >-
    Lista plana, sin paginación, de artículos de Inventario que coinciden con la
    búsqueda `q`. Cada elemento puede traer campos adicionales no documentados
    que se ignoran; solo interesan `id`, `name` y `unit`.
  items:
    $ref: '#/InventoryItem'
  example:
    - id: CARNE-150G
      name: Carne Molida Res 80/20
      unit: g
