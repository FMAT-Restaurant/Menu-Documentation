OfferStatus:
  type: string
  description: Estado de disponibilidad de una oferta del catálogo.
  enum: [ACTIVE, INACTIVE]
  example: ACTIVE

RecipeSlotOption:
  type: object
  description: Opción de slot cuyo origen es una receta. La respuesta incluye la revisión fijada; las respuestas del POST y del PATCH también incluyen su estado.
  additionalProperties: false
  required: [optionId, sourceType, recipeId, recipeRevision, displayName]
  properties:
    optionId:
      type: string
      format: uuid
      description: Identificador UUID de la opción.
      example: a1b2c3d4-e5f6-4789-8abc-def012345678
    sourceType:
      const: RECIPE
      description: Indica que la opción se basa en una receta.
    recipeId:
      type: string
      format: uuid
      description: Identificador UUID de la receta de origen.
      example: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
    recipeRevision:
      type: integer
      minimum: 1
      description: Revisión de receta fijada por la opción.
    status:
      $ref: '#/OfferStatus'
      description: Estado de la opción, incluido en las respuestas del POST y del PATCH; al crearla mediante POST el servidor asigna ACTIVE.
    displayName:
      type: string
      description: Nombre que se muestra para esta opción en el catálogo.
      example: Hamburguesa hawaiana
  example:
    optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
    sourceType: RECIPE
    recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
    recipeRevision: 3
    displayName: Hamburguesa hawaiana

InventoryItemSlotOption:
  type: object
  description: Opción de slot cuyo origen es un insumo de inventario. La respuesta incluye cantidad y unidad; las respuestas del POST y del PATCH también incluyen su estado.
  additionalProperties: false
  required: [optionId, sourceType, inventoryItemId, quantity, unit, displayName]
  properties:
    optionId:
      type: string
      format: uuid
      description: Identificador UUID de la opción.
      example: b2c3d4e5-f678-489a-bcde-f0123456789a
    sourceType:
      const: INVENTORY_ITEM
      description: Indica que la opción se basa directamente en un insumo de inventario.
    inventoryItemId:
      type: string
      format: uuid
      description: Identificador UUID del insumo de inventario de origen.
      example: 5c67b890-1a2b-4d3e-8f9a-0b1c2d3e4f5a
    quantity:
      type: number
      exclusiveMinimum: 0
      description: Cantidad positiva del artículo.
    unit:
      type: string
      minLength: 1
      description: Unidad compatible con la del artículo.
    status:
      $ref: '#/OfferStatus'
      description: Estado de la opción, incluido en las respuestas del POST y del PATCH; al crearla mediante POST el servidor asigna ACTIVE.
    displayName:
      type: string
      description: Nombre que se muestra para esta opción en el catálogo.
      example: Queso cheddar
  example:
    optionId: b2c3d4e5-f678-489a-bcde-f0123456789a
    sourceType: INVENTORY_ITEM
    inventoryItemId: 5c67b890-1a2b-4d3e-8f9a-0b1c2d3e4f5a
    quantity: 150
    unit: g
    displayName: Queso cheddar

SlotOption:
  description: Opción de un slot; cada opción identifica una receta o un insumo de inventario.
  oneOf:
    - $ref: '#/RecipeSlotOption'
    - $ref: '#/InventoryItemSlotOption'

RecipeSlotOptionInput:
  type: object
  description: Datos para crear una opción de slot basada en una receta mediante POST; el servidor genera optionId y asigna status ACTIVE. No se envían optionId ni status en la solicitud.
  additionalProperties: false
  required: [sourceType, recipeId, recipeRevision, displayName]
  properties:
    sourceType:
      const: RECIPE
      description: Indica que la opción se basa en una receta.
    recipeId:
      type: string
      format: uuid
      description: Identificador UUID de la receta de origen.
      example: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
    recipeRevision:
      type: integer
      minimum: 1
      description: Revisión de receta fijada por la opción.
      example: 3
    displayName:
      type: string
      description: >-
        Nombre que se mostrará para esta opción en el menú. Puede diferir del
        nombre de la receta de origen, que se resuelve mediante recipeId.
      example: Hamburguesa hawaiana
  example:
    sourceType: RECIPE
    recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
    recipeRevision: 3
    displayName: Hamburguesa hawaiana

InventoryItemSlotOptionInput:
  type: object
  description: Datos para crear una opción de slot basada en un insumo de inventario mediante POST; el servidor genera optionId y asigna status ACTIVE. No se envían optionId ni status en la solicitud.
  additionalProperties: false
  required: [sourceType, inventoryItemId, quantity, unit, displayName]
  properties:
    sourceType:
      const: INVENTORY_ITEM
      description: Indica que la opción se basa directamente en un insumo de inventario.
    inventoryItemId:
      type: string
      format: uuid
      description: Identificador UUID del insumo de inventario de origen.
      example: 5c67b890-1a2b-4d3e-8f9a-0b1c2d3e4f5a
    quantity:
      type: number
      exclusiveMinimum: 0
      description: Cantidad positiva del artículo.
      example: 150
    unit:
      type: string
      minLength: 1
      description: Unidad compatible con la del artículo.
      example: g
    displayName:
      type: string
      description: >-
        Nombre que se mostrará para esta opción en el menú. Puede diferir del
        nombre del insumo de origen, que se resuelve mediante inventoryItemId.
      example: Queso cheddar
  example:
    sourceType: INVENTORY_ITEM
    inventoryItemId: 5c67b890-1a2b-4d3e-8f9a-0b1c2d3e4f5a
    quantity: 150
    unit: g
    displayName: Queso cheddar

SlotOptionInput:
  description: Datos de una opción de slot con uno de los dos tipos de origen admitidos.
  oneOf:
    - $ref: '#/RecipeSlotOptionInput'
    - $ref: '#/InventoryItemSlotOptionInput'

CompositionSlot:
  type: object
  description: Slot de la composición con una cantidad, un curso y las opciones que pueden ocuparlo.
  required: [slotId, name, quantity, options]
  properties:
    slotId:
      type: string
      format: uuid
      description: Identificador UUID del slot.
      example: c3d4e5f6-789a-4bcd-8ef0-123456789abc
    name:
      type: string
      description: Nombre que identifica el slot dentro de la composición.
      example: Hamburguesa
    status:
      $ref: '#/OfferStatus'
      description: Estado derivado, incluido en la respuesta del PATCH; ACTIVE si alguna opción está ACTIVE e INACTIVE si ninguna lo está.
    quantity:
      type: number
      description: Rango y precisión no definidos en la fuente.
      example: 1
    course:
      type: string
      enum: [entrada, plato fuerte, postre, bebida]
      description: Curso al que pertenece el slot, si se especifica.
      example: plato fuerte
    options:
      type: array
      description: Opciones disponibles para ocupar el slot.
      items:
        $ref: '#/SlotOption'
  example:
    slotId: c3d4e5f6-789a-4bcd-8ef0-123456789abc
    name: Hamburguesa
    quantity: 1
    course: plato fuerte
    options:
      - optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
        sourceType: RECIPE
        recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        recipeRevision: 3
        displayName: Hamburguesa hawaiana

CompositionSlotInput:
  type: object
  description: Datos para crear un slot de una composición; el servidor genera slotId.
  additionalProperties: false
  required: [name, quantity, options]
  properties:
    name:
      type: string
      description: Nombre que identifica el slot dentro de la composición.
      example: Hamburguesa
    quantity:
      type: number
      description: Rango y precisión no definidos en la fuente.
      example: 1
    course:
      type: string
      enum: [entrada, plato fuerte, postre, bebida]
      description: Curso al que pertenece el slot, si se especifica.
      example: plato fuerte
    options:
      type: array
      description: Opciones disponibles para ocupar el slot.
      items:
        $ref: '#/SlotOptionInput'
  example:
    name: Hamburguesa
    quantity: 1
    course: plato fuerte
    options:
      - sourceType: RECIPE
        recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        recipeRevision: 3
        displayName: Hamburguesa hawaiana

Composition:
  type: object
  description: Composición de una oferta, expresada como una colección de slots.
  required: [slots]
  properties:
    slots:
      type: array
      description: Slots que forman la composición de la oferta.
      items:
        $ref: '#/CompositionSlot'
  example:
    slots:
      - slotId: c3d4e5f6-789a-4bcd-8ef0-123456789abc
        name: Hamburguesa
        quantity: 1
        course: plato fuerte
        options:
          - optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
            sourceType: RECIPE
            recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
            recipeRevision: 3
            displayName: Hamburguesa hawaiana

CompositionInput:
  type: object
  description: Datos de la composición inicial enviados al crear una oferta.
  additionalProperties: false
  required: [slots]
  properties:
    slots:
      type: array
      description: Slots que forman la composición enviada.
      items:
        $ref: '#/CompositionSlotInput'

CatalogOfferSummary:
  type: object
  description: Campos que resumen una oferta del catálogo, su entrada asociada y su composición.
  required: [id, entryId, entryName, presentationTag, basePrice, status, image, slotCount]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la oferta.
      example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    entryId:
      type: string
      format: uuid
      description: Identificador UUID de la entrada a la que pertenece la oferta.
      example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    entryName:
      type: string
      description: Nombre comercial de la entrada asociada.
      example: Hamburguesa Hawaiana
    presentationTag:
      type: string
      description: Etiqueta obligatoria que distingue esta presentación de la entrada; no admite null.
      example: Combo
    basePrice:
      type: number
      description: Precio base de la oferta.
      example: 180.0
    status:
      $ref: '#/OfferStatus'
    image:
      $ref: 'Common.yaml#/Image'
    slotCount:
      type: integer
      minimum: 0
      description: Cantidad de slots que contiene la composición.
      example: 2
  example:
    id: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    entryId: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    entryName: Hamburguesa Hawaiana
    presentationTag: Combo
    basePrice: 180.0
    status: ACTIVE
    image:
      id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
      url: https://cdn.example.com/menu/burger.jpg
      thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    slotCount: 2

CatalogOfferDetail:
  type: object
  description: Datos completos de una oferta, incluidos los slots y las opciones de su composición.
  required: [id, entryId, presentationTag, basePrice, status, image, composition]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la oferta.
      example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    entryId:
      type: string
      format: uuid
      description: Identificador UUID de la entrada a la que pertenece la oferta.
      example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    presentationTag:
      type: string
      description: Etiqueta obligatoria que distingue esta presentación de la entrada; no admite null.
      example: Combo
    basePrice:
      type: number
      description: Precio base de la oferta.
      example: 180.0
    status:
      $ref: '#/OfferStatus'
    image:
      $ref: 'Common.yaml#/Image'
    composition:
      $ref: '#/Composition'
  example:
    id: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    entryId: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    presentationTag: Combo
    basePrice: 180.0
    status: ACTIVE
    image:
      id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
      url: https://cdn.example.com/menu/burger.jpg
      thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    composition:
      slots:
        - slotId: c3d4e5f6-789a-4bcd-8ef0-123456789abc
          name: Hamburguesa
          quantity: 1
          course: plato fuerte
          options:
            - optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
              sourceType: RECIPE
              recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
              recipeRevision: 3
              displayName: Hamburguesa hawaiana

CatalogOfferCreateRequest:
  type: object
  description: >-
    Datos JSON para crear una oferta y definir su composición inicial. La imagen
    se carga previamente mediante POST /api/v1/media/images y esta solicitud
    asocia su identificador; la carga y la asociación son operaciones separadas.
    No se envían archivos ni URLs en esta solicitud. Los UUID de los slots y las
    opciones los genera el servidor; no deben incluirse en este cuerpo. El
    servidor asigna INACTIVE al crear la oferta y status ACTIVE a cada opción
    nueva; status de las opciones no se envía en esta solicitud. La activación
    manual de la oferta se realiza después mediante una actualización.
  additionalProperties: false
  required: [presentationTag, basePrice, composition, imageId]
  properties:
    presentationTag:
      type: string
      description: Etiqueta obligatoria que distingue esta presentación de la entrada; no admite null.
      example: Combo
    basePrice:
      type: number
      description: Precio base de la oferta.
      example: 180.0
    imageId:
      type: string
      format: uuid
      description: >-
        UUID obligatorio de la imagen previamente cargada y validada, obtenido
        de data.id en POST /api/v1/media/images. Debe identificar una imagen
        existente y accesible al solicitante; no admite null, archivos ni URLs.
      example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
    composition:
      $ref: '#/CompositionInput'
  example:
    presentationTag: Combo
    basePrice: 180.0
    imageId: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
    composition:
      slots:
        - name: Hamburguesa
          quantity: 1
          course: plato fuerte
          options:
            - sourceType: RECIPE
              recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
              recipeRevision: 3
              displayName: Hamburguesa hawaiana

CatalogOfferPatchRequest:
  type: object
  description: >-
    Campos de una oferta que se desean actualizar mediante JSON. La imagen de
    reemplazo se carga previamente mediante POST /api/v1/media/images; esta
    solicitud actualiza su asociación con imageId. La carga y la asociación son
    operaciones separadas. No se envían archivos ni URLs en esta solicitud.
    presentationTag es obligatorio en toda solicitud; si no se desea cambiar,
    se reenvía su valor vigente. Los demás campos omitidos se conservan
    recursivamente; composition vacío conserva sus slots. Enviar slots u options
    reemplaza su conjunto completo; los elementos existentes incluidos pueden
    omitir campos para conservarlos y las opciones omitidas de un slot existente
    se conservan. Las listas vacías devuelven 422. Los identificadores existentes
    deben pertenecer a la oferta y al slot correspondiente: desconocidos, ajenos
    o duplicados se rechazan con 422; no se mueven elementos ni se crean con ID
    proporcionado. Los nuevos elementos omiten su ID y el servidor lo genera.
    Se valida el resultado completo y las invariantes antes de persistir;
    cualquier error rechaza toda la operación. Se recalculan los estados de
    slots y oferta según las opciones y su habilitación administrativa. If-Match
    protege la actualización de modificaciones concurrentes.
  additionalProperties: false
  required: [presentationTag]
  properties:
    presentationTag:
      type: string
      description: Etiqueta obligatoria de presentación; reenviar el valor vigente si no se desea cambiar. No admite null.
      example: Combo familiar
    basePrice:
      type: number
      description: Nuevo precio base, si se desea cambiar.
      example: 195.0
    status:
      $ref: '#/OfferStatus'
      description: >-
        Estado administrativo solicitado. Activar exige una composición válida
        con al menos un slot ACTIVE. Una solicitud INACTIVE explícita prevalece
        sobre la reactivación automática.
    imageId:
      type: string
      format: uuid
      description: >-
        UUID opcional de la imagen de reemplazo previamente cargada y validada,
        obtenido de data.id en POST /api/v1/media/images. Debe identificar una
        imagen existente y accesible al solicitante. Omitirlo conserva la imagen
        vigente; no admite null, archivos ni URLs.
      example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
    composition:
      $ref: '#/CompositionPatchInput'

CompositionPatchInput:
  type: object
  additionalProperties: false
  description: Composición enviada al PATCH; omitir slots o enviar un objeto vacío conserva los slots vigentes. Enviar slots reemplaza el conjunto completo y no admite una lista vacía.
  properties:
    slots:
      type: array
      minItems: 1
      items:
        $ref: '#/CompositionSlotPatchInput'

CompositionSlotPatchInput:
  type: object
  additionalProperties: false
  description: >-
    Con slotId actualiza un slot existente de esta oferta y conserva los campos omitidos. Sin slotId
    crea un slot y requiere name, quantity y options; el servidor genera su ID. options reemplaza el
    conjunto completo al enviarse; omitirlo en un slot existente conserva sus opciones. IDs
    desconocidos, ajenos o duplicados se rechazan con 422; no permite mover slots ni crear nuevos
    con ID. course null retira el curso opcional.
  properties:
    slotId:
      type: string
      format: uuid
    name:
      type: string
    quantity:
      type: number
      description: Rango y precisión pendientes en OPEN-006.
    course:
      type:
        - string
        - 'null'
      enum:
        - entrada
        - plato fuerte
        - postre
        - bebida
        - null
    options:
      type: array
      minItems: 1
      items:
        $ref: '#/SlotOptionPatchInput'
  allOf:
    - if:
        not:
          properties:
            slotId: {}
            name: {}
            quantity: {}
            course: {}
            options: {}
          required:
            - slotId
      then:
        properties:
          name: {}
          quantity: {}
          options: {}
          slotId: {}
          course: {}
        required:
          - name
          - quantity
          - options

RecipeSlotOptionPatchInput:
  type: object
  description: Datos para actualizar o crear una opción basada en una receta.
  additionalProperties: false
  required: [sourceType]
  properties:
    sourceType:
      const: RECIPE
      description: Tipo de origen de esta opción.
    optionId:
      type: string
      format: uuid
      description: Identificador de una opción existente; se omite para crearla.
    displayName:
      type: string
      description: Nombre que se muestra para esta opción.
    status:
      $ref: '#/OfferStatus'
    recipeId:
      type: string
      format: uuid
    recipeRevision:
      type: integer
      minimum: 1
  dependentRequired:
    recipeId:
      - recipeRevision
  allOf:
    - if:
        not:
          required: [optionId]
      then:
        required: [displayName, status, recipeId, recipeRevision]

InventoryItemSlotOptionPatchInput:
  type: object
  description: Datos para actualizar o crear una opción basada en un insumo de inventario.
  additionalProperties: false
  required: [sourceType]
  properties:
    sourceType:
      const: INVENTORY_ITEM
      description: Tipo de origen de esta opción.
    optionId:
      type: string
      format: uuid
      description: Identificador de una opción existente; se omite para crearla.
    displayName:
      type: string
      description: Nombre que se muestra para esta opción.
    status:
      $ref: '#/OfferStatus'
    inventoryItemId:
      type: string
      format: uuid
    quantity:
      type: number
      exclusiveMinimum: 0
    unit:
      type: string
      minLength: 1
  allOf:
    - if:
        not:
          required: [optionId]
      then:
        required: [displayName, status, inventoryItemId, quantity, unit]

SlotOptionPatchInput:
  description: >-
    Con optionId actualiza una opción existente del slot y conserva los campos omitidos; sourceType
    debe coincidir con el tipo almacenado para que los cambios parciales sean válidos. Sin optionId
    crea una opción nueva; debe incluir displayName, status y la tupla completa del origen indicado.
    El servidor genera el ID. IDs desconocidos, ajenos o duplicados se rechazan con 422; no se pueden
    mover opciones ni crear nuevas con ID. Para cambiar el tipo de una opción existente, se debe
    enviar sourceType y la tupla completa del nuevo origen; el servidor aplica el cambio atómicamente.
  oneOf:
    - $ref: '#/RecipeSlotOptionPatchInput'
    - $ref: '#/InventoryItemSlotOptionPatchInput'

CatalogOfferListResponse:
  type: object
  description: Página de ofertas que coincide con los filtros de la consulta.
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/CatalogOfferSummary'
    meta:
      $ref: 'Common.yaml#/PageMeta'

CatalogOfferResponse:
  type: object
  description: Respuesta que contiene una oferta del catálogo.
  required: [data]
  properties:
    data:
      $ref: '#/CatalogOfferDetail'

CatalogOfferPatchRecipeSlotOption:
  allOf:
    - $ref: '#/RecipeSlotOption'
    - type: object
      description: >-
        En la respuesta del PATCH siempre se incluyen el estado de la opción y la revisión fijada
        de la receta.
      required: [status, recipeRevision]
      properties:
        status:
          $ref: '#/OfferStatus'
        recipeRevision:
          type: integer
          minimum: 1

CatalogOfferPatchInventoryItemSlotOption:
  allOf:
    - $ref: '#/InventoryItemSlotOption'
    - type: object
      description: >-
        En la respuesta del PATCH siempre se incluyen el estado de la opción, la cantidad y la
        unidad del insumo.
      required: [status, quantity, unit]
      properties:
        status:
          $ref: '#/OfferStatus'
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          minLength: 1

CatalogOfferPatchSlotOption:
  description: Opción de slot devuelta por PATCH con los campos obligatorios de su tipo de origen.
  oneOf:
    - $ref: '#/CatalogOfferPatchRecipeSlotOption'
    - $ref: '#/CatalogOfferPatchInventoryItemSlotOption'

CatalogOfferPatchCompositionSlot:
  allOf:
    - $ref: '#/CompositionSlot'
    - type: object
      description: La respuesta del PATCH siempre incluye el estado derivado del slot.
      required: [status]
      properties:
        status:
          $ref: '#/OfferStatus'
        options:
          type: array
          items:
            $ref: '#/CatalogOfferPatchSlotOption'

CatalogOfferPatchComposition:
  allOf:
    - $ref: '#/Composition'
    - type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/CatalogOfferPatchCompositionSlot'

CatalogOfferPatchDetail:
  allOf:
    - $ref: '#/CatalogOfferDetail'
    - type: object
      description: >-
        Detalle devuelto por PATCH. Los estados derivados y los datos de origen específicos de cada
        opción están presentes en todos los slots y opciones.
      properties:
        composition:
          $ref: '#/CatalogOfferPatchComposition'

CatalogOfferPatchResponse:
  type: object
  description: Respuesta del PATCH de una oferta con los estados y datos de origen completos.
  required: [data]
  properties:
    data:
      $ref: '#/CatalogOfferPatchDetail'
