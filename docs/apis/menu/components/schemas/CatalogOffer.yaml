CatalogOfferListResponse:
  type: object
  description: Página de ofertas que coincide con los filtros de la consulta.
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/CatalogOfferSummary'
    meta:
      $ref: 'Common.yaml#/PageMeta'

CatalogOfferResponse:
  type: object
  description: Respuesta que contiene una oferta del catálogo.
  required: [data]
  properties:
    data:
      $ref: '#/CatalogOfferDetail'

CatalogOfferPatchRecipeSlotOption:
  allOf:
    - $ref: '#/RecipeSlotOption'
    - type: object
      description: >-
        En la respuesta del PATCH siempre se incluyen el estado de la opción y la revisión fijada
        de la receta.
      required: [status, recipeRevision]
      properties:
        status:
          $ref: '#/OfferStatus'
        recipeRevision:
          type: integer
          minimum: 1

CatalogOfferPatchInventoryItemSlotOption:
  allOf:
    - $ref: '#/InventoryItemSlotOption'
    - type: object
      description: >-
        En la respuesta del PATCH siempre se incluyen el estado de la opción, la cantidad y la
        unidad del insumo.
      required: [status, quantity, unit]
      properties:
        status:
          $ref: '#/OfferStatus'
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          minLength: 1

CatalogOfferPatchSlotOption:
  description: Opción de slot devuelta por PATCH con los campos obligatorios de su tipo de origen.
  oneOf:
    - $ref: '#/CatalogOfferPatchRecipeSlotOption'
    - $ref: '#/CatalogOfferPatchInventoryItemSlotOption'

CatalogOfferPatchCompositionSlot:
  allOf:
    - $ref: '#/CompositionSlot'
    - type: object
      description: La respuesta del PATCH siempre incluye el estado derivado del slot.
      required: [status]
      properties:
        status:
          $ref: '#/OfferStatus'
        options:
          type: array
          items:
            $ref: '#/CatalogOfferPatchSlotOption'

CatalogOfferPatchComposition:
  allOf:
    - $ref: '#/Composition'
    - type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/CatalogOfferPatchCompositionSlot'

CatalogOfferPatchDetail:
  allOf:
    - $ref: '#/CatalogOfferDetail'
    - type: object
      description: >-
        Detalle devuelto por PATCH. Los estados derivados y los datos de origen específicos de cada
        opción están presentes en todos los slots y opciones.
      properties:
        composition:
          $ref: '#/CatalogOfferPatchComposition'

CatalogOfferPatchResponse:
  type: object
  description: Respuesta del PATCH de una oferta con los estados y datos de origen completos.
  required: [data]
  properties:
    data:
      $ref: '#/CatalogOfferPatchDetail'
