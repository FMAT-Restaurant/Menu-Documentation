OfferStatus:
  type: string
  description: Estado administrativo de una oferta o de una opción; solo lo cambia el administrador y no expresa disponibilidad (véase isAvailable).
  enum: [ACTIVE, INACTIVE]
  example: ACTIVE

RecipeSlotOption:
  type: object
  description: Opción cuyo origen es una receta, identificada solo por recipeId; usa siempre la revisión vigente de la receta.
  additionalProperties: false
  required: [optionId, sourceType, recipeId, displayName, status, isAvailable]
  properties:
    optionId:
      type: string
      format: uuid
      description: Identificador UUID de la opción.
      example: 89cce4da-2f19-4d27-942d-b2ee82fb5401
    sourceType:
      const: RECIPE
      description: Indica que la opción se basa en una receta.
    recipeId:
      type: string
      format: uuid
      description: Identificador UUID de la receta de origen.
      example: c4813f65-00b4-4921-874e-03c555796401
    status:
      $ref: '#/OfferStatus'
      description: Estado administrativo de la opción.
    isAvailable:
      type: boolean
      readOnly: true
      description: Disponibilidad derivada de la opción según el último estado comunicado por Inventario sobre su contenido.
      example: true
    displayName:
      type: string
      description: Nombre que se muestra para esta opción en el catálogo.
      example: Hamburguesa hawaiana
  example:
    optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
    sourceType: RECIPE
    recipeId: c4813f65-00b4-4921-874e-03c555796401
    displayName: Hamburguesa hawaiana
    status: ACTIVE
    isAvailable: true

InventoryItemSlotOption:
  type: object
  description: Opción cuyo origen es un artículo de Inventario con su cantidad.
  additionalProperties: false
  required: [optionId, sourceType, inventoryItemId, quantity, displayName, status, isAvailable]
  properties:
    optionId:
      type: string
      format: uuid
      description: Identificador UUID de la opción.
      example: 89cce4da-2f19-4d27-942d-b2ee82fb5402
    sourceType:
      const: INVENTORY_ITEM
      description: Indica que la opción se basa directamente en un artículo de Inventario.
    inventoryItemId:
      type: string
      description: Identificador opaco del artículo de Inventario de origen como string, sin formato impuesto.
      example: CARNE-150G
    quantity:
      type: number
      exclusiveMinimum: 0
      description: Cantidad positiva expresada en la unidad que Inventario establece para el artículo; la opción no tiene unidad propia. Es distinta del número de rondas del grupo.
      example: 150
    status:
      $ref: '#/OfferStatus'
      description: Estado administrativo de la opción.
    isAvailable:
      type: boolean
      readOnly: true
      description: Disponibilidad derivada de la opción según el último estado comunicado por Inventario sobre su contenido.
      example: true
    displayName:
      type: string
      description: Nombre que se muestra para esta opción en el catálogo.
      example: Carne Molida Res 80/20
  example:
    optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
    sourceType: INVENTORY_ITEM
    inventoryItemId: CARNE-150G
    quantity: 150
    displayName: Carne Molida Res 80/20
    status: ACTIVE
    isAvailable: true

SlotOption:
  description: Opción de un grupo de selección; cada opción identifica una receta o un artículo de Inventario.
  oneOf:
    - $ref: '#/RecipeSlotOption'
    - $ref: '#/InventoryItemSlotOption'

RecipeSlotOptionInput:
  type: object
  description: >-
    Datos de una opción nueva cuyo origen es una receta; el servidor genera
    optionId. status es opcional: si se omite, la opción inicia ACTIVE. Se
    indica solo recipeId; la opción usa siempre la revisión vigente. Una receta
    inexistente devuelve 422.
  additionalProperties: false
  required: [sourceType, recipeId, displayName]
  properties:
    sourceType:
      const: RECIPE
      description: Indica que la opción se basa en una receta.
    recipeId:
      type: string
      format: uuid
      description: Identificador UUID de la receta de origen.
      example: c4813f65-00b4-4921-874e-03c555796401
    displayName:
      type: string
      minLength: 1
      description: >-
        Nombre que se mostrará para esta opción en el menú. Puede diferir del
        nombre de la receta de origen, que se resuelve mediante recipeId.
      example: Hamburguesa hawaiana
    status:
      $ref: '#/OfferStatus'
  example:
    sourceType: RECIPE
    recipeId: c4813f65-00b4-4921-874e-03c555796401
    displayName: Hamburguesa hawaiana

InventoryItemSlotOptionInput:
  type: object
  description: >-
    Datos de una opción nueva cuyo origen es un artículo de Inventario con su
    cantidad; el servidor genera optionId. status es opcional: si se omite, la
    opción inicia ACTIVE.
  additionalProperties: false
  required: [sourceType, inventoryItemId, quantity, displayName]
  properties:
    sourceType:
      const: INVENTORY_ITEM
      description: Indica que la opción se basa directamente en un artículo de Inventario.
    inventoryItemId:
      type: string
      minLength: 1
      description: Identificador opaco del artículo de Inventario de origen como string, sin formato impuesto.
      example: CARNE-150G
    quantity:
      type: number
      exclusiveMinimum: 0
      description: Cantidad positiva expresada en la unidad que Inventario establece para el artículo; la opción no tiene unidad propia. Es distinta del número de rondas del grupo.
      example: 150
    displayName:
      type: string
      minLength: 1
      description: >-
        Nombre que se mostrará para esta opción en el menú. Puede diferir del
        nombre del artículo de Inventario de origen, que se resuelve mediante
        inventoryItemId.
      example: Carne Molida Res 80/20
    status:
      $ref: '#/OfferStatus'
  example:
    sourceType: INVENTORY_ITEM
    inventoryItemId: CARNE-150G
    quantity: 150
    displayName: Carne Molida Res 80/20

SlotOptionInput:
  description: Datos de una opción de un grupo de selección con uno de los dos tipos de origen admitidos.
  oneOf:
    - $ref: '#/RecipeSlotOptionInput'
    - $ref: '#/InventoryItemSlotOptionInput'

CompositionSlot:
  type: object
  description: Grupo de selección de la composición con su número de rondas, su tiempo de servicio opcional y sus opciones.
  required: [slotId, name, quantity, isAvailable, options]
  properties:
    slotId:
      type: string
      format: uuid
      description: Identificador UUID del grupo de selección.
      example: b37c1bd7-17b2-47a2-a3a4-802559445301
    name:
      type: string
      description: Nombre que identifica el grupo de selección dentro de la composición.
      example: Hamburguesa
    quantity:
      type: number
      description: 'Número de rondas del grupo de selección: en cada ronda se elige una opción. No es una cantidad física; rangos y precisión pendientes en OPEN-006.'
      example: 1
    isAvailable:
      type: boolean
      readOnly: true
      description: true si y solo si al menos una opción ACTIVE del grupo está disponible.
      example: true
    course:
      type: string
      enum: [entrada, plato fuerte, postre, bebida]
      description: Tiempo de servicio al que pertenece el grupo de selección, si se especifica.
      example: plato fuerte
    options:
      type: array
      description: Opciones del grupo en el orden de presentación establecido por el administrador.
      items:
        $ref: '#/SlotOption'
  example:
    slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
    name: Hamburguesa
    quantity: 1
    isAvailable: true
    course: plato fuerte
    options:
      - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
        sourceType: RECIPE
        recipeId: c4813f65-00b4-4921-874e-03c555796401
        displayName: Hamburguesa hawaiana
        status: ACTIVE
        isAvailable: true
      - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
        sourceType: INVENTORY_ITEM
        inventoryItemId: CARNE-150G
        quantity: 150
        displayName: Carne Molida Res 80/20
        status: ACTIVE
        isAvailable: true

CompositionSlotInput:
  type: object
  description: Datos de un grupo de selección nuevo; el servidor genera slotId.
  additionalProperties: false
  required: [name, quantity, options]
  properties:
    name:
      type: string
      minLength: 1
      description: Nombre que identifica el grupo de selección dentro de la composición.
      example: Hamburguesa
    quantity:
      type: number
      description: 'Número de rondas del grupo de selección: en cada ronda se elige una opción. No es una cantidad física; rangos y precisión pendientes en OPEN-006.'
      example: 1
    course:
      type: string
      enum: [entrada, plato fuerte, postre, bebida]
      description: Tiempo de servicio al que pertenece el grupo de selección, si se especifica.
      example: plato fuerte
    options:
      type: array
      minItems: 1
      description: Opciones del grupo en el orden de presentación; no se repite el mismo artículo de Inventario ni la misma receta en el grupo (422 DUPLICATE_OPTION_CONTENT).
      items:
        $ref: '#/SlotOptionInput'
  example:
    name: Hamburguesa
    quantity: 1
    course: plato fuerte
    options:
      - sourceType: RECIPE
        recipeId: c4813f65-00b4-4921-874e-03c555796401
        displayName: Hamburguesa hawaiana

Composition:
  type: object
  description: Composición de una oferta, expresada como una colección de grupos de selección.
  required: [slots]
  properties:
    slots:
      type: array
      description: Grupos de selección en el orden de presentación, que es también el orden de sucesión de sus rondas.
      items:
        $ref: '#/CompositionSlot'
  example:
    slots:
      - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
        name: Hamburguesa
        quantity: 1
        isAvailable: true
        course: plato fuerte
        options:
          - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
            sourceType: RECIPE
            recipeId: c4813f65-00b4-4921-874e-03c555796401
            displayName: Hamburguesa hawaiana
            status: ACTIVE
            isAvailable: true

CompositionInput:
  type: object
  description: Datos de la composición inicial enviados al crear una oferta.
  additionalProperties: false
  required: [slots]
  properties:
    slots:
      type: array
      minItems: 1
      description: Grupos de selección en el orden de presentación, que es también el orden de sucesión de sus rondas.
      items:
        $ref: '#/CompositionSlotInput'

CatalogOfferSummary:
  type: object
  description: Campos que resumen una oferta del catálogo, su entrada asociada y su composición.
  required: [id, entryId, entryName, presentationTag, basePrice, status, isAvailable, image, slotCount]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la oferta.
      example: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
    entryId:
      type: string
      format: uuid
      description: Identificador UUID de la entrada a la que pertenece la oferta.
      example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    entryName:
      type: string
      description: Nombre comercial de la entrada asociada.
      example: Hamburguesa Hawaiana
    presentationTag:
      type: string
      description: Etiqueta obligatoria que distingue esta presentación de la entrada; no admite null.
      example: Individual
    basePrice:
      type: number
      description: Precio base de la oferta.
      example: 180.0
    status:
      $ref: '#/OfferStatus'
      description: Estado administrativo de la oferta.
    isAvailable:
      type: boolean
      readOnly: true
      description: true si y solo si todos sus grupos de selección están disponibles; la oferta es ordenable si además ella y su entrada están ACTIVE y la entrada está disponible.
      example: true
    image:
      $ref: 'Common.yaml#/Image'
    slotCount:
      type: integer
      minimum: 0
      description: Cantidad de grupos de selección que contiene la composición.
      example: 1
  example:
    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
    entryName: Hamburguesa Hawaiana
    presentationTag: Individual
    basePrice: 180.0
    status: ACTIVE
    isAvailable: true
    image:
      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
      url: https://cdn.example.com/menu/burger.jpg
      thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    slotCount: 1

CatalogOfferDetail:
  type: object
  description: Datos completos de una oferta, incluidos los grupos de selección y las opciones de su composición.
  required: [id, entryId, presentationTag, basePrice, status, isAvailable, image, composition]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la oferta.
      example: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
    entryId:
      type: string
      format: uuid
      description: Identificador UUID de la entrada a la que pertenece la oferta.
      example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    presentationTag:
      type: string
      description: Etiqueta obligatoria que distingue esta presentación de la entrada; no admite null.
      example: Individual
    basePrice:
      type: number
      description: Precio base de la oferta.
      example: 180.0
    status:
      $ref: '#/OfferStatus'
      description: Estado administrativo de la oferta.
    isAvailable:
      type: boolean
      readOnly: true
      description: true si y solo si todos sus grupos de selección están disponibles; la oferta es ordenable si además ella y su entrada están ACTIVE y la entrada está disponible.
      example: true
    image:
      $ref: 'Common.yaml#/Image'
    composition:
      $ref: '#/Composition'
  example:
    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
    presentationTag: Individual
    basePrice: 180.0
    status: ACTIVE
    isAvailable: true
    image:
      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
      url: https://cdn.example.com/menu/burger.jpg
      thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    composition:
      slots:
        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
          name: Hamburguesa
          quantity: 1
          isAvailable: true
          course: plato fuerte
          options:
            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
              sourceType: RECIPE
              recipeId: c4813f65-00b4-4921-874e-03c555796401
              displayName: Hamburguesa hawaiana
              status: ACTIVE
              isAvailable: true
            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
              sourceType: INVENTORY_ITEM
              inventoryItemId: CARNE-150G
              quantity: 150
              displayName: Carne Molida Res 80/20
              status: ACTIVE
              isAvailable: true

CatalogOfferCreateRequest:
  type: object
  description: >-
    Datos JSON para crear una oferta con su composición inicial. La imagen se
    carga antes con POST /menu/media/images y aquí se asocia su identificador,
    que no se cambia después. Los grupos y opciones se envían sin identificador.
    La oferta inicia INACTIVE; cada opción nueva admite status y, si lo omite,
    inicia ACTIVE. Para crearla con una copia de otra oferta se envían los
    grupos y opciones del origen sin identificadores y con su status.
  additionalProperties: false
  required: [presentationTag, basePrice, composition, imageId]
  properties:
    presentationTag:
      type: string
      minLength: 1
      description: Etiqueta obligatoria que distingue esta presentación de la entrada; no admite null.
      example: Individual
    basePrice:
      type: number
      description: Precio base de la oferta.
      example: 180.0
    imageId:
      type: string
      format: uuid
      description: >-
        UUID obligatorio de la imagen previamente cargada, obtenido de data.id
        en POST /menu/media/images; una imagen ya asociada devuelve 409
        IMAGE_ALREADY_ASSOCIATED. No admite null, archivos ni URLs.
      example: 8c3f4365-1d1d-4a85-969a-c6c80757b201
    composition:
      $ref: '#/CompositionInput'
  example:
    presentationTag: Individual
    basePrice: 180.0
    imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
    composition:
      slots:
        - name: Hamburguesa
          quantity: 1
          course: plato fuerte
          options:
            - sourceType: RECIPE
              recipeId: c4813f65-00b4-4921-874e-03c555796401
              displayName: Hamburguesa hawaiana
            - sourceType: INVENTORY_ITEM
              inventoryItemId: CARNE-150G
              quantity: 150
              displayName: Carne Molida Res 80/20
              status: INACTIVE

CatalogOfferPatchRequest:
  type: object
  description: >-
    Campos de una oferta que se desean actualizar mediante JSON; todos son
    opcionales y los omitidos se conservan. imageId no se acepta. Enviar
    composition.slots reemplaza la lista completa de grupos (los ausentes se
    eliminan con sus opciones); enviar options en un grupo reemplaza la lista
    completa de opciones de ese grupo (las ausentes se eliminan); omitir slots u
    options conserva la lista vigente. Los elementos existentes se identifican
    por slotId u optionId y conservan los campos omitidos; los nuevos se envían
    sin identificador. Se valida el resultado completo antes de persistir y
    cualquier error rechaza toda la operación. If-Match protege la oferta y su
    composición.
  additionalProperties: false
  properties:
    presentationTag:
      type: string
      minLength: 1
      description: Nueva etiqueta de presentación, si se desea cambiar.
      example: Combo familiar
    basePrice:
      type: number
      description: Nuevo precio base, si se desea cambiar.
      example: 195.0
    status:
      $ref: '#/OfferStatus'
      description: >-
        Estado administrativo solicitado. Activar exige una composición válida,
        que toda oferta mantiene, y no exige disponibilidad; se rechaza con 409
        ENTRY_ARCHIVED si la entrada está archivada. Exige menu:offers:status.
    composition:
      $ref: '#/CompositionPatchInput'

CompositionPatchInput:
  type: object
  additionalProperties: false
  description: Composición enviada al PATCH; omitir slots o enviar un objeto vacío conserva los grupos de selección vigentes. Enviar slots reemplaza la lista completa y no admite una lista vacía.
  properties:
    slots:
      type: array
      minItems: 1
      items:
        $ref: '#/CompositionSlotPatchInput'

CompositionSlotPatchInput:
  type: object
  additionalProperties: false
  description: >-
    Con slotId actualiza un grupo existente de esta oferta y conserva los
    campos omitidos; sin slotId crea un grupo y requiere name, quantity y
    options. options reemplaza la lista completa de opciones del grupo;
    omitirlo en un grupo existente la conserva. Identificadores desconocidos,
    ajenos o duplicados devuelven 422. course null retira el tiempo de
    servicio.
  properties:
    slotId:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    quantity:
      type: number
      description: Número de rondas; rangos y precisión pendientes en OPEN-006.
    course:
      type:
        - string
        - 'null'
      enum:
        - entrada
        - plato fuerte
        - postre
        - bebida
        - null
    options:
      type: array
      minItems: 1
      items:
        $ref: '#/SlotOptionPatchInput'
  allOf:
    - if:
        not:
          properties:
            slotId: {}
            name: {}
            quantity: {}
            course: {}
            options: {}
          required:
            - slotId
      then:
        properties:
          name: {}
          quantity: {}
          options: {}
          slotId: {}
          course: {}
        required:
          - name
          - quantity
          - options

RecipeSlotOptionPatchInput:
  type: object
  description: >-
    Datos para actualizar o crear una opción con receta. Con optionId,
    sourceType debe coincidir con el almacenado (si no, 422
    SOURCE_TYPE_IMMUTABLE) y los campos omitidos se conservan; omitir recipeId
    conserva la receta asignada. Sin optionId crea una opción y requiere
    displayName y recipeId; status es opcional (por omisión ACTIVE). La opción
    usa siempre la revisión vigente de la receta; una receta inexistente
    devuelve 422.
  additionalProperties: false
  required: [sourceType]
  properties:
    sourceType:
      const: RECIPE
      description: Tipo de origen de esta opción.
    optionId:
      type: string
      format: uuid
      description: Identificador de una opción existente; se omite para crearla.
    displayName:
      type: string
      minLength: 1
      description: Nombre que se muestra para esta opción.
    status:
      $ref: '#/OfferStatus'
    recipeId:
      type: string
      format: uuid
  allOf:
    - if:
        not:
          required: [optionId]
      then:
        required: [displayName, recipeId]

InventoryItemSlotOptionPatchInput:
  type: object
  description: >-
    Datos para actualizar o crear una opción con un artículo de Inventario. Con
    optionId, sourceType debe coincidir con el almacenado (422
    SOURCE_TYPE_IMMUTABLE) y los campos omitidos se conservan. Sin optionId
    requiere displayName, inventoryItemId y quantity; status es opcional (por
    omisión ACTIVE).
  additionalProperties: false
  required: [sourceType]
  properties:
    sourceType:
      const: INVENTORY_ITEM
      description: Tipo de origen de esta opción.
    optionId:
      type: string
      format: uuid
      description: Identificador de una opción existente; se omite para crearla.
    displayName:
      type: string
      minLength: 1
      description: Nombre que se muestra para esta opción.
    status:
      $ref: '#/OfferStatus'
    inventoryItemId:
      type: string
      description: Identificador opaco del artículo de Inventario como string, sin formato impuesto.
      example: CARNE-150G
    quantity:
      type: number
      exclusiveMinimum: 0
      description: Cantidad positiva expresada en la unidad que Inventario establece para el artículo; la opción no tiene unidad propia. Es distinta del número de rondas del grupo.
  allOf:
    - if:
        not:
          required: [optionId]
      then:
        required: [displayName, inventoryItemId, quantity]

SlotOptionPatchInput:
  description: >-
    Con optionId actualiza una opción existente del grupo; sin optionId crea
    una opción nueva y el servidor genera su identificador. El tipo de
    contenido de una opción no cambia: un sourceType distinto del almacenado
    devuelve 422 SOURCE_TYPE_IMMUTABLE; para usar el otro tipo se crea una
    opción nueva. Identificadores desconocidos, ajenos o duplicados devuelven
    422. Incluir status en una opción existente es un cambio de estado y exige
    menu:offers:status; el status de una opción nueva forma parte de su alta.
  oneOf:
    - $ref: '#/RecipeSlotOptionPatchInput'
    - $ref: '#/InventoryItemSlotOptionPatchInput'

CatalogOfferListResponse:
  type: object
  description: Página de ofertas que coincide con los filtros de la consulta.
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/CatalogOfferSummary'
    meta:
      $ref: 'Common.yaml#/PageMeta'

CatalogOfferResponse:
  type: object
  description: Respuesta que contiene una oferta del catálogo.
  required: [data]
  properties:
    data:
      $ref: '#/CatalogOfferDetail'
