Category:
  type: object
  description: Categoría comercial que permite clasificar las entradas del catálogo.
  required: [id, name, entryCount]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la categoría.
      example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
    name:
      type: string
      minLength: 1
      description: Nombre que se muestra para la categoría.
      example: Bebidas
    description:
      type: string
      description: Explicación breve opcional; si no existe, se omite de la respuesta.
      example: Bebidas frías y preparadas.
    entryCount:
      type: integer
      minimum: 0
      description: Número total de entradas que clasifica la categoría, en cualquier estado administrativo (ACTIVE, INACTIVE o ARCHIVED). Para el conteo visible a quien consulta, ver GET /menu/catalog/categories.
      example: 4
  example:
    id: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
    name: Bebidas
    description: Bebidas frías y preparadas.
    entryCount: 4

CategoryReference:
  type: object
  description: Referencia resumida a una categoría asociada con una entrada.
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
      description: Identificador UUID de la categoría.
      example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
    name:
      type: string
      description: Nombre de la categoría.
      example: Bebidas

CategoryCreateRequest:
  type: object
  description: Datos para crear una categoría.
  required: [name]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      pattern: '\S'
      description: Nombre de la nueva categoría, no vacío y único en el menú; la unicidad se compara sin distinguir mayúsculas de minúsculas ni acentos y sin los espacios del inicio y del final (409 CATEGORY_NAME_TAKEN).
      example: Bebidas
    description:
      type: string
      description: Explicación breve opcional del contenido de la categoría.
      example: Bebidas frías y preparadas.

CategoryPatchRequest:
  type: object
  description: Campos de categoría que se desean actualizar.
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      pattern: '\S'
      description: Nuevo nombre, no vacío y único en el menú con la misma comparación que al crear (409 CATEGORY_NAME_TAKEN).
      example: Bebidas preparadas
    description:
      type: string
      description: Campo opcional; si se omite, se conserva el valor actual. Una cadena vacía permite dejar la categoría sin texto descriptivo.
      example: Bebidas frías y preparadas al momento.

CategoryListResponse:
  type: object
  description: Colección paginada de categorías.
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/Category'
    meta:
      $ref: 'Common.yaml#/PageMeta'

CategoryResponse:
  type: object
  description: Respuesta que contiene una categoría.
  required: [data]
  properties:
    data:
      $ref: '#/Category'
