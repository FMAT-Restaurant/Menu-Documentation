Page:
  name: page
  in: query
  required: false
  description: Página solicitada de la colección, numerada desde 1.
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 2

PageSize:
  name: pageSize
  in: query
  required: false
  description: Número positivo de elementos solicitado por página. Acepta cualquier entero desde 1; si se omite, se usa 12.
  schema:
    type: integer
    minimum: 1
    default: 12
    example: 20

SearchQuery:
  name: q
  in: query
  required: false
  description: Texto opcional para buscar coincidencias según los campos descritos por la operación.
  schema:
    type: string
    example: hamburguesa

CategoryFilter:
  name: categoryId
  in: query
  required: false
  description: UUID de categoría o el token reservado para entradas sin categoría.
  example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
  schema:
    anyOf:
      - type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
      - type: string
        const: __uncategorized__

EntryIdQuery:
  name: entryId
  in: query
  required: false
  description: Identificador UUID de la entrada cuyas ofertas se consultan.
  schema:
    type: string
    format: uuid
    example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23

ExcludeOfferId:
  name: excludeOfferId
  in: query
  required: false
  description: Identificador UUID de la oferta que se excluye de los resultados.
  schema:
    type: string
    format: uuid
    example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f

EntryStatusQuery:
  name: status
  in: query
  required: false
  description: Estado por el que se filtran las entradas.
  schema:
    $ref: './schemas/CatalogEntry.yaml#/EntryStatus'

IfMatch:
  name: If-Match
  in: header
  required: true
  description: >-
    ETag fuerte de la versión vigente del recurso leída por el cliente; se envía
    para una actualización condicional con comparación fuerte. En PATCH
    /menu/offers/{offerId}, un reintento idempotente conserva el If-Match original:
    si coincide con una solicitud exitosa vigente, se recupera su respuesta antes
    de reevaluar ese ETag, aunque ya sea obsoleto. Una ejecución nueva valida el
    ETag contra la versión vigente normalmente.
  schema:
    type: string
    example: '"rev-3"'

IfNoneMatch:
  name: If-None-Match
  in: header
  required: false
  description: ETag previamente recibido que se compara durante una consulta condicional.
  schema:
    type: string
    example: W/"rev-3"

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: >-
    UUID generado por el cliente para una operación lógica; se envía sin comillas.
    Es obligatorio en POST /menu/categories, POST /menu/entries,
    POST /menu/entries/{entryId}/offers, POST /menu/recipes, POST /media/images y
    PATCH /menu/offers/{offerId}. Su ausencia o un formato inválido devuelve 400.
    Los reintentos deben conservar la clave y los datos originales. Para JSON,
    la comparación ignora espacios y el orden de las propiedades de objetos;
    conserva el orden de los arrays y distingue un campo omitido de null.
    En PATCH de ofertas también se compara el If-Match original; el cliente
    conserva ambos encabezados y el cuerpo, y una respuesta exitosa vigente se
    recupera antes de reevaluar el ETag. En la carga multipart de imágenes se
    comparan los bytes exactos del archivo y el tipo de medio declarado de la
    parte file; se ignoran el boundary, el orden de las partes y el nombre de
    archivo. La clave se delimita por el sujeto autenticado, el menú provisionado,
    el método HTTP y la ruta concreta, incluidos entryId u offerId cuando apliquen.
    El resultado exitoso se conserva durante 24 horas desde la confirmación
    inicial; los reintentos no extienden ese plazo. Una clave expirada se trata
    como nueva y puede crear otro recurso o volver a aplicar una actualización;
    no debe reutilizarse.
  schema:
    type: string
    format: uuid
    pattern: '^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
    example: 83f34a6a-5611-41dd-b437-a9cb96d932c2
