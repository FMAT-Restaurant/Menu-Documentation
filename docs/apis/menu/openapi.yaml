  /menu/categories/{categoryId}:
    $ref: ./paths/categories.yaml#/categoryById
  /menu/entries:
    $ref: ./paths/entries.yaml#/entries
  /menu/entries/{entryId}:
    $ref: ./paths/entries.yaml#/entryById
  /menu/offers:
    $ref: ./paths/offers.yaml#/offers
  /menu/entries/{entryId}/offers:
    $ref: ./paths/offers.yaml#/entryOffers
  /menu/offers/{offerId}:
    $ref: ./paths/offers.yaml#/offerById
  /menu/recipes:
    $ref: ./paths/recipes.yaml#/recipes
  /menu/recipes/{recipeId}:
    $ref: ./paths/recipes.yaml#/recipeById
  /menu/recipes/{recipeId}/revisions:
    $ref: ./paths/recipes.yaml#/recipeRevisions
  /menu/recipes/{recipeId}/revisions/{revision}:
    $ref: ./paths/recipes.yaml#/recipeRevisionByNumber
  /items:
    $ref: ./paths/inventory.yaml#/inventoryItems
  /items/{id}:
    $ref: ./paths/inventory.yaml#/inventoryItemById
  /menu/media/images:
    $ref: ./paths/images.yaml#/images
  /menu/media/images/{imageId}:
    $ref: ./paths/images.yaml#/imageById
