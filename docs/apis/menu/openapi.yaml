openapi: 3.1.0
info:
  title: API de Menu y referencia externa de Inventario
  version: 8.0.0
  description: >-
    Contrato HTTP del servicio Menu, alineado con la ERS 3.2.0, con referencias a las
    consultas externas de Inventario. Las operaciones de Menu se organizan por recurso
    bajo el prefijo /menu y sus rutas son relativas a una URL base que termina en /api/v1;
    el contrato no define el host de despliegue. El frontend llama directamente al
    microservicio de Inventario para /items y /items/{id}; el backend de Menu no implementa
    esas rutas. InventoryItem.id e inventoryItemId son strings opacos sin formato impuesto.


    Permisos. La credencial Bearer es un JWT emitido por un servicio externo que incluye la
    lista permissions con valores de formato modulo:recurso:accion. Cada operación declara
    en x-required-permission los permisos que exige; sin el permiso requerido se responde 403
    sin aplicar cambios. En PATCH /menu/entries/{entryId} y PATCH /menu/offers/{offerId} la
    lista contiene el permiso de gestión y el de estado: un cuerpo sin cambios de estado exige
    el de gestión, uno con solo cambios de estado exige el de estado y uno que los mezcla
    exige ambos. Menu no autentica a quien solicita ni asigna permisos.


    Estado y disponibilidad. status es el estado administrativo y solo lo cambia el
    administrador: ACTIVE, INACTIVE o ARCHIVED en entradas, y ACTIVE o INACTIVE en ofertas y
    opciones; los grupos de selección no tienen estado. isAvailable es la disponibilidad
    derivada, de solo lectura, que el servidor recalcula en entradas, ofertas, grupos de
    selección y opciones a partir de los eventos de Inventario y de la composición. Una oferta
    es ordenable si ella y su entrada están ACTIVE y ambas tienen isAvailable true. Ningún
    cambio de disponibilidad modifica status. Las entradas y las ofertas nuevas inician
    INACTIVE.


    Imágenes. Se cargan antes con POST /menu/media/images (multipart/form-data) y se asocian
    con imageId, obligatorio al crear entradas y ofertas. imageId es inmutable: los PATCH no
    lo aceptan y la imagen se cambia reemplazando su archivo con PUT
    /menu/media/images/{imageId}, que conserva el identificador. Una imagen pertenece a un
    solo recurso; asociar una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED.


    Composición. Una opción RECIPE se indica solo con recipeId y usa siempre la revisión
    vigente de la receta. La cantidad de una opción INVENTORY_ITEM y la de una línea de
    ingrediente se expresan en la unidad que Inventario establece para el artículo, sin unidad
    propia; quantity de un grupo de selección es su número de rondas. Una opción nueva puede
    indicar status y, si lo omite, inicia ACTIVE. La copia de composición no tiene operación
    propia: el cliente consulta la oferta origen y envía sus grupos y opciones sin
    identificadores, con su status, en el POST de la oferta nueva o en el PATCH de la oferta
    destino; las opciones copiadas conservan así su estado. Un solo ETag de la oferta protege
    la oferta y su composición.


    Concurrencia y eliminación. Hay DELETE en categorías, entradas, ofertas y recetas, con las
    condiciones de cada operación. Toda modificación, cambio de estado, eliminación o
    reemplazo del archivo de una imagen exige If-Match con el ETag fuerte vigente: su
    ausencia devuelve 428 y un ETag obsoleto devuelve 412, sin cambios. Las respuestas 204 no
    incluyen cuerpo ni ETag.


    Idempotencia. Los POST de categorías, entradas, ofertas para una entrada, recetas e
    imágenes (POST /menu/media/images) y PATCH /menu/offers/{offerId} requieren
    Idempotency-Key. Durante 24 horas desde la primera confirmación exitosa, la misma clave
    y solicitud recuperan el estado HTTP original (201 en creaciones y 200 en PATCH), el
    cuerpo y el ETag, sin repetir efectos, generar otros identificadores ni asociar otra
    imagen. La carga de imagen compara los bytes del archivo y el tipo de medio declarado de
    la parte file, ignorando boundary, nombre de archivo y orden de partes. El PATCH conserva
    también el If-Match original: tras autenticar y autorizar, un reintento coincidente
    recupera su respuesta antes de validar otra vez el ETag vigente. Una clave ausente o
    inválida devuelve 400; datos diferentes, incluido If-Match en PATCH, devuelven 409
    IDEMPOTENCY_KEY_REUSED; una operación en curso o con resultado incierto devuelve 409
    IDEMPOTENCY_IN_PROGRESS con Retry-After.


    Errores. Los rechazos por reglas de dominio incluyen error.code en 409 y
    error.details.violations[].code en 422, con los valores de DomainErrorCode. Si Menu no
    puede consultar Inventario para validar artículos o para leer los datos de artículo de
    una receta, devuelve 502 sin aplicar cambios.


    Eventos. Los eventos entre Menu e Inventario no forman parte de este contrato HTTP; su
    contrato queda pendiente en OPEN-011 de la ERS.
  license:
    name: MIT
    url: https://github.com/FMAT-Restaurant/Menu-Documentation/blob/main/LICENSE
  contact:
    name: FMAT Restaurant
servers:
  - url: /api/v1
    description: >-
      Prefijo de ruta relativo. El despliegue debe proporcionar el host para
      formar la URL base completa, que termina en /api/v1.
security:
  - bearerAuth: []
tags:
  - name: Catálogo
    description: >-
      Consulta del catálogo visible para quien consulta y generación de la
      carta imprimible en PDF.
  - name: Categorías
    description: Administración y consulta administrativa de categorías del menú.
  - name: Entradas
    description: Administración y consulta administrativa de entradas del catálogo.
  - name: Ofertas
    description: Administración y consulta administrativa de ofertas y su composición.
  - name: Recetas
    description: >-
      Administración y consulta de la biblioteca de recetas y de su historial
      de revisiones.
  - name: Imágenes
    description: Carga de imágenes de entradas y ofertas y reemplazo de su archivo.
  - name: Inventario
    description: >-
      Referencia al servicio externo de Inventario; el frontend consulta allí
      los artículos de Inventario usados en opciones y recetas, no en el
      backend de Menu.
