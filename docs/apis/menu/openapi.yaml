openapi: 3.1.0
info:
  title: API de Menu y referencia externa de Inventario
  version: 6.0.0
  description: >-
    Contrato HTTP de las operaciones de consulta y administración de Menu,
    con referencias a las consultas externas de Inventario para facilitar el
    trabajo del frontend. El frontend llama directamente al microservicio de
    Inventario; el backend de Menu no implementa ni atiende /inventory/items
    ni /inventory/item/{id}.
    InventoryItem.id e inventoryItemId son strings opacos sin formato impuesto.
    Las operaciones de Menu se organizan por recurso y no definen el host de
    despliegue; sus rutas son relativas a una URL base que termina en /api/v1.
    Las imágenes se cargan previamente mediante
    POST /media/images, que recibe multipart/form-data y devuelve data.id con
    un identificador generado por el servidor. Los POST y PATCH de entradas y
    ofertas reciben JSON con imageId: obligatorio al crear y opcional al editar;
    omitirlo conserva la imagen vigente. Solo la carga de imágenes recibe el
    archivo mediante multipart/form-data. Las entradas nuevas inician INACTIVE,
    con estado asignado por el servidor.
    Los POST de entradas y ofertas requieren Idempotency-Key; durante 24 horas
    sus reintentos con la misma clave y datos recuperan el 201, el cuerpo y el
    ETag originales, sin repetir la creación ni la asociación de imagen.
    Las ofertas nuevas también inician INACTIVE y deben activarse manualmente.
    El servidor asigna status: ACTIVE a todas las opciones nuevas de POST;
    la solicitud no acepta status para ellas. presentationTag es requerido en
    POST y PATCH de ofertas y en sus respuestas.
    Para un origen RECIPE solo se indica recipeId: al asignarlo, el servidor
    selecciona la revisión válida más reciente y conserva internamente la
    referencia histórica; las opciones no exponen recipeRevision.
    El PATCH de ofertas conserva los demás campos omitidos y reemplaza recursivamente
    los conjuntos de slots y opciones enviados. Valida el resultado completo y
    persiste atómicamente, con un ETag fuerte vigente en If-Match.
    Los DELETE de entradas y ofertas devuelven 409 si incumplen las reglas de
    eliminación del dominio, 428 si falta If-Match y 412 si el ETag es obsoleto.
    Su respuesta 204 no contiene cuerpo ni ETag porque el recurso eliminado
    ya no tiene una representación vigente. Si falla la consulta a Inventario
    necesaria para validar insumos en POST o PATCH de ofertas o recetas, se
    devuelve 502 sin aplicar cambios.
  license:
    name: MIT
    url: https://github.com/FMAT-Restaurant/Menu-Documentation/blob/main/LICENSE
  contact:
    name: FMAT Restaurant
servers:
  - url: /api/v1
    description: >-
      Prefijo de ruta relativo. El despliegue debe proporcionar el host para
      formar la URL base completa, que termina en /api/v1.
security:
  - bearerAuth: []
tags:
  - name: Categorías
    description: Administración y consulta de categorías del menú.
  - name: Entradas
    description: Administración y consulta de entradas del catálogo.
  - name: Ofertas
    description: Administración de ofertas y sus composiciones.
  - name: Recetas
    description: Administración y consulta de recetas.
  - name: Inventario
    description: >-
      Referencia al servicio externo de Inventario; el frontend consulta allí
      los artículos usados como fuentes de composición, no en el backend Menu.
  - name: Imágenes
    description: Carga de imágenes utilizadas por entradas y ofertas.
paths:
  /menu/categories:
    $ref: ./paths/categories.yaml#/categories
  /menu/categories/{categoryId}:
    $ref: ./paths/categories.yaml#/categoryById
  /menu/entries:
    $ref: ./paths/entries.yaml#/entries
  /menu/entries/{entryId}:
    $ref: ./paths/entries.yaml#/entryById
  /menu/offers:
    $ref: ./paths/offers.yaml#/offers
  /menu/entries/{entryId}/offers:
    $ref: ./paths/offers.yaml#/entryOffers
  /menu/offers/{offerId}:
    $ref: ./paths/offers.yaml#/offerById
  /menu/recipes:
    $ref: ./paths/recipes.yaml#/recipes
  /menu/recipes/{recipeId}:
    $ref: ./paths/recipes.yaml#/recipeById
  /inventory/items:
    $ref: ./paths/inventory.yaml#/inventoryItems
  /inventory/item/{id}:
    $ref: ./paths/inventory.yaml#/inventoryItemById
  /media/images:
    $ref: ./paths/images.yaml#/images
