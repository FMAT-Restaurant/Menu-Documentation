asyncapi: 3.1.0
info:
  title: Eventos de Menu con Inventario
  version: 1.0.0
  description: |-
    Contrato de eventos asíncronos entre el servicio Menu y el servicio de Inventario,
    alineado con la ERS 3.3.0 (RF-INTG-03, RF-INTG-04 y RF-INTG-05). Estos son todos los
    eventos del servicio: Menu publica menu.source.created, menu.source.updated y
    menu.source.deleted, y consume inventory.source.availability.updated. Menu no emite
    eventos de catálogo a otros consumidores (RF-CONS-05.CA1).

    Origen de contenido (source). Es la unidad cuya disponibilidad evalúa Inventario, de
    forma independiente para cada origen:

    - Receta (RECIPE): sourceId es el identificador de la receta, name es su nombre e items
      son sus líneas de ingrediente.
    - Opción de contenido directo de Inventario (INVENTORY_ITEM): sourceId es el
      identificador de la opción, name es null e items contiene un único elemento con el
      artículo y la cantidad de la opción. Toda opción de este tipo es un origen propio, sin
      reutilización entre opciones, e Inventario la evalúa como una receta de un único
      ingrediente.

    items[].id es el identificador del artículo en Inventario e items[].quantity es la
    cantidad expresada en la unidad que Inventario establece para el artículo.

    Disponibilidad. inventory.source.availability.updated fija la disponibilidad de toda
    opción cuyo origen es sourceId: si es una receta, de todas las opciones que la usan; si
    es una opción, de esa opción. Un artículo retirado de Inventario llega como isAvailable
    false; no existe un evento de retiro. Ningún evento cambia el estado administrativo.

    Solo las operaciones aceptadas emiten eventos. El tratamiento de duplicados y del orden,
    la consistencia eventual, la disponibilidad antes del primer evento, el ámbito por
    sucursal y la reconciliación quedan pendientes en OPEN-011 de la ERS.
  license:
    name: MIT
    url: https://github.com/FMAT-Restaurant/Menu-Documentation/blob/main/LICENSE
  contact:
    name: FMAT Restaurant
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    title: Broker RabbitMQ
    description: >-
      Broker de mensajería RabbitMQ (AMQP) por el que Menu e Inventario intercambian los
      eventos. El host se define en cada despliegue; este contrato no fija exchanges, colas
      ni enlaces.
    variables:
      host:
        description: Host y puerto del broker RabbitMQ, definidos en cada despliegue.
        examples:
          - rabbitmq.example.com:5672
channels:
  menuSourceCreated:
    address: menu.source.created
    title: Alta de un origen de contenido
    description: >-
      Menu publica el alta de un origen de contenido (RF-INTG-05.CA1): al crear una receta,
      también cuando se crea desde la configuración de una opción, y al crear una opción
      INVENTORY_ITEM, también en el alta de una oferta y en una copia de composición armada
      en el front. Es el único evento que indica sourceType (RF-INTG-05.CA6).
    servers:
      - $ref: '#/servers/rabbitmq'
    messages:
      menuSourceCreated:
        $ref: '#/components/messages/MenuSourceCreated'
  menuSourceUpdated:
    address: menu.source.updated
    title: Modificación de un origen de contenido
    description: >-
      Menu publica la modificación de un origen de contenido (RF-INTG-05.CA2): en cada
      revisión nueva de una receta, y al cambiar el artículo o la cantidad de una opción
      INVENTORY_ITEM, cuyo sourceId no cambia. Una edición que no crea una revisión nueva ni
      cambia el artículo o la cantidad no emite el evento. Lleva el contenido completo
      vigente del origen, sin sourceType.
    servers:
      - $ref: '#/servers/rabbitmq'
    messages:
      menuSourceUpdated:
        $ref: '#/components/messages/MenuSourceUpdated'
  menuSourceDeleted:
    address: menu.source.deleted
    title: Eliminación de un origen de contenido
    description: >-
      Menu publica la eliminación de un origen de contenido (RF-INTG-05.CA3): al eliminar la
      definición vigente de una receta y al eliminar una opción INVENTORY_ITEM, ya sea porque
      la actualización de la composición la omite de la lista de opciones de su grupo, porque
      se elimina su grupo de selección o porque se elimina en cascada con su oferta o con su
      entrada.
    servers:
      - $ref: '#/servers/rabbitmq'
    messages:
      menuSourceDeleted:
        $ref: '#/components/messages/MenuSourceDeleted'
  inventorySourceAvailabilityUpdated:
    address: inventory.source.availability.updated
    title: Disponibilidad de un origen de contenido
    description: >-
      Inventario publica la disponibilidad de un origen de contenido (RF-INTG-03). Menu fija
      isAvailable de toda opción cuyo origen es sourceId (todas las opciones que usan la
      receta, o la propia opción INVENTORY_ITEM) y recalcula la disponibilidad de grupos de
      selección, ofertas y entradas (RF-DISP-06), sin cambiar ningún status. Un artículo
      retirado de Inventario llega como isAvailable false.
    servers:
      - $ref: '#/servers/rabbitmq'
    messages:
      inventorySourceAvailabilityUpdated:
        $ref: '#/components/messages/InventorySourceAvailabilityUpdated'
operations:
  sendMenuSourceCreated:
    action: send
    channel:
      $ref: '#/channels/menuSourceCreated'
    title: Publicar el alta de un origen de contenido
    summary: Menu publica una receta o una opción INVENTORY_ITEM recién creada.
    messages:
      - $ref: '#/channels/menuSourceCreated/messages/menuSourceCreated'
  sendMenuSourceUpdated:
    action: send
    channel:
      $ref: '#/channels/menuSourceUpdated'
    title: Publicar la modificación de un origen de contenido
    summary: Menu publica la revisión nueva de una receta o el cambio de artículo o cantidad de una opción INVENTORY_ITEM.
    messages:
      - $ref: '#/channels/menuSourceUpdated/messages/menuSourceUpdated'
  sendMenuSourceDeleted:
    action: send
    channel:
      $ref: '#/channels/menuSourceDeleted'
    title: Publicar la eliminación de un origen de contenido
    summary: Menu publica la eliminación de una receta o de una opción INVENTORY_ITEM.
    messages:
      - $ref: '#/channels/menuSourceDeleted/messages/menuSourceDeleted'
  receiveInventorySourceAvailabilityUpdated:
    action: receive
    channel:
      $ref: '#/channels/inventorySourceAvailabilityUpdated'
    title: Recibir la disponibilidad de un origen de contenido
    summary: Menu actualiza la disponibilidad de las opciones con ese origen.
    messages:
      - $ref: '#/channels/inventorySourceAvailabilityUpdated/messages/inventorySourceAvailabilityUpdated'
components:
  messages:
    MenuSourceCreated:
      name: menu.source.created
      title: Origen de contenido creado
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MenuSourceCreatedPayload'
      examples:
        - name: receta
          summary: Alta de una receta
          payload:
            sourceId: c4813f65-00b4-4921-874e-03c555796401
            name: Hamburguesa Hawaiana
            sourceType: RECIPE
            items:
              - id: CARNE-150G
                quantity: 200
              - id: PINA-REBANADA
                quantity: 2
        - name: opcionContenidoDirecto
          summary: Alta de una opción de contenido directo de Inventario
          payload:
            sourceId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
            name: null
            sourceType: INVENTORY_ITEM
            items:
              - id: CARNE-150G
                quantity: 200
    MenuSourceUpdated:
      name: menu.source.updated
      title: Origen de contenido modificado
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MenuSourceUpdatedPayload'
      examples:
        - name: revisionDeReceta
          summary: Revisión nueva de una receta
          payload:
            sourceId: c4813f65-00b4-4921-874e-03c555796401
            name: Hamburguesa Hawaiana Especial
            items:
              - id: CARNE-150G
                quantity: 250
              - id: PINA-REBANADA
                quantity: 2
        - name: cambioDeCantidadEnOpcion
          summary: Cambio de cantidad de una opción de contenido directo de Inventario
          payload:
            sourceId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
            name: null
            items:
              - id: CARNE-150G
                quantity: 250
    MenuSourceDeleted:
      name: menu.source.deleted
      title: Origen de contenido eliminado
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MenuSourceDeletedPayload'
      examples:
        - name: recetaEliminada
          summary: Eliminación de la definición vigente de una receta
          payload:
            sourceId: c4813f65-00b4-4921-874e-03c555796401
        - name: opcionEliminada
          summary: Eliminación de una opción de contenido directo de Inventario
          payload:
            sourceId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
    InventorySourceAvailabilityUpdated:
      name: inventory.source.availability.updated
      title: Disponibilidad de un origen de contenido actualizada
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventorySourceAvailabilityUpdatedPayload'
      examples:
        - name: recetaNoDisponible
          summary: La receta deja de estar disponible
          payload:
            sourceId: c4813f65-00b4-4921-874e-03c555796401
            isAvailable: false
        - name: opcionDisponible
          summary: La opción de contenido directo vuelve a estar disponible
          payload:
            sourceId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
            isAvailable: true
  schemas:
    SourceId:
      type: string
      format: uuid
      description: >-
        Identificador del origen de contenido: el de la receta en un origen RECIPE o el de la
        opción en un origen INVENTORY_ITEM.
      examples:
        - c4813f65-00b4-4921-874e-03c555796401
    SourceType:
      type: string
      enum:
        - RECIPE
        - INVENTORY_ITEM
      description: >-
        Tipo de origen: RECIPE para una receta e INVENTORY_ITEM para una opción de contenido
        directo de Inventario. Solo se indica en menu.source.created.
    SourceName:
      type:
        - string
        - 'null'
      minLength: 1
      description: Nombre de la receta; null en un origen INVENTORY_ITEM.
      examples:
        - Hamburguesa Hawaiana
    SourceItem:
      type: object
      required:
        - id
        - quantity
      properties:
        id:
          type: string
          minLength: 1
          description: Identificador del artículo en Inventario; string opaco sin formato impuesto.
          examples:
            - CARNE-150G
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Cantidad positiva expresada en la unidad que Inventario establece para el artículo.
          examples:
            - 200
    SourceItems:
      type: array
      minItems: 1
      description: >-
        Líneas de ingrediente de la receta o, en un origen INVENTORY_ITEM, un único elemento
        con el artículo y la cantidad de la opción.
      items:
        $ref: '#/components/schemas/SourceItem'
    MenuSourceCreatedPayload:
      type: object
      required:
        - sourceId
        - name
        - sourceType
        - items
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          $ref: '#/components/schemas/SourceName'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        items:
          $ref: '#/components/schemas/SourceItems'
      if:
        properties:
          sourceType:
            const: INVENTORY_ITEM
      then:
        properties:
          name:
            type: 'null'
          items:
            maxItems: 1
      else:
        properties:
          name:
            type: string
    MenuSourceUpdatedPayload:
      type: object
      required:
        - sourceId
        - name
        - items
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          $ref: '#/components/schemas/SourceName'
        items:
          $ref: '#/components/schemas/SourceItems'
      if:
        properties:
          name:
            type: 'null'
      then:
        properties:
          items:
            maxItems: 1
    MenuSourceDeletedPayload:
      type: object
      required:
        - sourceId
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
    InventorySourceAvailabilityUpdatedPayload:
      type: object
      required:
        - sourceId
        - isAvailable
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        isAvailable:
          type: boolean
          description: >-
            true si el origen está disponible y false si no lo está, también cuando un
            artículo que contiene se retiró de Inventario.
