offers:
  get:
    tags: [Ofertas]
    operationId: listMenuOffers
    x-required-permission:
      - menu:offers:read
    summary: Listar ofertas
    description: >-
      Consulta administrativa de ofertas en cualquier estado administrativo, con su
      composición resumida. entryId limita a las ofertas de una entrada; excludeOfferId
      excluye una oferta y excludeArchivedEntries=true excluye las ofertas de entradas
      archivadas, de modo que, para elegir el origen de una copia de composición, se
      combinan excludeOfferId con la oferta destino y excludeArchivedEntries=true. Las
      ofertas de una misma entrada se ordenan alfabéticamente por etiqueta de
      presentación. La lista se pagina en el servidor.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/EntryIdQuery
      - $ref: ../openapi.yaml#/components/parameters/ExcludeOfferId
      - $ref: ../openapi.yaml#/components/parameters/ExcludeArchivedEntries
      - $ref: ../openapi.yaml#/components/parameters/Page
      - $ref: ../openapi.yaml#/components/parameters/PageSize
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Página de ofertas.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogOfferListResponse
            examples:
              ofertasDeEntrada:
                summary: Ofertas de una entrada del catálogo
                value:
                  data:
                    - id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      entryName: Hamburguesa Hawaiana
                      presentationTag: Individual
                      basePrice: 180.0
                      status: ACTIVE
                      isAvailable: true
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      slotCount: 1
                  meta:
                    page: 1
                    pageSize: 12
                    total: 1
                    totalPages: 1
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests

entryOffers:
  parameters:
    - name: entryId
      in: path
      required: true
      description: UUID de la entrada a la que pertenecerá la nueva oferta.
      schema:
        type: string
        format: uuid
        example: 7d19a8ce-402c-4bab-b383-9969b69fe101
  post:
    tags: [Ofertas]
    operationId: createEntryOffer
    x-required-permission:
      - menu:offers:write
    summary: Crear una oferta para una entrada
    description: >-
      Crea una oferta en la entrada indicada con su etiqueta de presentación, precio
      base, imagen y composición inicial válida. La oferta inicia INACTIVE y se activa
      después con PATCH. Cada opción nueva admite status opcional; si se omite, inicia
      ACTIVE. La imagen se carga antes con POST /menu/media/images y su data.id se envía
      como imageId; una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED y una
      referencia inexistente o inválida 422. Una entrada archivada devuelve 409
      ENTRY_ARCHIVED. Una opción RECIPE se indica solo con recipeId y usa siempre la
      revisión vigente de la receta; una receta inexistente devuelve 422. En un mismo
      grupo no se repite el contenido (422 DUPLICATE_OPTION_CONTENT). Si Inventario no
      responde al validar un artículo, devuelve 502 sin crear la oferta; un artículo
      inexistente devuelve 422. Copia de composición: para crear la oferta con una copia
      de otra, consulte la oferta origen con GET /menu/offers/{offerId} y envíe sus
      grupos y opciones sin slotId ni optionId, conservando el status de cada opción; no
      se copian el precio base, la etiqueta de presentación ni la imagen, y no se guarda
      ninguna referencia al origen. Una receta creada antes desde la configuración de una
      opción (POST /menu/recipes) es una operación independiente y permanece en la
      biblioteca aunque se rechace la oferta.

      Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica,
      con alcance por usuario autenticado, menú, método POST y ruta concreta (incluido
      entryId). Durante 24 horas desde la primera creación confirmada, reenviar la misma
      clave y el mismo JSON semántico devuelve el 201, cuerpo y ETag originales, con la
      misma oferta, grupos de selección, opciones e imagen; no repite efectos. El orden
      de propiedades y los espacios del JSON no alteran su igualdad; el orden de arrays
      y la diferencia entre omisión y null sí la alteran. Tras autenticar y autorizar al
      solicitante, el resultado guardado se recupera antes de validar los recursos o
      referencias vigentes, incluso si después fueron editados o eliminados. Otra carga
      JSON con la misma clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED;
      una creación todavía en curso devuelve 409 con error.details.code
      IDEMPOTENCY_IN_PROGRESS y Retry-After. La ausencia o invalidez del encabezado
      devuelve 400. Los errores anteriores a la creación confirmada, incluido 502, no
      fijan un resultado y liberan la clave para reintentar la misma solicitud. Los
      reintentos no extienden el plazo; después de 24 horas la clave puede tratarse como
      nueva y ya no garantiza evitar duplicados.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogOfferCreateRequest
          examples:
            ofertaConReceta:
              summary: Crear una oferta con una opción de receta
              value:
                presentationTag: Individual
                basePrice: 185.0
                imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                composition:
                  slots:
                    - name: Plato principal
                      quantity: 1
                      course: plato fuerte
                      options:
                        - sourceType: RECIPE
                          recipeId: c4813f65-00b4-4921-874e-03c555796401
                          displayName: Hamburguesa Hawaiana
            ofertaConInventario:
              summary: Crear una oferta con una opción de artículo de Inventario
              value:
                presentationTag: Individual
                basePrice: 180.0
                imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                composition:
                  slots:
                    - name: Acompañamiento
                      quantity: 1
                      course: plato fuerte
                      options:
                        - sourceType: INVENTORY_ITEM
                          inventoryItemId: CARNE-150G
                          quantity: 200
                          displayName: Papas
            ofertaCopiada:
              summary: Crear una oferta con la composición copiada de otra
              value:
                presentationTag: Doble
                basePrice: 230.0
                imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                composition:
                  slots:
                    - name: Plato principal
                      quantity: 1
                      course: plato fuerte
                      options:
                        - sourceType: RECIPE
                          recipeId: c4813f65-00b4-4921-874e-03c555796401
                          displayName: Hamburguesa Hawaiana
                          status: ACTIVE
                        - sourceType: INVENTORY_ITEM
                          inventoryItemId: CARNE-150G
                          quantity: 200
                          displayName: Carne extra
                          status: INACTIVE
    responses:
      '201':
        description: Oferta creada; un reintento idempotente reproduce el cuerpo y el ETag de la creación original.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../openapi.yaml#/components/schemas/CatalogOfferResponse
                - type: object
                  properties:
                    data:
                      allOf:
                        - $ref: ../openapi.yaml#/components/schemas/CatalogOfferDetail
                        - type: object
                          properties:
                            status:
                              type: string
                              const: INACTIVE
            examples:
              ofertaCreadaConReceta:
                summary: Oferta creada con una opción de receta
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 185.0
                    status: INACTIVE
                    isAvailable: false
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Plato principal
                          quantity: 1
                          course: plato fuerte
                          isAvailable: true
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                              sourceType: RECIPE
                              recipeId: c4813f65-00b4-4921-874e-03c555796401
                              displayName: Hamburguesa Hawaiana
                              status: ACTIVE
                              isAvailable: true
              ofertaCreadaConInventario:
                summary: Oferta creada con una opción de artículo de Inventario
                value:
                  data:
                    id: c68f8a31-7f0e-4b4b-a8ed-118da2ce4102
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 180.0
                    status: INACTIVE
                    isAvailable: false
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: c43a9201-0c4b-4f23-9cf8-437ab312e501
                          name: Acompañamiento
                          quantity: 1
                          course: plato fuerte
                          isAvailable: true
                          options:
                            - optionId: 79a1bc24-0d4f-489b-9836-3a60b5c4ed12
                              sourceType: INVENTORY_ITEM
                              inventoryItemId: CARNE-150G
                              quantity: 200
                              displayName: Papas
                              status: ACTIVE
                              isAvailable: true
      '400':
        $ref: ../openapi.yaml#/components/responses/IdempotencyBadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        description: No existe la entrada asociada.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              entradaNoEncontrada:
                summary: La entrada indicada no existe
                value:
                  error:
                    message: No se encontró la entrada indicada.
      '409':
        $ref: ../openapi.yaml#/components/responses/IdempotencyOrDomainConflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      '502':
        $ref: ../openapi.yaml#/components/responses/InventoryUnavailable

offerById:
  parameters:
    - name: offerId
      in: path
      required: true
      description: UUID de la oferta que se consultará o modificará.
      schema:
        type: string
        format: uuid
        example: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
  get:
    tags: [Ofertas]
    operationId: getMenuOffer
    x-required-permission:
      - menu:offers:read
    summary: Consultar una oferta y su composición
    description: >-
      Devuelve la oferta y su composición en cualquier estado administrativo. Cada
      opción incluye status e isAvailable; RECIPE incluye recipeId y usa la revisión
      vigente de la receta; INVENTORY_ITEM incluye inventoryItemId y quantity, expresada
      en la unidad que Inventario establece para el artículo. Los grupos de selección y
      las opciones se devuelven en el orden de presentación, que es también el orden de
      sucesión de las rondas. displayName es el nombre mostrado de la opción.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Detalle de la oferta, incluida su composición.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogOfferResponse
            examples:
              ofertaConReceta:
                summary: Oferta con un grupo de selección de receta
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 180.0
                    status: ACTIVE
                    isAvailable: true
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Plato principal
                          quantity: 1
                          course: plato fuerte
                          isAvailable: true
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                              sourceType: RECIPE
                              recipeId: c4813f65-00b4-4921-874e-03c555796401
                              displayName: Hamburguesa Hawaiana
                              status: ACTIVE
                              isAvailable: true
              ofertaConInventario:
                summary: Oferta con un grupo de selección de artículo de Inventario
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 180.0
                    status: ACTIVE
                    isAvailable: true
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Acompañamiento
                          quantity: 1
                          course: plato fuerte
                          isAvailable: true
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                              sourceType: INVENTORY_ITEM
                              inventoryItemId: CARNE-150G
                              quantity: 200
                              displayName: Papas
                              status: ACTIVE
                              isAvailable: true
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  patch:
    tags: [Ofertas]
    operationId: patchMenuOffer
    x-required-permission:
      - menu:offers:write
      - menu:offers:status
    summary: Actualizar una oferta
    description: >-
      Actualiza parcialmente la oferta y su composición en una sola operación atómica;
      la oferta es la raíz del agregado y su ETag protege también la composición. Todos
      los campos son opcionales; los omitidos se conservan. imageId no se acepta: la
      imagen se cambia con PUT /menu/media/images/{imageId}. Enviar composition.slots
      reemplaza la lista completa de grupos: los grupos vigentes que no aparecen se
      eliminan con sus opciones. Enviar options en un grupo reemplaza la lista completa
      de opciones de ese grupo: las opciones vigentes que no aparecen se eliminan. Omitir
      slots u options conserva la lista vigente; dentro de un grupo u opción existente,
      identificado por slotId u optionId, los campos omitidos se conservan. Los grupos y
      opciones nuevos se envían sin identificador. El orden de los arrays es el orden de
      presentación y el de las rondas. Se rechazan con 422 las listas vacías, los
      identificadores desconocidos, ajenos o duplicados, un sourceType distinto del
      almacenado en una opción existente (SOURCE_TYPE_IMMUTABLE) y el contenido repetido
      en un grupo (DUPLICATE_OPTION_CONTENT). Activar la oferta (status ACTIVE) exige una
      composición válida, que toda oferta mantiene, y no exige disponibilidad; ningún
      proceso reactiva una oferta inactivada. Cualquier PATCH sobre una oferta de una
      entrada archivada devuelve 409 ENTRY_ARCHIVED. Una opción RECIPE usa siempre la
      revisión vigente de su receta; omitir recipeId en una opción RECIPE existente
      conserva la receta asignada. Si Inventario no responde al validar un artículo,
      devuelve 502 sin cambios; un artículo inexistente devuelve 422. Copia de
      composición: para agregar a esta oferta una copia de otra, consulte la oferta
      origen con GET /menu/offers/{offerId} y envíe en composition.slots los grupos
      vigentes que desea conservar (con slotId) junto con los grupos y opciones del
      origen sin identificadores, conservando el status de cada opción; no se copian el
      precio base, la etiqueta de presentación ni la imagen, y no se guarda ninguna
      referencia al origen.

      Cuenta como cambio de estado el `status` de la oferta o el `status` de una opción
      existente (con `optionId`); el `status` de una opción nueva forma parte de su alta.
      Un cuerpo sin cambios de estado exige `menu:offers:write`; un cuerpo con solo
      cambios de estado exige `menu:offers:status`; un cuerpo que los mezcla con otros
      cambios exige ambos permisos.

      Requiere Idempotency-Key, un UUID generado por el cliente para este guardado lógico,
      además de If-Match. La clave se delimita por el sujeto autenticado, el menú,
      el método PATCH y la ruta concreta de la oferta. Los reintentos conservan la clave,
      el JSON y el If-Match originales. La comparación ignora espacios y orden de
      propiedades JSON; conserva el orden de arrays y distingue omisión de null.
      Tras autenticar y autorizar, un resultado exitoso con la misma solicitud se
      recupera antes de volver a comprobar el ETag o las referencias vigentes.
      Durante 24 horas desde la confirmación inicial devuelve el 200, cuerpo y ETag
      originales, incluidos los IDs generados, sin repetir la actualización, aunque
      después se haya editado o eliminado la oferta. Cambiar el JSON o el If-Match bajo
      la misma clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED. Una
      solicitud en proceso o cuyo resultado aún no se ha confirmado devuelve 409 con
      error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After; no se inicia otra
      actualización hasta confirmar el resultado anterior. La ausencia o invalidez
      de Idempotency-Key devuelve 400. If-Match sigue siendo obligatorio: omitirlo
      devuelve 428; sin un resultado exitoso recuperable, un ETag obsoleto devuelve 412.
      Un fallo confirmado anterior a la persistencia, incluido 502, no aplica cambios
      ni conserva un resultado exitoso y permite reintentar los mismos datos y headers.
      Los reintentos no extienden las 24 horas; una clave expirada se trata como nueva.
      Antes de reenviar un guardado incierto con una clave expirada, consulte y
      reconcilie el estado actual para evitar repetir la actualización.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogOfferPatchRequest
          examples:
            actualizarComposicion:
              summary: Conservar dos grupos de selección y actualizar parcialmente las opciones del segundo
              value:
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445302
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                          sourceType: RECIPE
                          status: INACTIVE
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                          sourceType: INVENTORY_ITEM
            agregarSlot:
              summary: Conservar un grupo de selección existente y agregar uno nuevo
              value:
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                    - name: Acompañamiento
                      quantity: 1
                      options:
                        - displayName: Papas
                          sourceType: INVENTORY_ITEM
                          inventoryItemId: CARNE-150G
                          quantity: 200
            actualizarNombreReceta:
              summary: Cambiar el nombre de una opción RECIPE conservando su receta
              value:
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                          sourceType: RECIPE
                          displayName: Hamburguesa Hawaiana especial
            actualizarCantidadInventario:
              summary: Cambiar solo la cantidad de una opción existente que ya usa INVENTORY_ITEM
              value:
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445302
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                          sourceType: INVENTORY_ITEM
                          quantity: 250
            activarOferta:
              summary: Activar la oferta
              value:
                status: ACTIVE
            copiarComposicion:
              summary: Conservar el grupo vigente y agregar la composición copiada de otra oferta
              value:
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                    - name: Bebida
                      quantity: 1
                      course: bebida
                      options:
                        - sourceType: INVENTORY_ITEM
                          inventoryItemId: REFRESCO-355ML
                          quantity: 1
                          displayName: Refresco
                          status: ACTIVE
                        - sourceType: INVENTORY_ITEM
                          inventoryItemId: AGUA-500ML
                          quantity: 1
                          displayName: Agua
                          status: INACTIVE
    responses:
      '200':
        description: Oferta actualizada o respuesta original del mismo guardado idempotente, con el cuerpo y ETag originales.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogOfferResponse
            examples:
              ofertaActualizada:
                summary: Oferta actualizada
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 185.0
                    status: ACTIVE
                    isAvailable: true
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Plato principal
                          quantity: 1
                          course: plato fuerte
                          isAvailable: true
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
