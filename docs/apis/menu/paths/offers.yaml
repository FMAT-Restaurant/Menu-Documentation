  delete:
    tags: [Ofertas]
    operationId: deleteMenuOffer
    x-required-permission:
      - menu:offers:write
    summary: Eliminar una oferta
    description: >-
      Elimina una oferta INACTIVE; una oferta ACTIVE devuelve 409 OFFER_NOT_INACTIVE y
      una oferta de una entrada archivada 409 ENTRY_ARCHIVED, sin cambios. Elimina
      también su composición, grupos de selección y opciones, y su imagen. Haber servido
      como origen de una copia no impide eliminarla. Recalcula la disponibilidad de la
      entrada sin cambiar su estado administrativo. Exige If-Match: su ausencia devuelve
      428 y un valor obsoleto 412.
