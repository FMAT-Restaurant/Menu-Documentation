offers:
  get:
    tags: [Ofertas]
    operationId: listMenuOffers
    summary: Listar ofertas
    description: >-
      Devuelve una página de ofertas. Puede limitar los resultados a una
      entrada y excluir una oferta concreta; la lista se pagina en el servidor.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/EntryIdQuery
      - $ref: ../openapi.yaml#/components/parameters/ExcludeOfferId
      - $ref: ../openapi.yaml#/components/parameters/Page
      - $ref: ../openapi.yaml#/components/parameters/PageSize
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Página de ofertas.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogOfferListResponse
            examples:
              ofertasDeEntrada:
                summary: Ofertas de una entrada del catálogo
                value:
                  data:
                    - id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      entryName: Hamburguesa Hawaiana
                      presentationTag: Individual
                      basePrice: 180.0
                      status: ACTIVE
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      slotCount: 1
                  meta:
                    page: 1
                    pageSize: 12
                    total: 1
                    totalPages: 1
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests

entryOffers:
  parameters:
    - name: entryId
      in: path
      required: true
      description: UUID de la entrada a la que pertenecerá la nueva oferta.
      schema:
        type: string
        format: uuid
        example: 7d19a8ce-402c-4bab-b383-9969b69fe101
  post:
    tags: [Ofertas]
    operationId: createEntryOffer
    summary: Crear una oferta para una entrada
    description: >-
      Crea una oferta asociada a la entrada indicada en la ruta. La composición
      define los espacios de selección y sus opciones. La imagen es obligatoria:
      cárguela antes mediante POST /api/v1/media/images y envíe data.id de la
      respuesta como imageId en el cuerpo JSON. Esta operación no recibe archivos
      ni URLs. imageId debe identificar una imagen existente, válida y accesible
      al solicitante; una referencia inválida devuelve 422 sin crear la oferta.
      Toda oferta se crea con estado INACTIVE y debe activarse manualmente después.
      El servidor asigna status: ACTIVE a todas las opciones nuevas; el cuerpo
      de POST no acepta status para las opciones. Si falla la consulta a Inventario
      necesaria para validar un origen INVENTORY_ITEM, devuelve 502 sin crear la
      oferta; un artículo de inventario inválido devuelve 422.
      La carga previa es una operación independiente y no se deshace si falla la
      creación de la oferta.
      Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica,
      con alcance por usuario autenticado, menú, método POST y ruta concreta (incluido
      entryId). Durante 24 horas desde la primera creación confirmada, reenviar la misma
      clave y el mismo JSON semántico devuelve el 201, cuerpo y ETag originales, con la
      misma oferta, slots, opciones e imagen; no repite efectos ni resuelve otra vez las
      revisiones de recetas. El orden de propiedades y los espacios del JSON no alteran
      su igualdad; el orden de arrays y la diferencia entre omisión y null sí la alteran.
      Tras autenticar y autorizar al solicitante, el resultado guardado se recupera antes
      de validar los recursos o referencias vigentes, incluso si después fueron editados
      o eliminados. Otra carga JSON con la misma clave devuelve 409 con
      error.details.code IDEMPOTENCY_KEY_REUSED; una creación todavía en curso
      devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After. La ausencia o
      invalidez del encabezado devuelve 400. Los errores anteriores a la creación
      confirmada, incluido 502, no fijan un resultado y liberan la clave para reintentar
      la misma solicitud. Los reintentos no extienden el plazo; después de 24 horas la
      clave puede tratarse como nueva y ya no garantiza evitar duplicados.
      Una opción RECIPE se selecciona solo por recipeId: al asignarla, el servidor
      resuelve atómicamente la revisión válida publicada más reciente y la conserva
      internamente; no se expone una revisión en la opción. Una receta inexistente o
      sin revisión válida devuelve 422 sin aplicar cambios.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogOfferCreateRequest
          examples:
            ofertaConReceta:
              summary: Crear una oferta con una opción de receta
              value:
                presentationTag: Individual
                basePrice: 185.0
                imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                composition:
                  slots:
                    - name: Plato principal
                      quantity: 1
                      course: plato fuerte
                      options:
                        - sourceType: RECIPE
                          recipeId: c4813f65-00b4-4921-874e-03c555796401
                          displayName: Hamburguesa Hawaiana
            ofertaConInventario:
              summary: Crear una oferta con una opción de insumo de inventario
              value:
                presentationTag: Individual
                basePrice: 180.0
                imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                composition:
                  slots:
                    - name: Acompañamiento
                      quantity: 1
                      course: plato fuerte
                      options:
                        - sourceType: INVENTORY_ITEM
                          inventoryItemId: CARNE-150G
                          quantity: 200
                          unit: g
                          displayName: Papas
    responses:
      '201':
        description: Oferta creada; un reintento idempotente reproduce el cuerpo y el ETag de la creación original.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../openapi.yaml#/components/schemas/CatalogOfferResponse
                - type: object
                  properties:
                    data:
                      allOf:
                        - $ref: ../openapi.yaml#/components/schemas/CatalogOfferDetail
                        - type: object
                          properties:
                            status:
                              type: string
                              const: INACTIVE
            examples:
              ofertaCreadaConReceta:
                summary: Oferta creada con una opción de receta
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 185.0
                    status: INACTIVE
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Plato principal
                          quantity: 1
                          course: plato fuerte
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                              sourceType: RECIPE
                              recipeId: c4813f65-00b4-4921-874e-03c555796401
                              displayName: Hamburguesa Hawaiana
                              status: ACTIVE
              ofertaCreadaConInventario:
                summary: Oferta creada con una opción de insumo de inventario
                value:
                  data:
                    id: c68f8a31-7f0e-4b4b-a8ed-118da2ce4102
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 180.0
                    status: INACTIVE
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: c43a9201-0c4b-4f23-9cf8-437ab312e501
                          name: Acompañamiento
                          quantity: 1
                          course: plato fuerte
                          options:
                            - optionId: 79a1bc24-0d4f-489b-9836-3a60b5c4ed12
                              sourceType: INVENTORY_ITEM
                              inventoryItemId: CARNE-150G
                              quantity: 200
                              unit: g
                              displayName: Papas
                              status: ACTIVE
      '400':
        $ref: ../openapi.yaml#/components/responses/IdempotencyBadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        description: No existe la entrada asociada.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              entradaNoEncontrada:
                summary: La entrada indicada no existe
                value:
                  error:
                    message: No se encontró la entrada indicada.
      '409':
        $ref: ../openapi.yaml#/components/responses/IdempotencyConflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      '502':
        $ref: ../openapi.yaml#/components/responses/InventoryUnavailable

offerById:
  parameters:
    - name: offerId
      in: path
      required: true
      description: UUID de la oferta que se consultará o modificará.
      schema:
        type: string
        format: uuid
        example: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
  get:
    tags: [Ofertas]
    operationId: getMenuOffer
    summary: Consultar una oferta y su composición
    description: >-
      Devuelve los datos de la oferta y su composición. Cada opción identifica su
      origen mediante sourceType y los campos específicos del tipo: RECIPE incluye
      recipeId; la revisión asignada se conserva internamente. INVENTORY_ITEM incluye inventoryItemId, quantity
      y unit. displayName es el nombre de la opción que se muestra en el menú.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Detalle de la oferta, incluida su composición.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogOfferResponse
            examples:
              ofertaConReceta:
                summary: Oferta con un espacio de receta
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 180.0
                    status: ACTIVE
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Plato principal
                          quantity: 1
                          course: plato fuerte
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                              sourceType: RECIPE
                              recipeId: c4813f65-00b4-4921-874e-03c555796401
                              displayName: Hamburguesa Hawaiana
              ofertaConInventario:
                summary: Oferta con un espacio de insumo de inventario
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 180.0
                    status: ACTIVE
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Acompañamiento
                          quantity: 1
                          course: plato fuerte
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                              sourceType: INVENTORY_ITEM
                              inventoryItemId: CARNE-150G
                              quantity: 200
                              unit: g
                              displayName: Papas
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  patch:
    tags: [Ofertas]
    operationId: patchMenuOffer
    summary: Actualizar una oferta
    description: >-
      Actualiza parcialmente una oferta. presentationTag es un string requerido
      en cada solicitud; los demás campos omitidos se conservan;
      enviar composition.slots o las options de un slot reemplaza el conjunto
      completo. La composición se valida íntegramente y se persiste de forma
      atómica. Una ejecución nueva requiere el ETag vigente en If-Match. Las reglas de IDs, tipos de
      opción, estados e imagen se detallan en el esquema de solicitud.
      Si falla la consulta a Inventario necesaria para validar un origen
      INVENTORY_ITEM, devuelve 502 sin aplicar cambios; un artículo de inventario
      inválido devuelve 422.
      Para una opción RECIPE, enviar recipeId, incluso si coincide con el actual,
      asigna atómicamente la revisión válida publicada más reciente. Omitir recipeId
      en una opción que ya es RECIPE conserva la asignación anterior; cambiar el tipo
      de origen a RECIPE requiere recipeId. La revisión resuelta se conserva internamente
      y no se expone en la opción. Una receta inexistente o sin revisión válida devuelve
      422 sin aplicar cambios; editar después la receta no altera las opciones existentes.
      Requiere Idempotency-Key, un UUID generado por el cliente para este guardado lógico,
      además de If-Match. La clave se delimita por el sujeto autenticado, el menú,
      el método PATCH y la ruta concreta de la oferta. Los reintentos conservan la clave,
      el JSON y el If-Match originales. La comparación ignora espacios y orden de
      propiedades JSON; conserva el orden de arrays y distingue omisión de null.
      Tras autenticar y autorizar, un resultado exitoso con la misma solicitud se
      recupera antes de volver a comprobar el ETag o las referencias vigentes.
      Durante 24 horas desde la confirmación inicial devuelve el 200, cuerpo y ETag
      originales, incluidos los IDs generados, la imagen y la asignación de recetas,
      sin repetir la actualización ni resolver otra revisión, aunque después se haya
      editado o eliminado la oferta. Cambiar el JSON o el If-Match bajo la misma clave
      devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED. Una solicitud en
      proceso o cuyo resultado aún no se ha confirmado devuelve 409 con
      error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After; no se inicia otra
      actualización hasta confirmar el resultado anterior. La ausencia o invalidez
      de Idempotency-Key devuelve 400. If-Match sigue siendo obligatorio: omitirlo
      devuelve 428; sin un resultado exitoso recuperable, un ETag obsoleto devuelve 412.
      Un fallo confirmado anterior a la persistencia, incluido 502, no aplica cambios
      ni conserva un resultado exitoso y permite reintentar los mismos datos y headers.
      Los reintentos no extienden las 24 horas; una clave expirada se trata como nueva.
      Antes de reenviar un guardado incierto con una clave expirada, consulte y
      reconcilie el estado actual para evitar repetir la actualización.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogOfferPatchRequest
          examples:
            actualizarComposicion:
              summary: Conservar dos slots y actualizar parcialmente las opciones del segundo
              value:
                presentationTag: Individual
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445302
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                          sourceType: RECIPE
                          status: INACTIVE
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                          sourceType: INVENTORY_ITEM
            agregarSlot:
              summary: Conservar un slot existente y agregar un slot nuevo
              value:
                presentationTag: Individual
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                    - name: Acompañamiento
                      quantity: 1
                      options:
                        - displayName: Papas
                          status: ACTIVE
                          sourceType: INVENTORY_ITEM
                          inventoryItemId: CARNE-150G
                          quantity: 200
                          unit: g
            cambiarOrigen:
              summary: Asignar una receta por ID usando su revisión válida más reciente
              value:
                presentationTag: Individual
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                          sourceType: RECIPE
                          recipeId: c4813f65-00b4-4921-874e-03c555796401
            actualizarNombreReceta:
              summary: Cambiar el nombre de una opción RECIPE conservando su asignación
              value:
                presentationTag: Individual
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                          sourceType: RECIPE
                          displayName: Hamburguesa Hawaiana especial
            actualizarCantidadInventario:
              summary: Cambiar solo la cantidad de una opción existente que ya usa INVENTORY_ITEM
              value:
                presentationTag: Individual
                composition:
                  slots:
                    - slotId: b37c1bd7-17b2-47a2-a3a4-802559445302
                      options:
                        - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                          sourceType: INVENTORY_ITEM
                          quantity: 250
    responses:
      '200':
        description: Oferta actualizada o respuesta original del mismo guardado idempotente, con el cuerpo y ETag originales.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogOfferPatchResponse
            examples:
              ofertaActualizada:
                summary: Oferta actualizada
                value:
                  data:
                    id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                    entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    presentationTag: Individual
                    basePrice: 185.0
                    status: ACTIVE
                    image:
                      id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                      url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                    composition:
                      slots:
                        - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                          name: Plato principal
                          status: ACTIVE
                          quantity: 1
                          course: plato fuerte
                          options:
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                              sourceType: RECIPE
                              recipeId: c4813f65-00b4-4921-874e-03c555796401
                              status: ACTIVE
                              displayName: Hamburguesa Hawaiana
                            - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                              sourceType: INVENTORY_ITEM
                              inventoryItemId: CARNE-150G
                              status: ACTIVE
                              displayName: Papas
                              quantity: 200
                              unit: g
      '400':
        $ref: ../openapi.yaml#/components/responses/IdempotencyBadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/IdempotencyConflict
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
        description: El ETag de If-Match es obsoleto y no existe un resultado exitoso recuperable para el mismo guardado idempotente.
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '428':
        description: Se requiere el encabezado If-Match para actualizar la oferta.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              faltaIfMatch:
                summary: Encabezado de concurrencia ausente
                value:
                  error:
                    message: El encabezado If-Match es requerido.
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      '502':
        $ref: ../openapi.yaml#/components/responses/InventoryUnavailable
  delete:
    tags: [Ofertas]
    operationId: deleteMenuOffer
    summary: Eliminar una oferta
    description: >-
      Requiere el ETag vigente en If-Match y que la oferta esté INACTIVE. Devuelve
      409 si la oferta no está INACTIVE o si eliminarla deja una entrada ACTIVE
      sin una oferta ACTIVE válida. El rechazo conserva íntegramente la oferta
      y su historia. Si falta If-Match, devuelve 428; si no coincide con el ETag
      vigente, devuelve 412.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    responses:
      '204':
        description: >-
          Oferta eliminada. La respuesta no contiene cuerpo ni encabezado ETag,
          porque no queda una representación vigente del recurso eliminado.
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        description: El estado de la oferta o de su entrada impide eliminarla.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              ofertaNoInactiva:
                summary: La oferta debe estar INACTIVE para eliminarse
                value:
                  error:
                    message: La oferta debe estar INACTIVE para eliminarse.
              entradaSinOfertaActiva:
                summary: La entrada ACTIVE quedaría sin una oferta ACTIVE válida
                value:
                  error:
                    message: No se puede dejar una entrada ACTIVE sin una oferta ACTIVE válida.
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '428':
        description: Se requiere el encabezado If-Match para eliminar la oferta.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              faltaIfMatch:
                summary: Encabezado de concurrencia ausente
