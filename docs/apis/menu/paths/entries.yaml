entries:
  get:
    tags: [Entradas]
    operationId: listMenuEntries
    summary: Listar entradas del catálogo
    description: >-
      Busca entradas por texto, categoría y estado. La búsqueda considera el
      nombre, la descripción y los nombres de categoría; los resultados se
      filtran y paginan en el servidor. Esta consulta administrativa permite
      recuperar entradas INACTIVE y ARCHIVED mediante los filtros y no excluye
      entradas por carecer de ofertas publicables. ACTIVE es un estado
      administrativo; no implica que la entrada sea publicable.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/SearchQuery
      - $ref: ../openapi.yaml#/components/parameters/CategoryFilter
      - $ref: ../openapi.yaml#/components/parameters/EntryStatusQuery
      - $ref: ../openapi.yaml#/components/parameters/Page
      - $ref: ../openapi.yaml#/components/parameters/PageSize
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Página de entradas que coincide con los filtros.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryListResponse
            examples:
              entradasActivas:
                summary: Entradas activas de la primera página
                value:
                  data:
                    - id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categories:
                        - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                          name: Hamburguesas
                      offerCount: 2
                  meta:
                    page: 1
                    pageSize: 12
                    total: 1
                    totalPages: 1
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  post:
    tags: [Entradas]
    operationId: createMenuEntry
    summary: Crear una entrada
    description: >-
      Crea una entrada del catálogo con sus categorías y una imagen obligatoria
      previamente cargada en POST /api/v1/media/images. Envíe data.id de esa
      respuesta como imageId en el cuerpo JSON; esta operación no recibe el
      archivo ni asigna un nuevo identificador de imagen. El backend asigna el
      estado INACTIVE; el cliente no proporciona status. imageId debe identificar
      una imagen existente, válida y accesible al solicitante. Los metadatos y
      las asociaciones de imagen y categorías se validan y persisten de forma
      atómica. La entrada y sus categorías pertenecen al menú provisionado en
      la instalación. Una referencia de imagen inválida, categorías inexistentes
      o de otro menú y cualquier solicitud inválida devuelven 422 sin crear la
      entrada ni aplicar cambios. La carga previa de imagen es una operación
      independiente y no se deshace si falla la creación de la entrada.
      Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica,
      con alcance por usuario autenticado, menú, método POST y ruta concreta. Durante
      24 horas desde la primera creación confirmada, reenviar la misma clave y el mismo
      JSON semántico devuelve el 201, cuerpo y ETag originales, con la misma entrada y
      asociación de imagen; no repite efectos. El orden de propiedades y los espacios
      del JSON no alteran su igualdad; el orden de arrays y la diferencia entre omisión
      y null sí la alteran. Tras autenticar y autorizar al solicitante, el resultado
      guardado se recupera antes de validar los recursos o referencias vigentes,
      incluso si después fueron editados o eliminados. Otra carga JSON con la misma
      clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED; una creación
      todavía en curso devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS
      y Retry-After. La ausencia o invalidez del encabezado devuelve 400.
      Los errores anteriores a la creación confirmada no fijan un resultado y liberan
      la clave para reintentar la misma solicitud. Los reintentos no extienden el plazo;
      después de 24 horas la clave puede tratarse como nueva y ya no garantiza evitar
      duplicados.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogEntryCreateRequest
          examples:
            hamburguesaHawaiana:
              summary: Crear una entrada inactiva con imagen
              value:
                brandName: Hamburguesa Hawaiana
                description: Carne, jamón, queso y piña en pan artesanal.
                categoryIds:
                  - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
    responses:
      '201':
        description: Entrada creada en INACTIVE y asociada con la imagen previamente cargada; un reintento idempotente reproduce el cuerpo y el ETag originales.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryResponse
            examples:
              entradaCreada:
                summary: Entrada creada
                value:
                  data:
                    id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    brandName: Hamburguesa Hawaiana
                    description: Carne, jamón, queso y piña en pan artesanal.
                    status: INACTIVE
                    image:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                    categoryIds:
                      - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
      '400':
        $ref: ../openapi.yaml#/components/responses/IdempotencyBadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '409':
        $ref: ../openapi.yaml#/components/responses/IdempotencyConflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests

entryById:
  parameters:
    - name: entryId
      in: path
      required: true
      description: UUID de la entrada del catálogo.
      schema:
        type: string
        format: uuid
        example: 7d19a8ce-402c-4bab-b383-9969b69fe101
  get:
    tags: [Entradas]
    operationId: getMenuEntry
    summary: Consultar una entrada
    description: Devuelve el detalle de una entrada, incluidos los UUID de sus
      categorías y los datos de la imagen asociada.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Detalle de la entrada.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryResponse
            examples:
              detalleEntrada:
                summary: Detalle de una entrada
                value:
                  data:
                    id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    brandName: Hamburguesa Hawaiana
                    description: Carne, jamón, queso y piña en pan artesanal.
                    status: ACTIVE
                    image:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                    categoryIds:
                      - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  patch:
    tags: [Entradas]
    operationId: patchMenuEntry
    summary: Actualizar una entrada
    description: >-
      Actualiza los campos enviados; los omitidos conservan sus valores. Enviar
      categoryIds reemplaza el conjunto completo de categorías. La entrada y sus
      categorías deben pertenecer al menú provisionado en la instalación.
      Se permite activar o inactivar la entrada, pasar de ACTIVE o INACTIVE a
      ARCHIVED y desarchivar de ARCHIVED a INACTIVE. El paso directo de ARCHIVED
      a ACTIVE devuelve 422. Estas transiciones no alteran los estados de las
      ofertas. Para reemplazar la imagen, envíe imageId en el cuerpo JSON con
      data.id de la respuesta de POST /api/v1/media/images para una imagen
      previamente cargada y validada. Debe existir y ser accesible al solicitante;
      una referencia inválida devuelve 422. Omitir imageId conserva la imagen
      vigente; null se rechaza. Esta operación no recibe archivos ni URLs.
      La validación y persistencia de metadatos y asociaciones de imagen y
      categorías es atómica; un error no aplica cambios parciales y conserva la
      imagen vigente. La carga previa es una operación independiente y no se
      deshace si falla la actualización. Envíe el ETag leído en If-Match:
      su ausencia devuelve 428 y un valor obsoleto devuelve 412, sin modificaciones.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogEntryPatchRequest
          examples:
            actualizarEntrada:
              summary: Cambiar el estado de una entrada
              value:
                status: ACTIVE
            reemplazarImagen:
              summary: Reemplazar únicamente la imagen de una entrada
              value:
                imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
    responses:
      '200':
        description: Entrada actualizada.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryResponse
            examples:
              entradaActualizada:
                summary: Entrada después de la actualización
                value:
                  data:
                    id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    brandName: Hamburguesa Hawaiana
                    description: Carne, jamón, queso y piña en pan artesanal.
                    status: ACTIVE
                    image:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                    categoryIds:
                      - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '428':
        description: Se requiere el encabezado If-Match para actualizar la entrada.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              faltaIfMatch:
                summary: Encabezado de concurrencia ausente
                value:
                  error:
                    message: El encabezado If-Match es requerido.
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  delete:
    tags: [Entradas]
    operationId: deleteMenuEntry
    summary: Eliminar una entrada
    description: >-
      Elimina la entrada y también las ofertas asociadas, preservando el historial
      según las reglas del dominio. La entrada debe estar ARCHIVED; cualquier
      otro estado devuelve 409 sin eliminar la entrada ni sus ofertas. Envíe el
      ETag leído en If-Match para confirmar que la entrada no cambió: su ausencia
      devuelve 428 y un valor obsoleto devuelve 412, sin modificaciones.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    responses:
      '204':
        description: >-
          Entrada y ofertas asociadas eliminadas. La respuesta no contiene cuerpo
          ni encabezado ETag porque no queda una representación vigente del
          recurso eliminado; se preserva el historial según las reglas del dominio.
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        description: La entrada debe estar ARCHIVED para poder eliminarse; no se aplican cambios.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              entradaNoArchivada:
                summary: Entrada en un estado distinto de ARCHIVED
                value:
                  error:
                    message: La entrada debe estar archivada para eliminarse.
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '428':
        description: Se requiere el encabezado If-Match para eliminar la entrada; no se aplican cambios.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorEnvelope
            examples:
              faltaIfMatch:
                summary: Encabezado de concurrencia ausente
                value:
                  error:
                    message: El encabezado If-Match es requerido.
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
