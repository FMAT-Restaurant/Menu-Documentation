entries:
  get:
    tags: [Entradas]
    operationId: listMenuEntries
    x-required-permission:
      - menu:entries:read
    summary: Listar entradas del catálogo
    description: >-
      Consulta administrativa de entradas en cualquier estado administrativo. Sin
      el filtro status se devuelven todas, incluidas las ARCHIVED. q busca en el
      nombre comercial, la descripción y los nombres de las categorías; categoryId
      admite una categoría o __uncategorized__; status filtra por estado
      administrativo. Los resultados se filtran y paginan en el servidor y se
      ordenan alfabéticamente por nombre comercial. isAvailable es la
      disponibilidad derivada y de solo lectura.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/SearchQuery
      - $ref: ../openapi.yaml#/components/parameters/CategoryFilter
      - $ref: ../openapi.yaml#/components/parameters/EntryStatusQuery
      - $ref: ../openapi.yaml#/components/parameters/Page
      - $ref: ../openapi.yaml#/components/parameters/PageSize
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Página de entradas que coincide con los filtros.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryListResponse
            examples:
              entradasActivas:
                summary: Entradas activas de la primera página
                value:
                  data:
                    - id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      isAvailable: true
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categories:
                        - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                          name: Hamburguesas
                      offerCount: 2
                  meta:
                    page: 1
                    pageSize: 12
                    total: 1
                    totalPages: 1
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  post:
    tags: [Entradas]
    operationId: createMenuEntry
    x-required-permission:
      - menu:entries:write
    summary: Crear una entrada
    description: >-
      Crea una entrada del catálogo con sus categorías y una imagen obligatoria
      previamente cargada en POST /menu/media/images. Envíe data.id de esa
      respuesta como imageId en el cuerpo JSON; esta operación no recibe el
      archivo ni asigna un nuevo identificador de imagen. El backend asigna el
      estado INACTIVE; el cliente no proporciona status. categoryIds es
      opcional; sin categorías la entrada pertenece a «sin categoría». imageId
      debe identificar una imagen existente, válida, accesible y no asociada a
      otro recurso: una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED;
      una referencia inexistente o inválida devuelve 422. El identificador queda
      ligado a la entrada y no se cambia después. Los metadatos y las
      asociaciones de imagen y categorías se validan y persisten de forma
      atómica. La entrada y sus categorías pertenecen al menú provisionado en
      la instalación. Categorías inexistentes o de otro menú y cualquier
      solicitud inválida devuelven 422 sin crear la entrada ni aplicar cambios.
      La carga previa de imagen es una operación independiente y no se deshace
      si falla la creación de la entrada.
      Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica,
      con alcance por usuario autenticado, menú, método POST y ruta concreta. Durante
      24 horas desde la primera creación confirmada, reenviar la misma clave y el mismo
      JSON semántico devuelve el 201, cuerpo y ETag originales, con la misma entrada y
      asociación de imagen; no repite efectos. El orden de propiedades y los espacios
      del JSON no alteran su igualdad; el orden de arrays y la diferencia entre omisión
      y null sí la alteran. Tras autenticar y autorizar al solicitante, el resultado
      guardado se recupera antes de validar los recursos o referencias vigentes,
      incluso si después fueron editados o eliminados. Otra carga JSON con la misma
      clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED; una creación
      todavía en curso devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS
      y Retry-After. La ausencia o invalidez del encabezado devuelve 400.
      Los errores anteriores a la creación confirmada no fijan un resultado y liberan
      la clave para reintentar la misma solicitud. Los reintentos no extienden el plazo;
      después de 24 horas la clave puede tratarse como nueva y ya no garantiza evitar
      duplicados.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogEntryCreateRequest
          examples:
            hamburguesaHawaiana:
              summary: Crear una entrada inactiva con imagen
              value:
                brandName: Hamburguesa Hawaiana
                description: Carne, jamón, queso y piña en pan artesanal.
                categoryIds:
                  - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
    responses:
      '201':
        description: Entrada creada en INACTIVE y asociada con la imagen previamente cargada; un reintento idempotente reproduce el cuerpo y el ETag originales.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryResponse
            examples:
              entradaCreada:
                summary: Entrada creada
                value:
                  data:
                    id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    brandName: Hamburguesa Hawaiana
                    description: Carne, jamón, queso y piña en pan artesanal.
                    status: INACTIVE
                    isAvailable: false
                    image:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                    categoryIds:
                      - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
      '400':
        $ref: ../openapi.yaml#/components/responses/IdempotencyBadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '409':
        $ref: ../openapi.yaml#/components/responses/IdempotencyOrDomainConflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests

entryById:
  parameters:
    - name: entryId
      in: path
      required: true
      description: UUID de la entrada del catálogo.
      schema:
        type: string
        format: uuid
        example: 7d19a8ce-402c-4bab-b383-9969b69fe101
  get:
    tags: [Entradas]
    operationId: getMenuEntry
    x-required-permission:
      - menu:entries:read
    summary: Consultar una entrada
    description: Devuelve el detalle de una entrada, incluidos los UUID de sus
      categorías y los datos de la imagen asociada.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Detalle de la entrada.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryResponse
            examples:
              detalleEntrada:
                summary: Detalle de una entrada
                value:
                  data:
                    id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    brandName: Hamburguesa Hawaiana
                    description: Carne, jamón, queso y piña en pan artesanal.
                    status: ACTIVE
                    isAvailable: true
                    image:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                    categoryIds:
                      - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  patch:
    tags: [Entradas]
    operationId: patchMenuEntry
    x-required-permission:
      - menu:entries:write
      - menu:entries:status
    summary: Actualizar una entrada
    description: >-
      Actualiza el nombre comercial, la descripción, las categorías o el estado
      administrativo; los campos omitidos conservan su valor y categoryIds
      reemplaza el conjunto completo. imageId no se acepta: la imagen se cambia
      con PUT /menu/media/images/{imageId}. Transiciones de status: ACTIVE ↔
      INACTIVE, ACTIVE o INACTIVE → ARCHIVED, y ARCHIVED → INACTIVE
      (desarchivar). Una entrada ARCHIVED es de solo lectura: solo acepta el
      cuerpo exacto {"status": "INACTIVE"}; cualquier otro cuerpo devuelve 409
      ENTRY_ARCHIVED sin cambios. Cambiar el estado de la entrada no cambia el de
      sus ofertas. La validación y la persistencia son atómicas. Exige If-Match:
      su ausencia devuelve 428 y un valor obsoleto 412. Un cuerpo sin status
      exige menu:entries:write; un cuerpo con solo status exige
      menu:entries:status; un cuerpo que mezcla status con otros campos exige
      ambos permisos.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CatalogEntryPatchRequest
          examples:
            actualizarEntrada:
              summary: Cambiar el estado de una entrada
              value:
                status: ACTIVE
            desarchivar:
              summary: Desarchivar una entrada archivada
              value:
                status: INACTIVE
            editarDatos:
              summary: Editar nombre y categorías
              value:
                brandName: Hamburguesa Hawaiana Especial
                categoryIds:
                  - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
    responses:
      '200':
        description: Entrada actualizada.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CatalogEntryResponse
            examples:
              entradaActualizada:
                summary: Entrada después de la actualización
                value:
                  data:
                    id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                    brandName: Hamburguesa Hawaiana
                    description: Carne, jamón, queso y piña en pan artesanal.
                    status: ACTIVE
                    isAvailable: true
                    image:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                    categoryIds:
                      - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/DomainConflict
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '428':
        $ref: ../openapi.yaml#/components/responses/PreconditionRequired
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
  delete:
    tags: [Entradas]
    operationId: deleteMenuEntry
    x-required-permission:
      - menu:entries:write
    summary: Eliminar una entrada
    description: >-
      Elimina definitivamente una entrada ARCHIVED; cualquier otro estado
      devuelve 409 ENTRY_NOT_ARCHIVED sin cambios. La eliminación es en cascada:
      elimina todas sus ofertas, también las activas, con su composición, grupos
      de selección y opciones, y elimina la imagen de la entrada y las de sus
      ofertas. Exige If-Match: su ausencia devuelve 428 y un valor obsoleto 412.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    responses:
      '204':
        description: Entrada y ofertas eliminadas; sin cuerpo ni ETag.
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/DomainConflict
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/PreconditionRequired
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
