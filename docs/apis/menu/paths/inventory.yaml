inventoryItems:
  servers:
    - url: https://{inventoryHost}
      variables:
        inventoryHost:
          default: inventory.example.invalid
          description: >-
            Dominio reservado como marcador del host del microservicio de
            Inventario; reemplazarlo por el host de despliegue. La URL base y
            el prefijo de ruta reales de Inventario no están definidos y pueden
            cambiar.
  get:
    tags: [Inventario]
    operationId: searchInventoryItems
    x-required-permission: []
    summary: Consultar artículos del servicio externo de Inventario
    description: >-
      Operación del microservicio externo de Inventario, llamada directamente
      por el frontend para buscar artículos de Inventario por texto con q y
      seleccionarlos en líneas de ingrediente u opciones. El backend de Menu no
      implementa esta ruta. Devuelve una lista plana, sin paginación; el
      contrato documenta id, name y unit, y los demás campos y comportamientos
      se rigen por el contrato de Inventario. La autenticación y la
      autorización de esta ruta las define el servicio de Inventario y no se
      rigen por los permisos de Menu; por eso x-required-permission está
      vacío.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/SearchQuery
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Lista plana de artículos coincidentes, sin paginación.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/InventoryItemListResponse
            examples:
              articulosEncontrados:
                summary: Artículo de inventario encontrado
                value:
                  - id: CARNE-150G
                    name: Carne Molida Res 80/20
                    unit: g
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests

inventoryItemById:
  servers:
    - url: https://{inventoryHost}
      variables:
        inventoryHost:
          default: inventory.example.invalid
          description: >-
            Dominio reservado como marcador del host del microservicio de
            Inventario; reemplazarlo por el host de despliegue. La URL base y
            el prefijo de ruta reales de Inventario no están definidos y pueden
            cambiar.
  parameters:
    - name: id
      in: path
      required: true
      description: Identificador opaco del artículo de Inventario, sin formato impuesto.
      schema:
        type: string
        example: CARNE-150G
  get:
    tags: [Inventario]
    operationId: getInventoryItem
    x-required-permission: []
    summary: Consultar artículo por ID
    description: >-
      Operación del microservicio externo de Inventario para consultar un
      artículo por su identificador. El backend de Menu consulta de forma
      síncrona el artículo en Inventario al crear o modificar opciones
      INVENTORY_ITEM y recetas, y al responder consultas de recetas: si el
      artículo no existe responde 422 y si Inventario no responde, 502. La
      autenticación y la autorización de esta ruta las define el servicio de
      Inventario; x-required-permission está vacío. Lo no documentado aquí se
      rige por el contrato de Inventario.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Artículo de inventario encontrado.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/InventoryItemResponse
            examples:
              articuloEncontrado:
                summary: Artículo de inventario encontrado
                value:
                  data:
                    id: CARNE-150G
                    name: Carne Molida Res 80/20
                    unit: g
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
