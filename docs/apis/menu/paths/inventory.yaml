inventoryItems:
  servers:
    - url: https://{inventoryHost}
      variables:
        inventoryHost:
          default: inventory.example.invalid
          description: >-
            Dominio reservado como marcador del host del microservicio de
            Inventario; reemplazarlo por el host de despliegue. La URL base y
            el prefijo de ruta reales de Inventario no están definidos y pueden
            cambiar.
  get:
    tags: [Inventario]
    operationId: searchInventoryItems
    summary: Consultar artículos del servicio externo de Inventario
    description: >-
      Operación del microservicio externo de Inventario, llamada directamente
      por el frontend para buscar artículos por texto y seleccionar insumos en
      recetas u opciones de composición. El backend de Menu no implementa esta
      ruta; Menu solo conserva referencias de solo lectura a los artículos.
      La búsqueda se hace con el parámetro q. La operación reutiliza un
      endpoint ya existente de Inventario y devuelve una lista plana, sin
      paginación. Cada artículo puede incluir otros campos del servicio de
      Inventario no documentados; el contrato solo documenta id, name y unit,
      y el resto se ignora.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/SearchQuery
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Lista plana de artículos coincidentes, sin paginación.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/InventoryItemListResponse
            examples:
              articulosEncontrados:
                summary: Artículo de inventario encontrado
                value:
                  - id: CARNE-150G
                    name: Carne Molida Res 80/20
                    unit: g
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests

inventoryItemById:
  servers:
    - url: https://{inventoryHost}
      variables:
        inventoryHost:
          default: inventory.example.invalid
          description: >-
            Dominio reservado como marcador del host del microservicio de
            Inventario; reemplazarlo por el host de despliegue. La URL base y
            el prefijo de ruta reales de Inventario no están definidos y pueden
            cambiar.
  parameters:
    - name: id
      in: path
      required: true
      description: Identificador opaco del insumo, sin formato impuesto.
      schema:
        type: string
        example: CARNE-150G
  get:
    tags: [Inventario]
    operationId: getInventoryItem
    summary: Consultar artículo por ID
    description: >-
      Operación del microservicio externo de Inventario, llamada directamente
      por el frontend para consultar un artículo por su identificador. El backend
      de Menu no implementa esta ruta; Menu solo conserva referencias de solo
      lectura a los artículos.
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: Artículo de inventario encontrado.
        headers:
          ETag:
            $ref: ../openapi.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/InventoryItemResponse
            examples:
              articuloEncontrado:
                summary: Artículo de inventario encontrado
                value:
                  data:
                    id: CARNE-150G
                    name: Carne Molida Res 80/20
                    unit: g
      '304':
        $ref: ../openapi.yaml#/components/responses/NotModified
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
