      summary: Crear una entrada
      description: 'Crea una entrada del catálogo con sus categorías y una imagen obligatoria previamente cargada en POST /menu/media/images. Envíe data.id de esa respuesta como imageId en el cuerpo JSON; esta operación no recibe el archivo ni asigna un nuevo identificador de imagen. El backend asigna el estado INACTIVE; el cliente no proporciona status. categoryIds es opcional; sin categorías la entrada pertenece a «sin categoría». imageId debe identificar una imagen existente, válida, accesible y no asociada a otro recurso: una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED; una referencia inexistente o inválida devuelve 422. El identificador queda ligado a la entrada y no se cambia después. Los metadatos y las asociaciones de imagen y categorías se validan y persisten de forma atómica. La entrada y sus categorías pertenecen al menú provisionado en la instalación. Categorías inexistentes o de otro menú y cualquier solicitud inválida devuelven 422 sin crear la entrada ni aplicar cambios. La carga previa de imagen es una operación independiente y no se deshace si falla la creación de la entrada. Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica, con alcance por usuario autenticado, menú, método POST y ruta concreta. Durante 24 horas desde la primera creación confirmada, reenviar la misma clave y el mismo JSON semántico devuelve el 201, cuerpo y ETag originales, con la misma entrada y asociación de imagen; no repite efectos. El orden de propiedades y los espacios del JSON no alteran su igualdad; el orden de arrays y la diferencia entre omisión y null sí la alteran. Tras autenticar y autorizar al solicitante, el resultado guardado se recupera antes de validar los recursos o referencias vigentes, incluso si después fueron editados o eliminados. Otra carga JSON con la misma clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED; una creación todavía en curso devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After. La ausencia o invalidez del encabezado devuelve 400. Los errores anteriores a la creación confirmada no fijan un resultado y liberan la clave para reintentar la misma solicitud. Los reintentos no extienden el plazo; después de 24 horas la clave puede tratarse como nueva y ya no garantiza evitar duplicados.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryCreateRequest'
            examples:
              hamburguesaHawaiana:
