        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/media/images:
    post:
      tags:
        - Imágenes
      operationId: uploadMenuImage
      x-required-permission:
        - menu:images:write
      summary: Subir una imagen
      description: 'Sube el archivo del campo file mediante multipart/form-data. Acepta JPEG, PNG y WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Valida el contenido real y su decodificación, además del tipo declarado. Solo tras validar la carga, el servidor genera el UUID y devuelve data.id, data.url y data.thumbnailUrl. El cliente utiliza data.id como imageId en las solicitudes JSON de creación de entradas y ofertas; el identificador queda ligado al recurso y no se cambia después. La carga y la asociación son operaciones separadas: cargar una imagen no crea una entrada ni una oferta. Una imagen inválida devuelve 422 sin crear una imagen utilizable ni modificar ningún recurso ni imagen existentes. Requiere Idempotency-Key con un UUID generado por el cliente para la carga lógica, delimitado por el sujeto autenticado, el menú, el método POST y la ruta concreta. Durante 24 horas desde la confirmación inicial exitosa, reenviar la misma clave, los mismos bytes del archivo y el mismo tipo de medio declarado en la parte file devuelve el 201, cuerpo y ETag originales, incluidos data.id, data.url y data.thumbnailUrl, sin crear otra imagen ni repetir sus efectos de transformación. La comparación ignora el boundary, el orden de las partes y el nombre del archivo; no compara el multipart completo ni deduplica cargas con claves distintas. Una clave nueva permite una carga independiente aunque el archivo sea idéntico. Cada intento verifica autenticación y autorización antes de recuperar el resultado original y antes de volver a validar la imagen vigente. Un encabezado ausente o inválido devuelve 400 INVALID_IDEMPOTENCY_KEY; cambiar el archivo o su tipo de medio con la misma clave devuelve 409 IDEMPOTENCY_KEY_REUSED. Una carga en proceso o interrumpida cuyo resultado todavía sea incierto devuelve 409 IDEMPOTENCY_IN_PROGRESS con Retry-After hasta confirmar su resultado. El reintento recupera o continúa la misma carga lógica y no crea otra imagen utilizable para esa clave. Un fallo confirmado antes de obtener una imagen utilizable permite reintentar la misma clave y archivo; un resultado incierto no inicia otra operación. Los reintentos no extienden las 24 horas; una clave expirada puede tratarse como nueva y crear otra imagen. La asociación posterior con una entrada u oferta sigue siendo independiente y utiliza su propia clave de operación.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo JPEG, PNG o WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Su contenido real debe ser válido y decodificable, además de coincidir con el tipo declarado.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
            examples:
              archivoDeMenu:
                summary: Archivo de imagen seleccionado para cargar
                value:
                  file: hamburguesa-hawaiana.jpg
      responses:
        '201':
          description: Imagen validada, con UUID y URL disponibles, o reproducción del 201, cuerpo y ETag originales de la misma carga idempotente.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
              examples:
                imagenCargada:
                  summary: Imagen validada con identificador generado por el servidor
                  value:
                    data:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
        '400':
          $ref: '#/components/responses/IdempotencyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/media/images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        description: UUID de la imagen.
        schema:
          type: string
          format: uuid
          example: 55e62412-9249-4db6-8ccb-31f19ea2f501
    get:
      tags:
        - Imágenes
      operationId: getMenuImage
      x-required-permission:
        - menu:images:write
      summary: Consultar una imagen
      description: Devuelve la imagen y su ETag vigente, que se envía en If-Match para reemplazar su archivo. Exige menu:images:write porque solo sirve para preparar ese reemplazo.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Imagen solicitada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
              examples:
                imagen:
                  summary: Imagen consultada
                  value:
                    data:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Imágenes
      operationId: replaceMenuImageFile
      x-required-permission:
        - menu:images:write
      summary: Reemplazar el archivo de una imagen
      description: 'Reemplaza el archivo de la imagen conservando su identificador (RF-IMG-05). El archivo nuevo se recibe en el campo file de multipart/form-data y se valida igual que en la carga: JPEG, PNG o WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px, validando el contenido real y su decodificación. Exige If-Match con el ETag vigente de la imagen: su ausencia devuelve 428 y un ETag obsoleto 412. Un reemplazo aceptado devuelve 200 con el mismo data.id, data.url y data.thumbnailUrl del archivo nuevo y un ETag nuevo; el archivo anterior se elimina. Un archivo inválido devuelve 422 y conserva sin cambios el archivo vigente. Si la imagen pertenece a una entrada archivada o a una oferta de una entrada archivada, devuelve 409 IMAGE_OWNER_ARCHIVED sin cambios. No requiere Idempotency-Key: If-Match impide aplicar dos veces el mismo reemplazo.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo JPEG, PNG o WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Su contenido real debe ser válido y decodificable, además de coincidir con el tipo declarado.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
            examples:
              archivoNuevo:
                summary: Archivo nuevo que reemplaza al vigente
                value:
                  file: hamburguesa-hawaiana-nueva.jpg
      responses:
        '200':
          description: Archivo reemplazado; el identificador no cambia.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
              examples:
                archivoReemplazado:
                  summary: Imagen con el mismo identificador y el archivo nuevo
                  value:
                    data:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana-v2.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-v2-thumb.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DomainConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por un servicio externo con la lista permissions (formato modulo:recurso:accion) que Menu compara con x-required-permission de cada operación.
  schemas:
    PageMeta:
      type: object
      description: Metadatos que indican qué página se devolvió y el tamaño y total de la colección paginada.
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Número de la página devuelta, empezando en 1.
          example: 1
        pageSize:
          type: integer
          minimum: 1
          description: Cantidad solicitada de elementos por página; admite cualquier entero positivo.
          example: 12
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que coinciden con la consulta.
          example: 0
        totalPages:
          type: integer
          minimum: 0
          description: Cantidad total de páginas para el tamaño solicitado.
          example: 0
      example:
        page: 2
        pageSize: 20
        total: 51
        totalPages: 3
    Image:
      type: object
      description: Imagen de una entrada u oferta; su id queda fijo desde la creación del recurso y el archivo se cambia reemplazándolo.
      required:
        - id
        - url
        - thumbnailUrl
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la imagen.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url:
          type: string
          format: uri
          description: URL de la imagen original.
          example: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl:
          type: string
          format: uri
          description: URL de la miniatura de la imagen.
          example: https://cdn.example.com/menu/burger-thumbnail.jpg
      example:
        id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    InventoryItem:
      type: object
      description: Artículo de Inventario según el contrato de Inventario, referenciado por líneas de ingrediente y opciones.
      required:
        - id
        - name
        - unit
      properties:
        id:
          type: string
          description: Identificador opaco del artículo según el contrato de Inventario, sin formato UUID requerido.
          example: CARNE-150G
        name:
          type: string
          description: Nombre del artículo según el contrato de Inventario.
          example: Carne Molida Res 80/20
        unit:
          type: string
          description: Unidad de medida que Inventario establece para el artículo; es la única unidad de las cantidades que Menu referencia.
          example: g
      example:
        id: CARNE-150G
        name: Carne Molida Res 80/20
        unit: g
    Error:
      type: object
      description: Datos del error devuelto por la API.
      required:
        - message
      properties:
        message:
          type: string
          description: Explicación del error para quien consume la API.
        code:
          $ref: '#/components/schemas/DomainErrorCode'
          description: Código de la regla de dominio incumplida, cuando aplica.
        details:
          type: object
          description: Datos adicionales opcionales y específicos de la respuesta de error.
          additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Envoltura estándar de una respuesta de error.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    ValidationErrorEnvelope:
      type: object
      description: Envoltura estándar que contiene un error de validación.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ValidationError'
      example:
        error:
          message: El cuerpo de la solicitud contiene campos no válidos.
          details:
            violations:
              - path: /name
                message: El nombre es obligatorio.
    DomainErrorCode:
      type: string
      description: Código estable de la regla de dominio incumplida. Los códigos de 409 se devuelven en error.code y los de 422 en error.details.violations[].code.
      enum:
        - CATEGORY_NAME_TAKEN
        - ENTRY_ARCHIVED
        - ENTRY_NOT_ARCHIVED
        - OFFER_NOT_INACTIVE
        - IMAGE_ALREADY_ASSOCIATED
        - IMAGE_OWNER_ARCHIVED
        - RECIPE_IN_USE
        - SOURCE_TYPE_IMMUTABLE
        - DUPLICATE_OPTION_CONTENT
        - DUPLICATE_INVENTORY_ITEM
    DomainConflictEnvelope:
      type: object
      description: Rechazo 409 por una regla de dominio; error.code identifica la regla y no se aplican cambios.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
              description: Explicación del error para quien consume la API.
            code:
              type: string
              enum:
                - CATEGORY_NAME_TAKEN
                - ENTRY_ARCHIVED
                - ENTRY_NOT_ARCHIVED
                - OFFER_NOT_INACTIVE
                - IMAGE_ALREADY_ASSOCIATED
                - IMAGE_OWNER_ARCHIVED
                - RECIPE_IN_USE
            details:
              type: object
              additionalProperties: true
      example:
        error:
          message: La entrada está archivada y no admite esta operación.
          code: ENTRY_ARCHIVED
    IdempotencyConflictEnvelope:
      type: object
      description: Rechazo 409 de idempotencia; error.details.code identifica el caso.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - details
          properties:
            message:
              type: string
            details:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - IDEMPOTENCY_KEY_REUSED
                    - IDEMPOTENCY_IN_PROGRESS
      example:
        error:
          message: La clave de idempotencia ya está vinculada a una solicitud diferente.
          details:
            code: IDEMPOTENCY_KEY_REUSED
    ImageUploadResponse:
      type: object
      description: Respuesta de una carga de imagen exitosa.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Image'
    InventoryItemListResponse:
      type: array
      description: Lista plana, sin paginación, de artículos de Inventario que coinciden con la búsqueda `q`. Cada elemento puede traer campos adicionales no documentados que se ignoran; solo interesan `id`, `name` y `unit`.
      items:
        $ref: '#/components/schemas/InventoryItem'
      example:
        - id: CARNE-150G
          name: Carne Molida Res 80/20
          unit: g
    InventoryItemResponse:
      type: object
      description: Respuesta con el artículo de inventario consultado.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/InventoryItem'
      example:
        data:
          id: CARNE-150G
          name: Carne Molida Res 80/20
          unit: g
    Category:
      type: object
      description: Categoría comercial que permite clasificar las entradas del catálogo.
      required:
        - id
        - name
        - entryCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          minLength: 1
          description: Nombre que se muestra para la categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve opcional; si no existe, se omite de la respuesta.
          example: Bebidas frías y preparadas.
        entryCount:
          type: integer
          minimum: 0
