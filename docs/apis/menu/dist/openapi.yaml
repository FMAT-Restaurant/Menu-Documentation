          type: boolean
          readOnly: true
          description: Disponibilidad derivada de la opción según el último estado comunicado por Inventario sobre su contenido.
          example: true
        displayName:
          type: string
          description: Nombre que se muestra para esta opción en el catálogo.
          example: Carne Molida Res 80/20
      example:
        optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
        sourceType: INVENTORY_ITEM
        inventoryItemId: CARNE-150G
        quantity: 150
        displayName: Carne Molida Res 80/20
        status: ACTIVE
        isAvailable: true
    RecipeSlotOptionPatchInput:
      type: object
      description: Datos para actualizar o crear una opción con receta. Con optionId, sourceType debe coincidir con el almacenado (si no, 422 SOURCE_TYPE_IMMUTABLE) y los campos omitidos se conservan; omitir recipeId conserva la receta asignada. Sin optionId crea una opción y requiere displayName y recipeId; status es opcional (por omisión ACTIVE). La opción usa siempre la revisión vigente de la receta; una receta inexistente devuelve 422.
      additionalProperties: false
      required:
        - sourceType
      properties:
        sourceType:
          const: RECIPE
          description: Tipo de origen de esta opción.
        optionId:
          type: string
          format: uuid
          description: Identificador de una opción existente; se omite para crearla.
        displayName:
          type: string
          minLength: 1
          description: Nombre que se muestra para esta opción.
        status:
          $ref: '#/components/schemas/OfferStatus'
        recipeId:
          type: string
          format: uuid
      allOf:
        - if:
            not:
              required:
                - optionId
          then:
            required:
              - displayName
              - recipeId
    InventoryItemSlotOptionPatchInput:
      type: object
      description: Datos para actualizar o crear una opción con un artículo de Inventario. Con optionId, sourceType debe coincidir con el almacenado (422 SOURCE_TYPE_IMMUTABLE) y los campos omitidos se conservan. Sin optionId requiere displayName, inventoryItemId y quantity; status es opcional (por omisión ACTIVE).
      additionalProperties: false
      required:
        - sourceType
      properties:
        sourceType:
          const: INVENTORY_ITEM
          description: Tipo de origen de esta opción.
        optionId:
          type: string
          format: uuid
          description: Identificador de una opción existente; se omite para crearla.
        displayName:
          type: string
          minLength: 1
          description: Nombre que se muestra para esta opción.
        status:
          $ref: '#/components/schemas/OfferStatus'
        inventoryItemId:
          type: string
          description: Identificador opaco del artículo de Inventario como string, sin formato impuesto.
          example: CARNE-150G
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Cantidad positiva expresada en la unidad que Inventario establece para el artículo; la opción no tiene unidad propia. Es distinta del número de rondas del grupo.
      allOf:
        - if:
            not:
              required:
                - optionId
          then:
            required:
              - displayName
              - inventoryItemId
              - quantity
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Página solicitada de la colección, numerada desde 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 2
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Número positivo de elementos solicitado por página. Acepta cualquier entero desde 1; si se omite, se usa 12.
      schema:
        type: integer
        minimum: 1
        default: 12
        example: 20
    SearchQuery:
      name: q
      in: query
      required: false
      description: Texto opcional para buscar coincidencias según los campos descritos por la operación.
      schema:
        type: string
        example: hamburguesa
    CategoryFilter:
      name: categoryId
      in: query
      required: false
      description: UUID de una categoría o el valor reservado __uncategorized__, que selecciona la agrupación «sin categoría» (entradas sin categorías).
      example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
      schema:
        anyOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
          - type: string
            const: __uncategorized__
    EntryIdQuery:
      name: entryId
      in: query
      required: false
      description: Identificador UUID de la entrada cuyas ofertas se consultan.
      schema:
        type: string
        format: uuid
        example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    ExcludeOfferId:
      name: excludeOfferId
      in: query
      required: false
      description: Identificador UUID de una oferta que se excluye de los resultados, por ejemplo la oferta destino al elegir el origen de una copia.
      schema:
        type: string
        format: uuid
        example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    ExcludeArchivedEntries:
      name: excludeArchivedEntries
      in: query
      required: false
      description: Con true excluye las ofertas de entradas archivadas, que no sirven de origen de una copia de composición.
      schema:
        type: boolean
        default: false
        example: true
    EntryStatusQuery:
      name: status
      in: query
      required: false
      description: Filtro administrativo por estado; si se omite, se devuelven entradas en cualquier estado, incluidas las ARCHIVED.
      schema:
        $ref: '#/components/schemas/EntryStatus'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'ETag fuerte de la versión vigente del recurso; obligatorio en toda modificación, cambio de estado, eliminación (PATCH y DELETE) y en el reemplazo del archivo de una imagen (PUT). Su ausencia devuelve 428 y un valor obsoleto 412. En PATCH /menu/offers/{offerId}, un reintento idempotente conserva el If-Match original: si coincide con una solicitud exitosa vigente, se recupera su respuesta antes de reevaluar ese ETag, aunque ya sea obsoleto. Una ejecución nueva valida el ETag contra la versión vigente normalmente.'
      schema:
        type: string
        example: '"v3"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag previamente recibido que se compara durante una consulta condicional.
      schema:
        type: string
        example: '"v3"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'UUID generado por el cliente para una operación lógica; se envía sin comillas. Es obligatorio en POST /menu/categories, POST /menu/entries, POST /menu/entries/{entryId}/offers, POST /menu/recipes, POST /menu/media/images y PATCH /menu/offers/{offerId}. La copia de composición no tiene operación propia: se envía en POST /menu/entries/{entryId}/offers o en PATCH /menu/offers/{offerId}, que ya exigen la clave. PUT /menu/media/images/{imageId} no la requiere. Su ausencia o un formato inválido devuelve 400. Los reintentos deben conservar la clave y los datos originales. Para JSON, la comparación ignora espacios y el orden de las propiedades de objetos; conserva el orden de los arrays y distingue un campo omitido de null. En PATCH de ofertas también se compara el If-Match original; el cliente conserva ambos encabezados y el cuerpo, y una respuesta exitosa vigente se recupera antes de reevaluar el ETag. En la carga multipart de imágenes se comparan los bytes exactos del archivo y el tipo de medio declarado de la parte file; se ignoran el boundary, el orden de las partes y el nombre de archivo. La clave se delimita por el sujeto autenticado, el menú provisionado, el método HTTP y la ruta concreta, incluidos entryId u offerId cuando apliquen. El resultado exitoso se conserva durante 24 horas desde la confirmación inicial; los reintentos no extienden ese plazo. Una clave expirada se trata como nueva y puede crear otro recurso o volver a aplicar una actualización; no debe reutilizarse.'
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        example: 83f34a6a-5611-41dd-b437-a9cb96d932c2
  headers:
    ETag:
      description: ETag fuerte de la versión vigente del recurso devuelto o modificado. Se envía en If-Match para toda modificación, cambio de estado, eliminación o reemplazo del archivo de una imagen, y en If-None-Match para consultas condicionales. En una oferta cubre también su composición.
      schema:
        type: string
        example: '"v3"'
    ContentDisposition:
      description: Presenta la carta imprimible como archivo PDF con un nombre sugerido.
      schema:
        type: string
        example: attachment; filename="carta.pdf"
    CacheControlNoStore:
      description: La carta se genera en cada solicitud con el catálogo del momento y no debe almacenarse.
      schema:
        type: string
        const: no-store
        example: no-store
  responses:
    NotModified:
      description: La representación no cambió desde el ETag indicado.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Unauthorized:
      description: Falta el token de acceso o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              summary: Token de acceso ausente o inválido
              value:
                error:
                  message: Se requiere un token de acceso válido.
    Forbidden:
      description: La credencial no incluye el permiso requerido por la operación (x-required-permission); no se aplican cambios.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              summary: Falta el permiso requerido
              value:
                error:
                  message: No tienes el permiso requerido para esta operación.
    NotFound:
      description: No existe el recurso indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              summary: Recurso inexistente
              value:
                error:
                  message: No se encontró el recurso solicitado.
    ResourceInUse:
      description: La receta está referenciada por una o más opciones de ofertas (RECIPE_IN_USE).
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - code
                  - details
                properties:
                  message:
                    type: string
                    description: Explicación del error para quien consume la API.
                  code:
                    type: string
                    const: RECIPE_IN_USE
                  details:
                    type: object
                    description: Datos específicos del error.
                    required:
                      - offerIds
                    properties:
                      offerIds:
                        type: array
                        description: Identificadores UUID de las ofertas que todavía usan la receta.
                        items:
                          type: string
                          format: uuid
                        example:
                          - 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
                          - 50a4c3d2-8f7e-46b5-94c3-2b1a0f9e8d7c
                    additionalProperties: true
          examples:
            resourceInUse:
              summary: La receta sigue asociada a ofertas
              value:
                error:
                  message: No se puede eliminar la receta mientras una oferta la utilice.
                  code: RECIPE_IN_USE
                  details:
                    offerIds:
                      - 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
                      - 50a4c3d2-8f7e-46b5-94c3-2b1a0f9e8d7c
    PreconditionFailed:
      description: El recurso cambió desde que se obtuvo el ETag indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            preconditionFailed:
              summary: El ETag ya no corresponde a la versión actual
              value:
                error:
                  message: El recurso cambió desde que fue leído.
    PreconditionRequired:
      description: Falta el encabezado If-Match obligatorio en una modificación, cambio de estado, eliminación o reemplazo del archivo de una imagen; no se aplican cambios.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            faltaIfMatch:
              summary: Falta el encabezado If-Match
              value:
                error:
                  message: El encabezado If-Match es requerido.
    UnprocessableEntity:
      description: La validación de los datos de la solicitud falló; esta respuesta representa errores de validación que impiden procesarla.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            unprocessableEntity:
              summary: Datos de solicitud no válidos para la operación
              value:
                error:
                  message: Revisa los datos enviados en la solicitud.
                  details:
                    violations:
                      - path: /name
                        message: El nombre es obligatorio.
            sourceTypeImmutable:
              summary: Se intentó cambiar el sourceType de una opción existente
              value:
                error:
                  message: Revisa los datos enviados en la solicitud.
                  details:
                    violations:
                      - path: /composition/slots/0/options/0/sourceType
                        message: El sourceType de una opción existente no puede cambiar.
                        code: SOURCE_TYPE_IMMUTABLE
            duplicateOptionContent:
              summary: Dos opciones del grupo de selección tienen el mismo contenido
              value:
                error:
                  message: Revisa los datos enviados en la solicitud.
                  details:
                    violations:
                      - path: /composition/slots/0/options/1
                        message: Ya existe una opción con el mismo artículo o la misma receta en el grupo de selección.
                        code: DUPLICATE_OPTION_CONTENT
            duplicateInventoryItem:
              summary: Artículo de Inventario repetido en las líneas de ingrediente
              value:
                error:
                  message: Revisa los datos enviados en la solicitud.
                  details:
                    violations:
                      - path: /ingredients/1/inventoryItemId
                        message: El artículo de Inventario ya figura en otra línea de ingrediente de la receta.
                        code: DUPLICATE_INVENTORY_ITEM
    TooManyRequests:
      description: Se excedió el límite de solicitudes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            tooManyRequests:
              summary: Se alcanzó el límite de solicitudes
              value:
                error:
                  message: Espera antes de volver a enviar solicitudes.
    InventoryUnavailable:
      description: 502 cuando Menu no pudo consultar Inventario para validar los artículos de una creación o modificación, o para leer los datos de artículo de una consulta de recetas. No se aplican cambios. Un artículo que se validó como inexistente devuelve 422, no 502.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            inventoryUnavailable:
              summary: Inventario no disponible para validar la operación
              value:
                error:
                  message: No se pudo consultar Inventario; no se aplicaron cambios.
    IdempotencyBadRequest:
      description: Falta el encabezado Idempotency-Key obligatorio o su valor no tiene el formato UUID requerido; no se crea ni modifica el recurso.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - details
                properties:
                  message:
                    type: string
                  details:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_IDEMPOTENCY_KEY
          examples:
            invalidIdempotencyKey:
              summary: Clave de idempotencia ausente o inválida
              value:
                error:
                  message: Envía Idempotency-Key con un UUID válido.
                  details:
                    code: INVALID_IDEMPOTENCY_KEY
    IdempotencyConflict:
      description: 'La clave vigente ya está vinculada a datos diferentes de solicitud (IDEMPOTENCY_KEY_REUSED): un JSON semánticamente distinto, un If-Match original distinto en PATCH de ofertas, o bytes de archivo o tipo de medio declarado distintos en la carga de imágenes. Una solicitud con la misma clave y los mismos datos que sigue en proceso o cuyo resultado aún es incierto devuelve IDEMPOTENCY_IN_PROGRESS. Ninguno de estos rechazos inicia otra creación ni actualización; no se ejecuta de nuevo una operación con resultado incierto hasta resolver el resultado anterior. Para IDEMPOTENCY_IN_PROGRESS, espere los segundos indicados en Retry-After y reintente con la misma clave y todos los datos originales, incluido If-Match cuando aplique. Para IDEMPOTENCY_KEY_REUSED, recupere los datos originales para reintentar esa operación o use una clave nueva solo si pretende una operación distinta.'
      headers:
        Retry-After:
          description: Segundos antes de reintentar; solo se devuelve para IDEMPOTENCY_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdempotencyConflictEnvelope'
          examples:
            idempotencyKeyReused:
              summary: La clave ya identifica otros datos de solicitud
              value:
                error:
                  message: La clave de idempotencia ya está vinculada a una solicitud diferente.
                  details:
                    code: IDEMPOTENCY_KEY_REUSED
            idempotencyInProgress:
              summary: La misma operación todavía se está procesando
              value:
                error:
                  message: La solicitud con esta clave de idempotencia sigue en proceso.
                  details:
                    code: IDEMPOTENCY_IN_PROGRESS
    DomainConflict:
      description: Una regla de dominio impide la operación; error.code indica cuál y no se aplican cambios.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainConflictEnvelope'
          examples:
            categoryNameTaken:
              summary: Ya existe una categoría con ese nombre
              value:
                error:
                  message: Ya existe una categoría con ese nombre.
                  code: CATEGORY_NAME_TAKEN
            entryArchived:
              summary: La entrada está archivada
              value:
                error:
                  message: La entrada está archivada y no admite esta operación.
                  code: ENTRY_ARCHIVED
            entryNotArchived:
              summary: La entrada no está archivada
              value:
                error:
                  message: Solo se puede eliminar una entrada archivada.
                  code: ENTRY_NOT_ARCHIVED
            offerNotInactive:
              summary: La oferta no está inactiva
              value:
                error:
                  message: Solo se puede eliminar una oferta inactiva.
                  code: OFFER_NOT_INACTIVE
            imageAlreadyAssociated:
              summary: La imagen ya está asociada a otro recurso
              value:
                error:
                  message: La imagen ya está asociada a otra entrada u oferta.
                  code: IMAGE_ALREADY_ASSOCIATED
            imageOwnerArchived:
              summary: La imagen pertenece a una entrada archivada
              value:
                error:
                  message: No se puede reemplazar el archivo de una imagen de una entrada archivada o de sus ofertas.
                  code: IMAGE_OWNER_ARCHIVED
    IdempotencyOrDomainConflict:
      description: 'Conflicto de idempotencia (error.details.code: IDEMPOTENCY_KEY_REUSED o IDEMPOTENCY_IN_PROGRESS) o de una regla de dominio (error.code), según la operación. Ninguno aplica cambios; para IDEMPOTENCY_IN_PROGRESS espere los segundos de Retry-After.'
      headers:
        Retry-After:
          description: Segundos antes de reintentar; solo se devuelve para IDEMPOTENCY_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/IdempotencyConflictEnvelope'
              - $ref: '#/components/schemas/DomainConflictEnvelope'
          examples:
            idempotencyKeyReused:
              summary: La clave ya identifica otros datos de solicitud
              value:
                error:
                  message: La clave de idempotencia ya está vinculada a una solicitud diferente.
                  details:
                    code: IDEMPOTENCY_KEY_REUSED
            idempotencyInProgress:
              summary: La misma operación todavía se está procesando
              value:
                error:
                  message: La solicitud con esta clave de idempotencia sigue en proceso.
                  details:
                    code: IDEMPOTENCY_IN_PROGRESS
            categoryNameTaken:
              summary: Ya existe una categoría con ese nombre
              value:
                error:
                  message: Ya existe una categoría con ese nombre.
                  code: CATEGORY_NAME_TAKEN
            entryArchived:
              summary: La entrada está archivada
              value:
                error:
                  message: La entrada está archivada y no admite esta operación.
                  code: ENTRY_ARCHIVED
            imageAlreadyAssociated:
              summary: La imagen ya está asociada a otro recurso
              value:
                error:
                  message: La imagen ya está asociada a otra entrada u oferta.
                  code: IMAGE_ALREADY_ASSOCIATED
    NotAcceptable:
      description: El encabezado Accept no admite el tipo de medio de la respuesta (application/pdf); no se genera la carta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notAcceptable:
              summary: El cliente no acepta application/pdf
              value:
                error:
                  message: La carta imprimible solo se entrega como application/pdf.
    PrintableMenuPdf:
      description: Carta imprimible en PDF generada con el catálogo del momento; no incluye ETag y Menu no la guarda.
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: Documento PDF de la carta.
          examples:
            cartaPdf:
              summary: Documento PDF de la carta
              value: '%PDF-1.7 …'
