  /menu/entries/{entryId}/offers:
    parameters:
      - name: entryId
        in: path
        required: true
        description: UUID de la entrada a la que pertenecerá la nueva oferta.
        schema:
          type: string
          format: uuid
          example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    post:
      tags:
        - Ofertas
      operationId: createEntryOffer
      x-required-permission:
        - menu:offers:write
      summary: Crear una oferta para una entrada
      description: |-
        Crea una oferta en la entrada indicada con su etiqueta de presentación, precio base, imagen y composición inicial válida. La oferta inicia INACTIVE y se activa después con PATCH. Cada opción nueva admite status opcional; si se omite, inicia ACTIVE. La imagen se carga antes con POST /menu/media/images y su data.id se envía como imageId; una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED y una referencia inexistente o inválida 422. Una entrada archivada devuelve 409 ENTRY_ARCHIVED. Una opción RECIPE se indica solo con recipeId y usa siempre la revisión vigente de la receta; una receta inexistente devuelve 422. En un mismo grupo no se repite el contenido (422 DUPLICATE_OPTION_CONTENT). Si Inventario no responde al validar un artículo, devuelve 502 sin crear la oferta; un artículo inexistente devuelve 422. Copia de composición: para crear la oferta con una copia de otra, consulte la oferta origen con GET /menu/offers/{offerId} y envíe sus grupos y opciones sin slotId ni optionId, conservando el status de cada opción; no se copian el precio base, la etiqueta de presentación ni la imagen, y no se guarda ninguna referencia al origen. Una receta creada antes desde la configuración de una opción (POST /menu/recipes) es una operación independiente y permanece en la biblioteca aunque se rechace la oferta.
        Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica, con alcance por usuario autenticado, menú, método POST y ruta concreta (incluido entryId). Durante 24 horas desde la primera creación confirmada, reenviar la misma clave y el mismo JSON semántico devuelve el 201, cuerpo y ETag originales, con la misma oferta, grupos de selección, opciones e imagen; no repite efectos. El orden de propiedades y los espacios del JSON no alteran su igualdad; el orden de arrays y la diferencia entre omisión y null sí la alteran. Tras autenticar y autorizar al solicitante, el resultado guardado se recupera antes de validar los recursos o referencias vigentes, incluso si después fueron editados o eliminados. Otra carga JSON con la misma clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED; una creación todavía en curso devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After. La ausencia o invalidez del encabezado devuelve 400. Los errores anteriores a la creación confirmada, incluido 502, no fijan un resultado y liberan la clave para reintentar la misma solicitud. Los reintentos no extienden el plazo; después de 24 horas la clave puede tratarse como nueva y ya no garantiza evitar duplicados.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogOfferCreateRequest'
            examples:
              ofertaConReceta:
                summary: Crear una oferta con una opción de receta
                value:
                  presentationTag: Individual
                  basePrice: 185
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Plato principal
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: RECIPE
                            recipeId: c4813f65-00b4-4921-874e-03c555796401
                            displayName: Hamburguesa Hawaiana
              ofertaConInventario:
                summary: Crear una oferta con una opción de artículo de Inventario
                value:
                  presentationTag: Individual
                  basePrice: 180
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Acompañamiento
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: INVENTORY_ITEM
                            inventoryItemId: CARNE-150G
                            quantity: 200
                            displayName: Papas
              ofertaCopiada:
                summary: Crear una oferta con la composición copiada de otra
                value:
                  presentationTag: Doble
                  basePrice: 230
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Plato principal
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: RECIPE
                            recipeId: c4813f65-00b4-4921-874e-03c555796401
                            displayName: Hamburguesa Hawaiana
                            status: ACTIVE
                          - sourceType: INVENTORY_ITEM
                            inventoryItemId: CARNE-150G
                            quantity: 200
                            displayName: Carne extra
                            status: INACTIVE
      responses:
        '201':
          description: Oferta creada; un reintento idempotente reproduce el cuerpo y el ETag de la creación original.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CatalogOfferResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/CatalogOfferDetail'
                          - type: object
                            properties:
                              status:
                                type: string
                                const: INACTIVE
              examples:
                ofertaCreadaConReceta:
                  summary: Oferta creada con una opción de receta
                  value:
                    data:
                      id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      presentationTag: Individual
                      basePrice: 185
                      status: INACTIVE
                      isAvailable: false
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      composition:
                        slots:
                          - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                            name: Plato principal
                            quantity: 1
                            course: plato fuerte
                            isAvailable: true
                            options:
                              - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                                sourceType: RECIPE
                                recipeId: c4813f65-00b4-4921-874e-03c555796401
                                displayName: Hamburguesa Hawaiana
                                status: ACTIVE
                                isAvailable: true
                ofertaCreadaConInventario:
                  summary: Oferta creada con una opción de artículo de Inventario
                  value:
                    data:
                      id: c68f8a31-7f0e-4b4b-a8ed-118da2ce4102
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      presentationTag: Individual
                      basePrice: 180
                      status: INACTIVE
                      isAvailable: false
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      composition:
                        slots:
                          - slotId: c43a9201-0c4b-4f23-9cf8-437ab312e501
                            name: Acompañamiento
                            quantity: 1
                            course: plato fuerte
                            isAvailable: true
                            options:
                              - optionId: 79a1bc24-0d4f-489b-9836-3a60b5c4ed12
                                sourceType: INVENTORY_ITEM
                                inventoryItemId: CARNE-150G
                                quantity: 200
                                displayName: Papas
                                status: ACTIVE
                                isAvailable: true
        '400':
          $ref: '#/components/responses/IdempotencyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
