          example: Individual
        basePrice:
          type: number
          description: Precio base de la oferta.
          example: 180
        imageId:
          type: string
          format: uuid
          description: UUID obligatorio de la imagen previamente cargada, obtenido de data.id en POST /menu/media/images; una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED. No admite null, archivos ni URLs.
          example: 8c3f4365-1d1d-4a85-969a-c6c80757b201
        composition:
          $ref: '#/components/schemas/CompositionInput'
      example:
        presentationTag: Individual
        basePrice: 180
