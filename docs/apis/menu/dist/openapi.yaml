openapi: 3.1.0
info:
  title: API de administración de Menu
  version: 1.0.0
  description: Contrato HTTP para las operaciones de consulta y administración usadas por el frontend. Se organiza por recurso y no define el host de despliegue; las rutas son relativas a una URL base que termina en /api/v1.
  license:
    name: MIT
    url: https://github.com/FMAT-Restaurant/Menu-Documentation/blob/main/LICENSE
  contact:
    name: FMAT Restaurant
servers:
  - url: /api/v1
    description: Prefijo de ruta relativo. El despliegue debe proporcionar el host para formar la URL base completa, que termina en /api/v1.
security:
  - bearerAuth: []
tags:
  - name: Categorías
    description: Administración y consulta de categorías del menú.
  - name: Entradas
    description: Administración y consulta de entradas del catálogo.
  - name: Ofertas
    description: Administración de ofertas y sus composiciones.
  - name: Recetas
    description: Administración y consulta de recetas.
  - name: Inventario
    description: Consulta de artículos usados como fuentes de composición.
  - name: Imágenes
    description: Carga de imágenes utilizadas por entradas y ofertas.
paths:
  /menu/categories:
    get:
      tags:
        - Categorías
      operationId: listMenuCategories
      summary: Listar categorías
      description: Devuelve una página de categorías con el número de entradas asociadas. Use page y pageSize para recorrer la lista; If-None-Match permite reutilizar una respuesta que no haya cambiado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de categorías del menú.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              examples:
                primeraPagina:
                  summary: Categorías de la primera página
                  value:
                    data:
                      - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                        name: Bebidas
                        description: Bebidas frías y preparadas.
                        entryCount: 4
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Categorías
      operationId: createMenuCategory
      summary: Crear una categoría
      description: Crea una categoría para organizar entradas del catálogo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              nuevaCategoria:
                summary: Crear una categoría de postres
                value:
                  name: Postres
                  description: Opciones dulces.
      responses:
        '201':
          description: Categoría creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoriaCreada:
                  summary: Categoría creada
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Postres
                      description: Opciones dulces.
                      entryCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        description: UUID de la categoría que se consultará o modificará.
        schema:
          type: string
          format: uuid
          example: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
    patch:
      tags:
        - Categorías
      operationId: patchMenuCategory
      summary: Actualizar una categoría
      description: Actualiza los campos de la categoría indicados en el cuerpo. Envíe el ETag leído en If-Match para evitar sobrescribir cambios recientes.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
            examples:
              cambiarDescripcion:
                summary: Actualizar nombre y descripción
                value:
                  name: Postres
                  description: Postres y otras opciones dulces.
      responses:
        '200':
          description: Categoría actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoriaActualizada:
                  summary: Categoría después de la actualización
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Postres
                      description: Postres y otras opciones dulces.
                      entryCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Categorías
      operationId: deleteMenuCategory
      summary: Eliminar una categoría
      description: Elimina la categoría y quita su UUID de las entradas asociadas. Envíe el ETag leído en If-Match para confirmar que la categoría no cambió.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Categoría eliminada y referencias retiradas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries:
    get:
      tags:
        - Entradas
      operationId: listMenuEntries
      summary: Listar entradas del catálogo
      description: Busca entradas por texto, categoría y estado. La búsqueda considera el nombre, la descripción y los nombres de categoría; los resultados se filtran y paginan en el servidor.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/EntryStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de entradas que coincide con los filtros.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryListResponse'
              examples:
                entradasActivas:
                  summary: Entradas activas de la primera página
                  value:
                    data:
                      - id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                        brandName: Hamburguesa Hawaiana
                        description: Carne, jamón, queso y piña en pan artesanal.
                        status: ACTIVE
                        image:
                          id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                          url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                          thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                        categories:
                          - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                            name: Hamburguesas
                        offerCount: 2
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Entradas
      operationId: createMenuEntry
      summary: Crear una entrada
      description: Crea una entrada del catálogo con sus categorías y, de forma opcional, una imagen que ya se haya cargado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryCreateRequest'
            examples:
              hamburguesaHawaiana:
                summary: Crear una entrada activa
                value:
                  brandName: Hamburguesa Hawaiana
                  description: Carne, jamón, queso y piña en pan artesanal.
                  status: ACTIVE
                  categoryIds:
                    - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                  imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
      responses:
        '201':
          description: Entrada creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
              examples:
                entradaCreada:
                  summary: Entrada creada
                  value:
                    data:
                      id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categoryIds:
                        - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        description: UUID de la entrada del catálogo.
        schema:
          type: string
          format: uuid
          example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    get:
      tags:
        - Entradas
      operationId: getMenuEntry
      summary: Consultar una entrada
      description: Devuelve el detalle de una entrada, incluidos los UUID de sus categorías y los datos de la imagen asociada, si existe.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Detalle de la entrada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
              examples:
                detalleEntrada:
                  summary: Detalle de una entrada
                  value:
                    data:
                      id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categoryIds:
                        - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Entradas
      operationId: patchMenuEntry
      summary: Actualizar una entrada
      description: Actualiza los campos de la entrada incluidos en el cuerpo. Envíe el ETag leído en If-Match para evitar sobrescribir cambios recientes.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryPatchRequest'
            examples:
              actualizarEntrada:
                summary: Cambiar el estado de una entrada
                value:
                  brandName: Hamburguesa Hawaiana
                  description: Carne, jamón, queso y piña en pan artesanal.
                  status: ACTIVE
                  categoryIds:
                    - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                  imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
      responses:
        '200':
          description: Entrada actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
              examples:
                entradaActualizada:
                  summary: Entrada después de la actualización
                  value:
                    data:
                      id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categoryIds:
                        - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Entradas
      operationId: deleteMenuEntry
      summary: Eliminar una entrada
      description: Elimina la entrada y también las ofertas asociadas. Envíe el ETag leído en If-Match para confirmar que la entrada no cambió.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Entrada y ofertas asociadas eliminadas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/offers:
    get:
      tags:
        - Ofertas
      operationId: listMenuOffers
      summary: Listar ofertas
      description: Devuelve una página de ofertas. Puede limitar los resultados a una entrada y excluir una oferta concreta; la lista se pagina en el servidor.
      parameters:
        - $ref: '#/components/parameters/EntryIdQuery'
        - $ref: '#/components/parameters/ExcludeOfferId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de ofertas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOfferListResponse'
              examples:
                ofertasDeEntrada:
                  summary: Ofertas de una entrada del catálogo
                  value:
                    data:
                      - id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                        entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                        entryName: Hamburguesa Hawaiana
                        presentationTag: Individual
                        basePrice: 180
                        status: ACTIVE
                        image:
                          id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                          url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                          thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                        slotCount: 1
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries/{entryId}/offers:
    parameters:
      - name: entryId
        in: path
        required: true
        description: UUID de la entrada a la que pertenecerá la nueva oferta.
        schema:
          type: string
          format: uuid
          example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    post:
      tags:
        - Ofertas
      operationId: createEntryOffer
      summary: Crear una oferta para una entrada
      description: Crea una oferta asociada a la entrada indicada en la ruta. La composición define los espacios de selección y sus opciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogOfferCreateRequest'
            examples:
              ofertaIndividual:
                summary: Crear una oferta individual sin composición inicial
                value:
                  presentationTag: Individual
                  basePrice: 180
                  status: INACTIVE
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots: []
      responses:
        '201':
          description: Oferta creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOfferResponse'
              examples:
                ofertaCreada:
                  summary: Oferta creada
                  value:
                    data:
                      id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      presentationTag: Individual
                      basePrice: 180
                      status: INACTIVE
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      composition:
                        slots: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No existe la entrada asociada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                entradaNoEncontrada:
                  summary: La entrada indicada no existe
                  value:
                    error:
                      message: No se encontró la entrada indicada.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/offers/{offerId}:
    parameters:
      - name: offerId
        in: path
        required: true
        description: UUID de la oferta que se consultará o modificará.
        schema:
          type: string
          format: uuid
          example: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
    get:
      tags:
        - Ofertas
      operationId: getMenuOffer
      summary: Consultar una oferta y su composición
      description: Devuelve los datos de la oferta y su composición. Cada opción incluye el tipo y UUID de su origen; source contiene la referencia de solo lectura del recurso de origen.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Detalle de la oferta, incluida su composición.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOfferResponse'
              examples:
                ofertaConReceta:
                  summary: Oferta con un espacio de receta
                  value:
                    data:
                      id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      presentationTag: Individual
                      basePrice: 180
                      status: ACTIVE
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      composition:
                        slots:
                          - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                            name: Plato principal
                            required: true
                            quantity: 1
                            course: Plato fuerte
                            options:
                              - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                                sourceType: RECIPE
                                recipeId: c4813f65-00b4-4921-874e-03c555796401
                                inventoryItemId: null
                                displayName: Hamburguesa Hawaiana
                                source:
                                  id: c4813f65-00b4-4921-874e-03c555796401
                                  name: Hamburguesa Hawaiana
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Ofertas
      operationId: patchMenuOffer
      summary: Actualizar una oferta
      description: Actualiza los campos incluidos en el cuerpo y requiere el ETag vigente en If-Match. Si incluye composition, el contrato fuente no define si sus slots se fusionan o se sustituyen.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogOfferPatchRequest'
            examples:
              actualizarComposicion:
                summary: Actualizar datos de precio y composición
                value:
                  presentationTag: Individual
                  basePrice: 185
                  status: ACTIVE
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                        name: Plato principal
                        required: true
                        quantity: 1
                        course: Plato fuerte
                        options:
                          - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                            sourceType: RECIPE
                            recipeId: c4813f65-00b4-4921-874e-03c555796401
                            displayName: Hamburguesa Hawaiana
      responses:
        '200':
          description: Oferta actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOfferResponse'
              examples:
                ofertaActualizada:
                  summary: Oferta actualizada
                  value:
                    data:
                      id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      presentationTag: Individual
                      basePrice: 185
                      status: ACTIVE
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
