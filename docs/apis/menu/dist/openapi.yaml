  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Página solicitada de la colección, numerada desde 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 2
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Número positivo de elementos solicitado por página. Acepta cualquier entero desde 1; si se omite, se usa 12.
      schema:
        type: integer
        minimum: 1
        default: 12
        example: 20
    SearchQuery:
      name: q
      in: query
      required: false
      description: Texto opcional para buscar coincidencias según los campos descritos por la operación.
      schema:
        type: string
        example: hamburguesa
    CategoryFilter:
      name: categoryId
      in: query
      required: false
      description: UUID de categoría o el token reservado para entradas sin categoría.
      example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
      schema:
        anyOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
          - type: string
            const: __uncategorized__
    EntryIdQuery:
      name: entryId
      in: query
      required: false
      description: Identificador UUID de la entrada cuyas ofertas se consultan.
      schema:
        type: string
        format: uuid
        example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    ExcludeOfferId:
      name: excludeOfferId
      in: query
      required: false
      description: Identificador UUID de la oferta que se excluye de los resultados.
      schema:
        type: string
        format: uuid
        example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    EntryStatusQuery:
      name: status
      in: query
      required: false
      description: Estado por el que se filtran las entradas.
      schema:
        $ref: '#/components/schemas/EntryStatus'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión del recurso leída por el cliente; se envía para una actualización condicional.
      schema:
        type: string
        example: W/"rev-3"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag previamente recibido que se compara durante una consulta condicional.
      schema:
        type: string
        example: W/"rev-3"
  headers:
    ETag:
      description: Validador de la representación devuelta o modificada.
      schema:
        type: string
  responses:
    NotModified:
      description: La representación no cambió desde el ETag indicado.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Unauthorized:
      description: Falta el token de acceso o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              summary: Token de acceso ausente o inválido
              value:
                error:
                  message: Se requiere un token de acceso válido.
    Forbidden:
      description: El token no tiene permiso para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              summary: El token no permite la operación
              value:
                error:
                  message: No tienes permiso para realizar esta operación.
    NotFound:
      description: No existe el recurso indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              summary: Recurso inexistente
              value:
                error:
                  message: No se encontró el recurso solicitado.
    ResourceInUse:
      description: La receta está referenciada por una o más ofertas.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - details
                properties:
                  message:
                    type: string
                    description: Explicación del error para quien consume la API.
                  details:
                    type: object
                    description: Datos específicos del error.
                    required:
                      - offerIds
                    properties:
                      offerIds:
                        type: array
                        description: Identificadores UUID de las ofertas que todavía usan la receta.
                        items:
                          type: string
                          format: uuid
                        example:
                          - 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
                          - 50a4c3d2-8f7e-46b5-94c3-2b1a0f9e8d7c
                    additionalProperties: true
          examples:
            resourceInUse:
              summary: La receta sigue asociada a ofertas
              value:
                error:
                  message: No se puede eliminar la receta mientras una oferta la utilice.
                  details:
                    offerIds:
                      - 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
                      - 50a4c3d2-8f7e-46b5-94c3-2b1a0f9e8d7c
    PreconditionFailed:
      description: El recurso cambió desde que se obtuvo el ETag indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            preconditionFailed:
              summary: El ETag ya no corresponde a la versión actual
              value:
                error:
                  message: El recurso cambió desde que fue leído.
    UnprocessableEntity:
      description: La validación de los datos de la solicitud falló; esta respuesta representa errores de validación que impiden procesarla.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            unprocessableEntity:
              summary: Datos de solicitud no válidos para la operación
              value:
                error:
                  message: Revisa los datos enviados en la solicitud.
                  details:
                    violations:
                      - path: /name
                        message: El nombre es obligatorio.
    TooManyRequests:
      description: Se excedió el límite de solicitudes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            tooManyRequests:
              summary: Se alcanzó el límite de solicitudes
              value:
                error:
                  message: Espera antes de volver a enviar solicitudes.
