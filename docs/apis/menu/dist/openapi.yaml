    patch:
      tags:
        - Ofertas
      operationId: patchMenuOffer
      x-required-permission:
        - menu:offers:write
        - menu:offers:status
      summary: Actualizar una oferta
      description: |-
        Actualiza parcialmente la oferta y su composición en una sola operación atómica; la oferta es la raíz del agregado y su ETag protege también la composición. Todos los campos son opcionales; los omitidos se conservan. imageId no se acepta: la imagen se cambia con PUT /menu/media/images/{imageId}. Enviar composition.slots reemplaza la lista completa de grupos: los grupos vigentes que no aparecen se eliminan con sus opciones. Enviar options en un grupo reemplaza la lista completa de opciones de ese grupo: las opciones vigentes que no aparecen se eliminan. Omitir slots u options conserva la lista vigente; dentro de un grupo u opción existente, identificado por slotId u optionId, los campos omitidos se conservan. Los grupos y opciones nuevos se envían sin identificador. El orden de los arrays es el orden de presentación y el de las rondas. Se rechazan con 422 las listas vacías, los identificadores desconocidos, ajenos o duplicados, un sourceType distinto del almacenado en una opción existente (SOURCE_TYPE_IMMUTABLE) y el contenido repetido en un grupo (DUPLICATE_OPTION_CONTENT). Activar la oferta (status ACTIVE) exige una composición válida, que toda oferta mantiene, y no exige disponibilidad; ningún proceso reactiva una oferta inactivada. Cualquier PATCH sobre una oferta de una entrada archivada devuelve 409 ENTRY_ARCHIVED. Una opción RECIPE usa siempre la revisión vigente de su receta; omitir recipeId en una opción RECIPE existente conserva la receta asignada. Si Inventario no responde al validar un artículo, devuelve 502 sin cambios; un artículo inexistente devuelve 422. Copia de composición: para agregar a esta oferta una copia de otra, consulte la oferta origen con GET /menu/offers/{offerId} y envíe en composition.slots los grupos vigentes que desea conservar (con slotId) junto con los grupos y opciones del origen sin identificadores, conservando el status de cada opción; no se copian el precio base, la etiqueta de presentación ni la imagen, y no se guarda ninguna referencia al origen.
        Cuenta como cambio de estado el `status` de la oferta o el `status` de una opción existente (con `optionId`); el `status` de una opción nueva forma parte de su alta. Un cuerpo sin cambios de estado exige `menu:offers:write`; un cuerpo con solo cambios de estado exige `menu:offers:status`; un cuerpo que los mezcla con otros cambios exige ambos permisos.
        Requiere Idempotency-Key, un UUID generado por el cliente para este guardado lógico, además de If-Match. La clave se delimita por el sujeto autenticado, el menú, el método PATCH y la ruta concreta de la oferta. Los reintentos conservan la clave, el JSON y el If-Match originales. La comparación ignora espacios y orden de propiedades JSON; conserva el orden de arrays y distingue omisión de null. Tras autenticar y autorizar, un resultado exitoso con la misma solicitud se recupera antes de volver a comprobar el ETag o las referencias vigentes. Durante 24 horas desde la confirmación inicial devuelve el 200, cuerpo y ETag originales, incluidos los IDs generados, sin repetir la actualización, aunque después se haya editado o eliminado la oferta. Cambiar el JSON o el If-Match bajo la misma clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED. Una solicitud en proceso o cuyo resultado aún no se ha confirmado devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After; no se inicia otra actualización hasta confirmar el resultado anterior. La ausencia o invalidez de Idempotency-Key devuelve 400. If-Match sigue siendo obligatorio: omitirlo devuelve 428; sin un resultado exitoso recuperable, un ETag obsoleto devuelve 412. Un fallo confirmado anterior a la persistencia, incluido 502, no aplica cambios ni conserva un resultado exitoso y permite reintentar los mismos datos y headers. Los reintentos no extienden las 24 horas; una clave expirada se trata como nueva. Antes de reenviar un guardado incierto con una clave expirada, consulte y reconcilie el estado actual para evitar repetir la actualización.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogOfferPatchRequest'
            examples:
              actualizarComposicion:
                summary: Conservar dos grupos de selección y actualizar parcialmente las opciones del segundo
                value:
                  composition:
                    slots:
                      - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                      - slotId: b37c1bd7-17b2-47a2-a3a4-802559445302
                        options:
                          - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                            sourceType: RECIPE
                            status: INACTIVE
                          - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5402
                            sourceType: INVENTORY_ITEM
              agregarSlot:
                summary: Conservar un grupo de selección existente y agregar uno nuevo
                value:
                  composition:
                    slots:
                      - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                      - name: Acompañamiento
                        quantity: 1
                        options:
                          - displayName: Papas
                            sourceType: INVENTORY_ITEM
