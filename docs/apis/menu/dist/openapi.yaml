openapi: 3.1.0
info:
  title: API de Menu y referencia externa de Inventario
  version: 8.0.0
  description: |-
    Contrato HTTP del servicio Menu, alineado con la ERS 3.2.0, con referencias a las consultas externas de Inventario. Las operaciones de Menu se organizan por recurso bajo el prefijo /menu y sus rutas son relativas a una URL base que termina en /api/v1; el contrato no define el host de despliegue. El frontend llama directamente al microservicio de Inventario para /items y /items/{id}; el backend de Menu no implementa esas rutas. InventoryItem.id e inventoryItemId son strings opacos sin formato impuesto.

    Permisos. La credencial Bearer es un JWT emitido por un servicio externo que incluye la lista permissions con valores de formato modulo:recurso:accion. Cada operación declara en x-required-permission los permisos que exige; sin el permiso requerido se responde 403 sin aplicar cambios. En PATCH /menu/entries/{entryId} y PATCH /menu/offers/{offerId} la lista contiene el permiso de gestión y el de estado: un cuerpo sin cambios de estado exige el de gestión, uno con solo cambios de estado exige el de estado y uno que los mezcla exige ambos. Menu no autentica a quien solicita ni asigna permisos.

    Estado y disponibilidad. status es el estado administrativo y solo lo cambia el administrador: ACTIVE, INACTIVE o ARCHIVED en entradas, y ACTIVE o INACTIVE en ofertas y opciones; los grupos de selección no tienen estado. isAvailable es la disponibilidad derivada, de solo lectura, que el servidor recalcula en entradas, ofertas, grupos de selección y opciones a partir de los eventos de Inventario y de la composición. Una oferta es ordenable si ella y su entrada están ACTIVE y ambas tienen isAvailable true. Ningún cambio de disponibilidad modifica status. Las entradas y las ofertas nuevas inician INACTIVE.

    Imágenes. Se cargan antes con POST /menu/media/images (multipart/form-data) y se asocian con imageId, obligatorio al crear entradas y ofertas. imageId es inmutable: los PATCH no lo aceptan y la imagen se cambia reemplazando su archivo con PUT /menu/media/images/{imageId}, que conserva el identificador. Una imagen pertenece a un solo recurso; asociar una imagen ya asociada devuelve 409 IMAGE_ALREADY_ASSOCIATED.

    Composición. Una opción RECIPE se indica solo con recipeId y usa siempre la revisión vigente de la receta. La cantidad de una opción INVENTORY_ITEM y la de una línea de ingrediente se expresan en la unidad que Inventario establece para el artículo, sin unidad propia; quantity de un grupo de selección es su número de rondas. Una opción nueva puede indicar status y, si lo omite, inicia ACTIVE. La copia de composición no tiene operación propia: el cliente consulta la oferta origen y envía sus grupos y opciones sin identificadores, con su status, en el POST de la oferta nueva o en el PATCH de la oferta destino; las opciones copiadas conservan así su estado. Un solo ETag de la oferta protege la oferta y su composición.

    Concurrencia y eliminación. Hay DELETE en categorías, entradas, ofertas y recetas, con las condiciones de cada operación. Toda modificación, cambio de estado, eliminación o reemplazo del archivo de una imagen exige If-Match con el ETag fuerte vigente: su ausencia devuelve 428 y un ETag obsoleto devuelve 412, sin cambios. Las respuestas 204 no incluyen cuerpo ni ETag.

    Idempotencia. Los POST de categorías, entradas, ofertas para una entrada, recetas e imágenes (POST /menu/media/images) y PATCH /menu/offers/{offerId} requieren Idempotency-Key. Durante 24 horas desde la primera confirmación exitosa, la misma clave y solicitud recuperan el estado HTTP original (201 en creaciones y 200 en PATCH), el cuerpo y el ETag, sin repetir efectos, generar otros identificadores ni asociar otra imagen. La carga de imagen compara los bytes del archivo y el tipo de medio declarado de la parte file, ignorando boundary, nombre de archivo y orden de partes. El PATCH conserva también el If-Match original: tras autenticar y autorizar, un reintento coincidente recupera su respuesta antes de validar otra vez el ETag vigente. Una clave ausente o inválida devuelve 400; datos diferentes, incluido If-Match en PATCH, devuelven 409 IDEMPOTENCY_KEY_REUSED; una operación en curso o con resultado incierto devuelve 409 IDEMPOTENCY_IN_PROGRESS con Retry-After.

    Errores. Los rechazos por reglas de dominio incluyen error.code en 409 y error.details.violations[].code en 422, con los valores de DomainErrorCode. Si Menu no puede consultar Inventario para validar artículos o para leer los datos de artículo de una receta, devuelve 502 sin aplicar cambios.

    Eventos. Los eventos entre Menu e Inventario no forman parte de este contrato HTTP; su contrato queda pendiente en OPEN-011 de la ERS.
  license:
    name: MIT
    url: https://github.com/FMAT-Restaurant/Menu-Documentation/blob/main/LICENSE
  contact:
    name: FMAT Restaurant
servers:
  - url: /api/v1
    description: Prefijo de ruta relativo. El despliegue debe proporcionar el host para formar la URL base completa, que termina en /api/v1.
security:
  - bearerAuth: []
tags:
  - name: Catálogo
    description: Consulta del catálogo visible para quien consulta y generación de la carta imprimible en PDF.
  - name: Categorías
    description: Administración y consulta administrativa de categorías del menú.
  - name: Entradas
    description: Administración y consulta administrativa de entradas del catálogo.
  - name: Ofertas
    description: Administración y consulta administrativa de ofertas y su composición.
  - name: Recetas
    description: Administración y consulta de la biblioteca de recetas y de su historial de revisiones.
  - name: Imágenes
    description: Carga de imágenes de entradas y ofertas y reemplazo de su archivo.
  - name: Inventario
    description: Referencia al servicio externo de Inventario; el frontend consulta allí los artículos de Inventario usados en opciones y recetas, no en el backend de Menu.
paths:
  /menu/catalog:
    get:
      tags:
        - Catálogo
      operationId: getMenuCatalog
      x-required-permission:
        - menu:catalog:read
      summary: Consultar las entradas del catálogo visible
      description: 'Devuelve una página de las entradas ACTIVE visibles para quien consulta (RF-CONS-01, RF-CONS-03), ordenadas alfabéticamente por nombre comercial; la respuesta no se organiza en secciones. Cada entrada incluye sus categoryIds, sus ofertas ACTIVE en orden alfabético por etiqueta de presentación y, en cada oferta, su composición con los grupos de selección en el orden de presentación, su tiempo de servicio y solo las opciones ACTIVE. Las entradas, ofertas, grupos y opciones incluyen isAvailable: lo no disponible se presenta deshabilitado. Una entrada ACTIVE sin ofertas ACTIVE aparece con offers vacío e isAvailable false. q busca en nombre comercial, descripción y nombres de categoría. categoryId limita la página a las entradas de esa categoría; con __uncategorized__, a las entradas sin categorías; un categoryId inexistente devuelve una página vacía. Lo INACTIVE o ARCHIVED no se incluye. Las categorías se consultan con GET /menu/catalog/categories.'
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de entradas del catálogo visible para quien consulta.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryPageResponse'
              examples:
                catalogo:
                  summary: Página con una entrada sin categorías ni ofertas ACTIVE y otra disponible
                  value:
                    data:
                      - id: 3f6a2c1e-8b4d-4e2a-9c7f-1a2b3c4d5e01
                        brandName: Agua de Jamaica
                        description: Agua fresca de flor de jamaica.
                        image:
                          id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c01
                          url: https://cdn.example.com/menu/agua-jamaica.jpg
                          thumbnailUrl: https://cdn.example.com/menu/agua-jamaica-thumb.jpg
                        categoryIds: []
                        isAvailable: false
                        offers: []
                      - id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                        brandName: Hamburguesa Hawaiana
                        description: Carne, jamón, queso y piña en pan artesanal.
                        image:
                          id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                          url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                          thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                        categoryIds:
                          - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                        isAvailable: true
                        offers:
                          - id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                            presentationTag: Individual
                            basePrice: 180
                            image:
                              id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                              url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                              thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                            isAvailable: true
                            composition:
                              slots:
                                - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                                  name: Plato principal
                                  quantity: 1
                                  course: plato fuerte
                                  isAvailable: true
                                  options:
                                    - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                                      displayName: Hamburguesa Hawaiana
                                      isAvailable: true
                    meta:
                      page: 1
                      pageSize: 12
                      total: 2
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/catalog/categories:
    get:
      tags:
        - Catálogo
      operationId: listMenuCatalogCategories
      x-required-permission:
        - menu:catalog:read
      summary: Consultar las categorías del catálogo visible
      description: Devuelve, sin paginar, todas las categorías del menú en orden alfabético, también las que no clasifican entradas (RF-CONS-01). entryCount es el número de entradas ACTIVE que clasifica cada categoría, es decir, las que ve quien consulta; uncategorized.entryCount es el número de entradas ACTIVE sin categorías (agrupación «sin categoría»).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Categorías del catálogo visible para quien consulta.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoryListResponse'
              examples:
                categorias:
                  summary: Una categoría con entradas, otra vacía y entradas sin categoría
                  value:
                    data:
                      - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                        name: Hamburguesas
                        description: Hamburguesas en pan artesanal.
                        entryCount: 1
                      - id: 5b1e8f3a-6c2d-4e7f-9a0b-1c2d3e4f5a60
                        name: Postres
                        entryCount: 0
                    uncategorized:
                      entryCount: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/catalog/printable:
    get:
      tags:
        - Catálogo
      operationId: getPrintableMenu
      x-required-permission:
        - menu:catalog:print
      summary: Generar la carta imprimible
      description: 'Genera bajo demanda la carta imprimible en PDF con el estado del catálogo en el momento de la solicitud (RF-CONS-06); Menu no la guarda y cada solicitud genera una carta nueva, sin modificar ningún recurso. Contenido (RF-CONS-07): solo las entradas ACTIVE con al menos una oferta ACTIVE y, de cada una, solo sus ofertas ACTIVE; la disponibilidad no interviene ni se muestra. Cada entrada muestra su nombre comercial, descripción e imagen; cada oferta, bajo su entrada, su etiqueta de presentación, que forma su nombre visible, su precio base y su imagen; no se muestra la composición. El encabezado muestra el nombre del menú, la fecha de generación y la moneda, cuyo origen queda pendiente en OPEN-001. Organización (RF-CONS-08): una sección por categoría en orden alfabético; se omiten las secciones sin entradas incluidas; las entradas sin categorías figuran en la sección «sin categoría», después de las demás; dentro de cada sección, las entradas van en orden alfabético por nombre comercial y una entrada con varias categorías figura en cada una; las ofertas van en orden alfabético por etiqueta de presentación. La respuesta es application/pdf con Content-Disposition y Cache-Control: no-store, sin ETag; si Accept no admite application/pdf devuelve 406.'
      responses:
        '200':
          $ref: '#/components/responses/PrintableMenuPdf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/categories:
    get:
      tags:
        - Categorías
      operationId: listMenuCategories
      x-required-permission:
        - menu:categories:read
      summary: Listar categorías
      description: Devuelve una página de categorías con el número de entradas asociadas. Use page y pageSize para recorrer la lista; If-None-Match permite reutilizar una respuesta que no haya cambiado. Las categorías se devuelven en orden alfabético por nombre. entryCount cuenta todas las entradas que clasifica la categoría, en cualquier estado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de categorías del menú.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              examples:
                primeraPagina:
                  summary: Categorías de la primera página
                  value:
                    data:
                      - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                        name: Bebidas
                        description: Bebidas frías y preparadas.
                        entryCount: 4
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Categorías
      operationId: createMenuCategory
      x-required-permission:
        - menu:categories:write
      summary: Crear una categoría
      description: 'Crea una categoría para organizar entradas del catálogo. El nombre es único en el menú: se compara sin distinguir mayúsculas de minúsculas ni acentos y sin los espacios del inicio y del final; un nombre ya usado devuelve 409 CATEGORY_NAME_TAKEN. Requiere Idempotency-Key con un UUID generado por el cliente por operación; su alcance es el sujeto autenticado, el menú, el método POST y la ruta concreta. Durante 24 horas desde la confirmación inicial exitosa, la misma clave y el mismo JSON semántico recuperan el 201, cuerpo, ETag e identificador originales sin crear otra categoría. La comparación ignora espacios y orden de propiedades; conserva el orden de arrays y distingue omisión de null. Cada intento verifica autenticación y autorización antes de recuperar el resultado, que se devuelve antes de revalidar referencias o reglas vigentes, incluso si la categoría fue editada o eliminada posteriormente. Un encabezado ausente o inválido devuelve 400 INVALID_IDEMPOTENCY_KEY; otros datos con la misma clave devuelven 409 IDEMPOTENCY_KEY_REUSED. Una operación en curso o de resultado todavía incierto devuelve 409 IDEMPOTENCY_IN_PROGRESS con Retry-After; no inicia otra creación hasta confirmar el resultado anterior. Los fallos confirmados antes de guardar no conservan un resultado exitoso y permiten reintentar la misma clave y datos. Los reintentos no extienden las 24 horas; una clave expirada puede tratarse como nueva y crear un duplicado.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              nuevaCategoria:
                summary: Crear una categoría de postres
                value:
                  name: Postres
                  description: Opciones dulces.
      responses:
        '201':
          description: Categoría creada, o reproducción del 201, cuerpo y ETag originales de la misma operación idempotente.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoriaCreada:
                  summary: Categoría creada
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Postres
                      description: Opciones dulces.
                      entryCount: 0
        '400':
          $ref: '#/components/responses/IdempotencyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyOrDomainConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        description: UUID de la categoría que se consultará o modificará.
        schema:
          type: string
          format: uuid
          example: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
    get:
      tags:
        - Categorías
      operationId: getMenuCategory
      x-required-permission:
        - menu:categories:read
      summary: Consultar una categoría
      description: Devuelve la categoría solicitada; entryCount cuenta todas las entradas que clasifica la categoría, en cualquier estado. La respuesta incluye el ETag fuerte vigente de esta categoría; el cliente puede enviarlo en If-Match al actualizar o eliminar este mismo recurso.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Categoría solicitada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoria:
                  summary: Categoría consultada
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Bebidas
                      description: Bebidas frías y preparadas.
                      entryCount: 4
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Categorías
      operationId: patchMenuCategory
      x-required-permission:
        - menu:categories:write
      summary: Actualizar una categoría
      description: 'Actualiza el nombre o la descripción de la categoría; los campos omitidos se conservan y una descripción vacía la elimina. El nuevo nombre cumple la misma unicidad que al crear (409 CATEGORY_NAME_TAKEN). Exige If-Match con el ETag vigente: su ausencia devuelve 428 y un valor obsoleto 412, sin cambios.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
            examples:
              cambiarDescripcion:
                summary: Actualizar nombre y descripción
                value:
                  name: Postres
                  description: Postres y otras opciones dulces.
      responses:
        '200':
          description: Categoría actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoriaActualizada:
                  summary: Categoría después de la actualización
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Postres
                      description: Postres y otras opciones dulces.
                      entryCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DomainConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Categorías
      operationId: deleteMenuCategory
      x-required-permission:
        - menu:categories:write
      summary: Eliminar una categoría
      description: 'Elimina la categoría; la eliminación se permite siempre. Las entradas que clasificaba dejan de pertenecer a ella sin otro cambio y, si era su única categoría, pasan a la agrupación «sin categoría». Exige If-Match: su ausencia devuelve 428 y un valor obsoleto 412.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Categoría eliminada; sin cuerpo ni ETag.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries:
    get:
      tags:
        - Entradas
      operationId: listMenuEntries
      x-required-permission:
        - menu:entries:read
      summary: Listar entradas del catálogo
      description: Consulta administrativa de entradas en cualquier estado administrativo. Sin el filtro status se devuelven todas, incluidas las ARCHIVED. q busca en el nombre comercial, la descripción y los nombres de las categorías; categoryId admite una categoría o __uncategorized__; status filtra por estado administrativo. Los resultados se filtran y paginan en el servidor y se ordenan alfabéticamente por nombre comercial. isAvailable es la disponibilidad derivada y de solo lectura.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/EntryStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de entradas que coincide con los filtros.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryListResponse'
              examples:
                entradasActivas:
                  summary: Entradas activas de la primera página
                  value:
                    data:
                      - id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                        brandName: Hamburguesa Hawaiana
                        description: Carne, jamón, queso y piña en pan artesanal.
                        status: ACTIVE
                        isAvailable: true
                        image:
                          id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                          url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                          thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                        categories:
                          - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                            name: Hamburguesas
                        offerCount: 2
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
