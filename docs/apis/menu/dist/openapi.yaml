components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de acceso indicado en api.md.
  schemas:
    PageMeta:
      type: object
      description: Metadatos que indican qué página se devolvió y el tamaño y total de la colección paginada.
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Número de la página devuelta, empezando en 1.
          example: 1
        pageSize:
          type: integer
          minimum: 1
          description: Cantidad solicitada de elementos por página; admite cualquier entero positivo.
          example: 12
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que coinciden con la consulta.
          example: 0
        totalPages:
          type: integer
          minimum: 0
          description: Cantidad total de páginas para el tamaño solicitado.
          example: 0
      example:
        page: 2
        pageSize: 20
        total: 51
        totalPages: 3
    Image:
      type: object
      description: Imagen de catálogo y sus URL de visualización.
      required:
        - id
        - url
        - thumbnailUrl
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la imagen.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url:
          type: string
          format: uri
          description: URL de la imagen original.
          example: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl:
          type: string
          format: uri
          description: URL de la miniatura de la imagen.
          example: https://cdn.example.com/menu/burger-thumbnail.jpg
      example:
        id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    InventoryItem:
      type: object
      description: Insumo de inventario referenciado por una receta u opción de una composición.
      required:
        - id
        - name
        - unit
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID del insumo.
          example: 5c67b890-1a2b-4d3e-8f9a-0b1c2d3e4f5a
        name:
          type: string
          description: Nombre legible del insumo.
          example: Carne Molida Res 80/20
        unit:
          type: string
          description: Unidad usada para expresar la cantidad del insumo.
          example: g
      example:
        id: 5c67b890-1a2b-4d3e-8f9a-0b1c2d3e4f5a
        name: Carne Molida Res 80/20
        unit: g
    Error:
      type: object
      description: Datos del error devuelto por la API.
      required:
        - message
      properties:
        message:
          type: string
          description: Explicación del error para quien consume la API.
        details:
          type: object
          description: Datos adicionales opcionales y específicos de la respuesta de error.
          additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Envoltura estándar de una respuesta de error.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    ValidationErrorEnvelope:
      type: object
      description: Envoltura estándar que contiene un error de validación.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ValidationError'
      example:
        error:
          message: El cuerpo de la solicitud contiene campos no válidos.
          details:
            violations:
              - path: /name
                message: El nombre es obligatorio.
    Category:
      type: object
      description: Categoría comercial que permite clasificar las entradas del catálogo.
      required:
        - id
        - name
        - description
        - entryCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          description: Nombre que se muestra para la categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve del contenido de la categoría.
          example: Bebidas frías y preparadas.
        entryCount:
          type: integer
          minimum: 0
          description: Cantidad de entradas asociadas a la categoría.
          example: 4
      example:
        id: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name: Bebidas
        description: Bebidas frías y preparadas.
        entryCount: 4
    CategoryReference:
      type: object
      description: Referencia resumida a una categoría asociada con una entrada.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          description: Nombre de la categoría.
          example: Bebidas
    CategoryCreateRequest:
      type: object
      description: Datos para crear una categoría.
      required:
        - name
      properties:
        name:
          type: string
          description: Nombre que tendrá la nueva categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve del contenido de la categoría.
          example: Bebidas frías y preparadas.
    CategoryPatchRequest:
      type: object
      description: Campos de categoría que se desean actualizar.
      properties:
        name:
          type: string
          description: Nuevo nombre de la categoría, si se desea cambiar.
          example: Bebidas preparadas
        description:
          type: string
          description: Nueva explicación de la categoría, si se desea cambiar.
          example: Bebidas frías y preparadas al momento.
    CategoryListResponse:
      type: object
      description: Colección paginada de categorías.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CategoryResponse:
      type: object
      description: Respuesta que contiene una categoría.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Category'
    EntryStatus:
      type: string
      description: Estado administrativo de una entrada del catálogo.
      enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED
      example: ACTIVE
    CatalogEntrySummary:
      type: object
      description: Campos de catálogo que identifican una entrada y resumen su clasificación y cantidad de ofertas.
      required:
        - id
        - brandName
        - description
        - status
        - image
        - categories
        - offerCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la entrada.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName:
          type: string
          description: Nombre comercial que se muestra para la entrada.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la entrada del catálogo.
          example: Hamburguesa con piña asada y queso.
        status:
          $ref: '#/components/schemas/EntryStatus'
        image:
          $ref: '#/components/schemas/Image'
        categories:
          description: Categorías asociadas a la entrada.
          type: array
          items:
            $ref: '#/components/schemas/CategoryReference'
        offerCount:
          type: integer
          minimum: 0
          description: Cantidad de ofertas asociadas a la entrada.
          example: 2
      example:
        id: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName: Hamburguesa Hawaiana
        description: Hamburguesa con piña asada y queso.
        status: ACTIVE
        image:
          id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
          url: https://cdn.example.com/menu/burger.jpg
          thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
        categories:
          - id: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
            name: Hamburguesas
        offerCount: 2
    CatalogEntryDetail:
      type: object
      description: Datos completos de una entrada, incluidos sus identificadores de categoría.
      required:
        - id
        - brandName
        - description
        - status
        - image
        - categoryIds
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la entrada.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName:
          type: string
          description: Nombre comercial que se muestra para la entrada.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la entrada del catálogo.
          example: Hamburguesa con piña asada y queso.
        status:
          $ref: '#/components/schemas/EntryStatus'
        image:
          $ref: '#/components/schemas/Image'
        categoryIds:
          description: Identificadores UUID de las categorías asociadas a la entrada.
          type: array
          items:
            type: string
            format: uuid
          example:
            - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
      example:
        id: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName: Hamburguesa Hawaiana
        description: Hamburguesa con piña asada y queso.
        status: ACTIVE
        image:
          id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
          url: https://cdn.example.com/menu/burger.jpg
          thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
        categoryIds:
          - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
    CatalogEntryCreateRequest:
      type: object
      description: Datos requeridos para crear una entrada y asociarla con sus categorías.
      required:
        - brandName
        - description
        - status
        - categoryIds
      properties:
        brandName:
          type: string
          description: Nombre comercial de la nueva entrada.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la nueva entrada.
          example: Hamburguesa con piña asada y queso.
        status:
          $ref: '#/components/schemas/EntryStatus'
