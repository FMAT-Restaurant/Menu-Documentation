                  inventoryItemId: CARNE-150G
                  quantity: 150
                  displayName: Carne Molida Res 80/20
                  status: INACTIVE
    CatalogOfferPatchRequest:
      type: object
      description: Campos de una oferta que se desean actualizar mediante JSON; todos son opcionales y los omitidos se conservan. imageId no se acepta. Enviar composition.slots reemplaza la lista completa de grupos (los ausentes se eliminan con sus opciones); enviar options en un grupo reemplaza la lista completa de opciones de ese grupo (las ausentes se eliminan); omitir slots u options conserva la lista vigente. Los elementos existentes se identifican por slotId u optionId y conservan los campos omitidos; los nuevos se envían sin identificador. Se valida el resultado completo antes de persistir y cualquier error rechaza toda la operación. If-Match protege la oferta y su composición.
      additionalProperties: false
      properties:
        presentationTag:
          type: string
          minLength: 1
          description: Nueva etiqueta de presentación, si se desea cambiar.
          example: Combo familiar
        basePrice:
          type: number
          description: Nuevo precio base, si se desea cambiar.
          example: 195
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Estado administrativo solicitado. Activar exige una composición válida, que toda oferta mantiene, y no exige disponibilidad; se rechaza con 409 ENTRY_ARCHIVED si la entrada está archivada. Exige menu:offers:status.
        composition:
          $ref: '#/components/schemas/CompositionPatchInput'
    CatalogOfferListResponse:
      type: object
      description: Página de ofertas que coincide con los filtros de la consulta.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOfferSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CatalogOfferResponse:
      type: object
      description: Respuesta que contiene una oferta del catálogo.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogOfferDetail'
    Composition:
      type: object
      description: Composición de una oferta, expresada como una colección de grupos de selección.
      required:
        - slots
      properties:
        slots:
          type: array
          description: Grupos de selección en el orden de presentación, que es también el orden de sucesión de sus rondas.
          items:
            $ref: '#/components/schemas/CompositionSlot'
      example:
        slots:
          - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
            name: Hamburguesa
            quantity: 1
            isAvailable: true
            course: plato fuerte
            options:
              - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                sourceType: RECIPE
                recipeId: c4813f65-00b4-4921-874e-03c555796401
                displayName: Hamburguesa hawaiana
                status: ACTIVE
                isAvailable: true
    CompositionInput:
      type: object
      description: Datos de la composición inicial enviados al crear una oferta.
      additionalProperties: false
      required:
        - slots
      properties:
        slots:
          type: array
          minItems: 1
          description: Grupos de selección en el orden de presentación, que es también el orden de sucesión de sus rondas.
          items:
            $ref: '#/components/schemas/CompositionSlotInput'
    CompositionPatchInput:
      type: object
      additionalProperties: false
      description: Composición enviada al PATCH; omitir slots o enviar un objeto vacío conserva los grupos de selección vigentes. Enviar slots reemplaza la lista completa y no admite una lista vacía.
      properties:
        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompositionSlotPatchInput'
    CompositionSlotPatchInput:
      type: object
      additionalProperties: false
      description: Con slotId actualiza un grupo existente de esta oferta y conserva los campos omitidos; sin slotId crea un grupo y requiere name, quantity y options. options reemplaza la lista completa de opciones del grupo; omitirlo en un grupo existente la conserva. Identificadores desconocidos, ajenos o duplicados devuelven 422. course null retira el tiempo de servicio.
      properties:
        slotId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        quantity:
          type: number
          description: Número de rondas; rangos y precisión pendientes en OPEN-006.
        course:
          type:
            - string
            - 'null'
          enum:
            - entrada
            - plato fuerte
            - postre
            - bebida
            - null
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SlotOptionPatchInput'
      allOf:
        - if:
            not:
              properties:
                slotId: {}
                name: {}
                quantity: {}
                course: {}
                options: {}
              required:
                - slotId
          then:
            properties:
              name: {}
              quantity: {}
              options: {}
              slotId: {}
              course: {}
            required:
              - name
              - quantity
              - options
    SlotOptionPatchInput:
      description: 'Con optionId actualiza una opción existente del grupo; sin optionId crea una opción nueva y el servidor genera su identificador. El tipo de contenido de una opción no cambia: un sourceType distinto del almacenado devuelve 422 SOURCE_TYPE_IMMUTABLE; para usar el otro tipo se crea una opción nueva. Identificadores desconocidos, ajenos o duplicados devuelven 422. Incluir status en una opción existente es un cambio de estado y exige menu:offers:status; el status de una opción nueva forma parte de su alta.'
      oneOf:
        - $ref: '#/components/schemas/RecipeSlotOptionPatchInput'
        - $ref: '#/components/schemas/InventoryItemSlotOptionPatchInput'
    CompositionSlot:
      type: object
      description: Grupo de selección de la composición con su número de rondas, su tiempo de servicio opcional y sus opciones.
      required:
        - slotId
        - name
        - quantity
        - isAvailable
        - options
      properties:
        slotId:
          type: string
          format: uuid
          description: Identificador UUID del grupo de selección.
          example: b37c1bd7-17b2-47a2-a3a4-802559445301
        name:
          type: string
          description: Nombre que identifica el grupo de selección dentro de la composición.
          example: Hamburguesa
        quantity:
          type: number
          description: 'Número de rondas del grupo de selección: en cada ronda se elige una opción. No es una cantidad física; rangos y precisión pendientes en OPEN-006.'
          example: 1
        isAvailable:
          type: boolean
          readOnly: true
          description: true si y solo si al menos una opción ACTIVE del grupo está disponible.
          example: true
        course:
          type: string
          enum:
            - entrada
            - plato fuerte
            - postre
            - bebida
          description: Tiempo de servicio al que pertenece el grupo de selección, si se especifica.
          example: plato fuerte
        options:
          type: array
          description: Opciones del grupo en el orden de presentación establecido por el administrador.
          items:
            $ref: '#/components/schemas/SlotOption'
      example:
