        variables:
          inventoryHost:
            default: inventory.example.invalid
            description: Dominio reservado como marcador del host del microservicio de Inventario; reemplazarlo por el host de despliegue. La URL base y el prefijo de ruta reales de Inventario no están definidos y pueden cambiar.
    get:
